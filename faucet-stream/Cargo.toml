[package]
name = "faucet-stream"
version = "1.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A declarative, config-driven data pipeline with pluggable source and sink connectors"
readme = "../README.md"
keywords = ["rest", "api", "meltano", "bigquery", "streaming"]
categories = ["database", "asynchronous", "encoding"]
exclude = [".trunk/"]

[features]
default = ["source-rest"]

## All source connectors.
source = [
    "source-rest",
    "source-graphql",
    "source-xml",
    "source-grpc",
    "source-kafka",
    "source-kinesis",
    "source-postgres",
    "source-postgres-cdc",
    "source-mysql",
    "source-mssql",
    "source-sqlite",
    "source-duckdb",
    "source-sqs",
    "source-nats",
    "source-sftp",
    "source-s3",
    "source-mongodb",
    "source-mongodb-cdc",
    "source-mysql-cdc",
    "source-mssql-cdc",
    "source-redshift",
    "source-pubsub",
    "source-clickhouse",
    "source-azure-blob",
    "source-redis",
    "source-webhook",
    "source-websocket",
    "source-csv",
    "source-elasticsearch",
    "source-parquet",
    "source-delta",
    "source-databricks",
    "source-gcs",
    "source-bigquery",
    "source-snowflake",
    "source-spanner",
    "source-singer",
]
## All sink connectors.
sink = [
    "sink-bigquery",
    "sink-postgres",
    "sink-jsonl",
    "sink-snowflake",
    "sink-kafka",
    "sink-kinesis",
    "sink-mysql",
    "sink-mssql",
    "sink-sqlite",
    "sink-duckdb",
    "sink-sqs",
    "sink-nats",
    "sink-sftp",
    "sink-s3",
    "sink-mongodb",
    "sink-redis",
    "sink-csv",
    "sink-elasticsearch",
    "sink-http",
    "sink-stdout",
    "sink-parquet",
    "sink-delta",
    "sink-gcs",
    "sink-iceberg",
    "sink-spanner",
    "sink-redshift",
    "sink-pubsub",
    "sink-clickhouse",
    "sink-azure-blob",
]
## All state-store backends (file backend is exposed via `faucet-core` directly).
state = [
    "state-redis",
    "state-postgres",
]
## Enable gzip/zstd compression on every file-shaped connector that has been
## opted in (via its per-connector feature). Forwards through to each
## connector's `compression` feature using optional-dep syntax, so this
## flag does not pull connectors the user has not requested.
compression = [
    "faucet-source-csv?/compression",
    "faucet-source-s3?/compression",
    "faucet-source-gcs?/compression",
    "faucet-sink-jsonl?/compression",
    "faucet-sink-csv?/compression",
    "faucet-sink-s3?/compression",
    "faucet-sink-gcs?/compression",
    "faucet-source-azure-blob?/compression",
    "faucet-sink-azure-blob?/compression",
]
## Opt-in Arrow columnar record path (RFC 0002 / #375). Activates the columnar
## fast path on whichever Arrow-capable connectors the user has already enabled
## (optional-dep `?` syntax, so this flag never pulls a connector itself) and
## forwards the core capability. A `parquet -> parquet` chain then runs Arrow
## end-to-end with no `Value` materialization; other connectors are untouched.
arrow = [
    "faucet-core/arrow",
    "faucet-source-parquet?/arrow",
    "faucet-sink-parquet?/arrow",
    "faucet-source-delta?/arrow",
    "faucet-sink-delta?/arrow",
    "faucet-source-s3?/arrow",
    "faucet-sink-s3?/arrow",
    "faucet-source-gcs?/arrow",
    "faucet-sink-gcs?/arrow",
    "faucet-source-databricks?/arrow",
    "faucet-source-bigquery?/arrow",
    "faucet-sink-bigquery?/arrow",
    "faucet-sink-snowflake?/arrow",
]
## Shared, single-flight auth providers (OAuth2 client-credentials / refresh,
## token-endpoint) usable across connectors via `auth: { ref }`.
auth = ["dep:faucet-auth"]
## Data-quality checks (`quality:` config block). `quality-jsonschema` adds the
## `json_schema` record check via a JSON Schema validator. Forwarded to
## `faucet-core`.
quality = ["faucet-core/quality"]
quality-jsonschema = ["quality", "faucet-core/quality-jsonschema"]
## Data contracts (`contract:` config block, #204): a versioned output
## schema/constraint promise enforced per page. Forwarded to `faucet-core`.
contract = ["faucet-core/contract"]
## PII detection + column-level masking (`masking:` config block, #206):
## classify sensitive fields and redact/hash/tokenize/partial-mask them per
## page, before every sink. Forwarded to `faucet-core`.
masking = ["faucet-core/masking"]
## OpenLineage emission (`lineage:` config block). `lineage-kafka` adds the
## Kafka transport. Forwarded to `faucet-lineage`.
lineage = ["dep:faucet-lineage"]
lineage-kafka = ["lineage", "faucet-lineage/transport-kafka"]
## SQL-as-transform via embedded DuckDB.
transform-sql = ["dep:faucet-transform-sql"]
## WebAssembly-as-transform: run a user-provided sandboxed `.wasm` module per
## record (issue #124). Loads via wasmtime; any language that compiles to core
## wasm can express arbitrary per-record logic.
transform-wasm = ["dep:faucet-transform-wasm"]
## Encryption at rest (#207): AES-256-GCM for FileStateStore bookmarks and,
## when `sink-jsonl` is also enabled, per-line JSONL output (the file DLQ
## shape). Forwarded to `faucet-core` (and the jsonl sink via optional-dep
## syntax, so this flag never pulls the connector itself).
encryption = ["faucet-core/encryption", "faucet-sink-jsonl?/encryption"]
## Every connector and state backend.
full = ["source", "sink", "state", "auth", "kafka-schema-registry", "compression", "arrow", "quality", "quality-jsonschema", "contract", "masking", "lineage", "lineage-kafka", "transform-sql", "transform-wasm", "transform-cdc-unwrap", "encryption", "delta-s3", "delta-azure", "delta-gcs"]

## Individual source connectors.
source-rest = ["dep:faucet-source-rest"]
source-singer = ["dep:faucet-source-singer"]
source-graphql = ["dep:faucet-source-graphql"]
source-xml = ["dep:faucet-source-xml"]
source-grpc = ["dep:faucet-source-grpc"]
source-postgres = ["dep:faucet-source-postgres"]
source-postgres-cdc = ["dep:faucet-source-postgres-cdc"]
source-mysql = ["dep:faucet-source-mysql"]
source-mssql = ["dep:faucet-source-mssql"]
source-sqlite = ["dep:faucet-source-sqlite"]
source-duckdb = ["dep:faucet-source-duckdb"]
source-sqs = ["dep:faucet-source-sqs", "dep:faucet-common-sqs"]
source-nats = ["dep:faucet-source-nats", "dep:faucet-common-nats"]
source-sftp = ["dep:faucet-source-sftp", "dep:faucet-common-sftp"]
source-s3 = ["dep:faucet-source-s3"]
source-mongodb = ["dep:faucet-source-mongodb"]
source-mongodb-cdc = ["dep:faucet-source-mongodb-cdc"]
source-mysql-cdc = ["dep:faucet-source-mysql-cdc"]
source-mssql-cdc = ["dep:faucet-source-mssql-cdc"]
source-redshift = ["dep:faucet-source-redshift", "dep:faucet-common-redshift"]
source-pubsub = ["dep:faucet-source-pubsub", "dep:faucet-common-pubsub"]
source-clickhouse = ["dep:faucet-source-clickhouse", "dep:faucet-common-clickhouse"]
source-azure-blob = ["dep:faucet-source-azure-blob", "dep:faucet-common-azure"]
source-redis = ["dep:faucet-source-redis"]
source-webhook = ["dep:faucet-source-webhook"]
source-websocket = ["dep:faucet-source-websocket"]
source-csv = ["dep:faucet-source-csv"]
source-elasticsearch = ["dep:faucet-source-elasticsearch"]
source-kafka = ["dep:faucet-source-kafka", "dep:faucet-common-kafka"]
source-kinesis = ["dep:faucet-source-kinesis", "dep:faucet-common-kinesis"]
source-parquet = ["dep:faucet-source-parquet"]
source-delta = ["dep:faucet-source-delta"]
source-databricks = ["dep:faucet-source-databricks"]
source-gcs = ["dep:faucet-source-gcs", "dep:faucet-common-gcs"]
source-bigquery = ["dep:faucet-source-bigquery", "dep:faucet-common-bigquery"]
source-snowflake = ["dep:faucet-source-snowflake", "dep:faucet-common-snowflake"]
## Enable the Google Cloud Spanner query source.
source-spanner = ["dep:faucet-source-spanner", "dep:faucet-common-spanner"]

## Individual sink connectors.
sink-bigquery = ["dep:faucet-sink-bigquery"]
sink-iceberg = ["dep:faucet-sink-iceberg"]
## Forward optional catalog features to the iceberg sink via optional-dep syntax.
sink-iceberg-glue = ["faucet-sink-iceberg?/catalog-glue"]
sink-iceberg-sql  = ["faucet-sink-iceberg?/catalog-sql"]
sink-iceberg-hms  = ["faucet-sink-iceberg?/catalog-hms"]
sink-postgres = ["dep:faucet-sink-postgres"]
sink-jsonl = ["dep:faucet-sink-jsonl"]
sink-snowflake = ["dep:faucet-sink-snowflake"]
sink-mysql = ["dep:faucet-sink-mysql"]
sink-mssql = ["dep:faucet-sink-mssql"]
sink-sqlite = ["dep:faucet-sink-sqlite"]
sink-duckdb = ["dep:faucet-sink-duckdb"]
sink-sqs = ["dep:faucet-sink-sqs", "dep:faucet-common-sqs"]
sink-nats = ["dep:faucet-sink-nats", "dep:faucet-common-nats"]
sink-sftp = ["dep:faucet-sink-sftp", "dep:faucet-common-sftp"]

sink-s3 = ["dep:faucet-sink-s3"]
sink-mongodb = ["dep:faucet-sink-mongodb"]
sink-redis = ["dep:faucet-sink-redis"]
sink-csv = ["dep:faucet-sink-csv"]
sink-elasticsearch = ["dep:faucet-sink-elasticsearch"]
sink-http = ["dep:faucet-sink-http"]
sink-stdout = ["dep:faucet-sink-stdout"]
sink-kafka = ["dep:faucet-sink-kafka", "dep:faucet-common-kafka"]
sink-kinesis = ["dep:faucet-sink-kinesis", "dep:faucet-common-kinesis"]
## Enable the Google Cloud Spanner sink.
sink-spanner = ["dep:faucet-sink-spanner", "dep:faucet-common-spanner"]
sink-parquet = ["dep:faucet-sink-parquet"]
sink-delta = ["dep:faucet-sink-delta"]
## Delta Lake cloud object-store backends. Forwarded to whichever delta
## connector is enabled via optional-dep (`?`) syntax. In `full`; not default.
delta-s3 = ["faucet-source-delta?/s3", "faucet-sink-delta?/s3"]
delta-azure = ["faucet-source-delta?/azure", "faucet-sink-delta?/azure"]
delta-gcs = ["faucet-source-delta?/gcs", "faucet-sink-delta?/gcs"]
sink-gcs = ["dep:faucet-sink-gcs", "dep:faucet-common-gcs"]
sink-redshift = ["dep:faucet-sink-redshift", "dep:faucet-common-redshift"]
sink-pubsub = ["dep:faucet-sink-pubsub", "dep:faucet-common-pubsub"]
sink-clickhouse = ["dep:faucet-sink-clickhouse", "dep:faucet-common-clickhouse"]
sink-azure-blob = ["dep:faucet-sink-azure-blob", "dep:faucet-common-azure"]

## Kafka Schema Registry support (forwarded to kafka crates).
kafka-schema-registry = [
    "faucet-common-kafka?/schema-registry",
    "faucet-source-kafka?/schema-registry",
    "faucet-sink-kafka?/schema-registry",
]

## Individual state-store backends.
state-redis = ["dep:faucet-state-redis"]
state-postgres = ["dep:faucet-state-postgres"]

## Transform features (forwarded to source-rest when enabled).
transform-flatten = ["faucet-source-rest?/transform-flatten"]
transform-rename-keys = ["faucet-source-rest?/transform-rename-keys"]
transform-select = ["faucet-source-rest?/transform-select"]
transform-drop = ["faucet-source-rest?/transform-drop"]
transform-set = ["faucet-source-rest?/transform-set"]
transform-rename-field = ["faucet-source-rest?/transform-rename-field"]
transform-cast = ["faucet-source-rest?/transform-cast"]
transform-redact = ["faucet-source-rest?/transform-redact"]
transform-value-case = ["faucet-source-rest?/transform-value-case"]
transform-spell-symbols = ["faucet-source-rest?/transform-spell-symbols"]
transform-keys-case = ["faucet-source-rest?/transform-keys-case"]
transform-hash = ["faucet-source-rest?/transform-hash"]
transform-json-parse = ["faucet-source-rest?/transform-json-parse"]
transform-coalesce = ["faucet-source-rest?/transform-coalesce"]
transform-split-join = ["faucet-source-rest?/transform-split-join"]
transform-filter = ["faucet-source-rest?/transform-filter"]
transform-explode = ["faucet-source-rest?/transform-explode"]
transform-cdc-unwrap = ["faucet-core/transform-cdc-unwrap"]
transforms = ["faucet-source-rest?/transforms", "transform-cdc-unwrap"]

