# Coverage is measured by the CI `coverage` job (unit + integration tests via
# cargo-llvm-cov). See .github/workflows/ci.yml.
coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 1%         # tolerate a <=1% drop (e.g. a pure refactor) before failing
        informational: false  # enforced gate: a >1% drop in project coverage fails the
                              # `codecov/project` check, so a regression blocks the PR.
    patch:
      default:
        target: 95%           # new/changed code must be >=95% covered
        informational: false  # enforced gate: under-covered new code fails `codecov/patch`.

# Exclude non-library code from the coverage denominator. Mirrors the lcov
# --ignore-filename-regex in the coverage job, with the umbrella crate added
# (pure feature-gated `pub use` re-exports — no testable logic).
ignore:
  - "faucet-stream/**"
  - "**/tests/**"
  - "**/examples/**"
  - "**/benches/**"
  - "cli/examples/**"
  # The GCS connectors' data-plane I/O cannot be exercised in CI: the
  # google-cloud-storage SDK speaks gRPC/JSON that `fake-gcs-server` (REST-only)
  # does not implement, so the GCS integration tests are `#[ignore]`d (#220).
  # These two files are therefore untestable here (S3 uses MinIO and IS covered;
  # Databricks uses wiremock and IS covered). Their pure helpers are still unit
  # tested; excluding the files keeps the coverage denominator honest rather
  # than penalising provably-uncoverable I/O.
  - "crates/source/gcs/src/stream.rs"
  # The ranged-read Parquet adapter (#619) is the same surface: every line that
  # is not a pure helper issues a `read_object` against the gRPC data plane.
  # Its arithmetic and its failure messages — the parts a bug would hide in —
  # are unit-tested in the file itself.
  - "crates/source/gcs/src/parquet_range.rs"
  - "crates/sink/gcs/src/sink.rs"
  # BigQuery Arrow columnar I/O (#380) is provably-uncoverable in CI for the
  # same reasons: the Storage Read API is gRPC with no emulator, and the load
  # sink stages Parquet through the google-cloud-storage SDK (the very SDK the
  # GCS exclusions above cover) before a live load job. The pure helpers
  # (`build_load_job`, `resolve_table`, Parquet encode) are unit-tested; these
  # two files are the untestable transport/I/O.
  - "crates/source/bigquery/src/storage_read.rs"
  - "crates/sink/bigquery/src/load.rs"
  # Staged bulk load (#528) execution shims: they upload a page to the object
  # store and issue `INSERT … SELECT FROM s3()` / `COPY INTO` over the wire,
  # needing a live warehouse that can itself reach a live bucket (and MSSQL's
  # sink cannot be constructed without a reachable server). Provably-uncoverable
  # in CI, exactly like the GCS/BigQuery data-plane above. Their pure logic
  # (SQL/URL generation and the upload-and-build step, tested against an
  # in-memory object store) stays in the denominator.
  - "crates/sink/clickhouse/src/staged_exec.rs"
  - "crates/sink/mssql/src/staged_exec.rs"
