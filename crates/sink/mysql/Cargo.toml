[package]
name = "faucet-sink-mysql"
version = "1.4.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MySQL sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["mysql", "sql", "database", "sink", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "mysql", "json"] }
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
faucet-conformance.workspace = true
schemars.workspace = true
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mysql"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
