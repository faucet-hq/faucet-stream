[package]
name = "faucet-sink-kafka"
version = "1.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Kafka producer sink for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["kafka", "streaming", "producer", "sink", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-kafka.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
rdkafka.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
base64.workspace = true
futures.workspace = true
jsonpath-rust.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }

[features]
default = []
schema-registry = ["faucet-common-kafka/schema-registry"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
