[package]
name = "faucet-sink-bigquery"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BigQuery sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["bigquery", "gcp", "etl", "sink", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-bigquery.workspace = true
gcp-bigquery-client = "0.28.0"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
async-trait.workspace = true

# Arrow columnar load-job path (#380, `arrow` feature): buffer RecordBatches to
# Parquet, stage on GCS, then `jobs.insert` a PARQUET load job.
faucet-common-gcs = { workspace = true, optional = true }
google-cloud-storage = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[features]
# Opt-in Arrow columnar fast path (#380): Arrow RecordBatches → Parquet on a
# GCS staging bucket → BigQuery load job. Additive — default (arrow-off)
# builds are byte-identical to the streaming/MERGE sink.
arrow = [
    "faucet-core/arrow",
    "dep:faucet-common-gcs",
    "dep:google-cloud-storage",
    "dep:arrow",
    "dep:parquet",
    "dep:bytes",
    "dep:uuid",
]

[dev-dependencies]
faucet-conformance.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
tempfile = "3"
serde = { workspace = true }
# Tests only: gunzip captured insertAll request bodies (the client gzips them
# via gcp-bigquery-client's default `gzip` feature) to assert skipInvalidRows.
flate2 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
