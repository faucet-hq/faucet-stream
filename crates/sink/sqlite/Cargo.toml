[package]
name = "faucet-sink-sqlite"
version = "1.4.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["sqlite", "sql", "database", "sink", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "json"] }
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
serde_json.workspace = true
tempfile = "3"
futures.workspace = true
async-trait.workspace = true
faucet-core.workspace = true
faucet-conformance.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "json"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
