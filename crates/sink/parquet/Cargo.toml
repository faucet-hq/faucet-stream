[package]
name = "faucet-sink-parquet"
version = "1.1.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Parquet file sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["parquet", "arrow", "sink", "pipeline", "connector"]
categories.workspace = true

[features]
# Opt into the Arrow columnar fast path (RFC 0002 / #375). When enabled the
# sink implements `supports_columnar`/`write_batch_columnar`, accepting Arrow
# `RecordBatch`es directly so a parquet -> parquet chain never materializes
# `serde_json::Value`. Off by default.
arrow = ["faucet-core/arrow"]

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "rt-multi-thread", "sync"] }
futures.workspace = true
arrow.workspace = true
arrow-json.workspace = true
parquet = { workspace = true }
object_store = { workspace = true, features = ["aws"] }
uuid.workspace = true
url.workspace = true
bytes.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "fs", "io-util"] }
serde_json.workspace = true
faucet-conformance.workspace = true
schemars.workspace = true
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
