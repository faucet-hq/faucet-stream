[package]
name = "faucet-sink-delta"
version = "1.1.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Delta Lake sink for the faucet-stream ecosystem — append-only, local FS + S3/Azure/GCS"
readme = "README.md"
keywords = ["delta", "deltalake", "lakehouse", "sink", "etl"]
categories.workspace = true

[features]
default = []
s3 = ["faucet-common-delta/s3"]
azure = ["faucet-common-delta/azure"]
gcs = ["faucet-common-delta/gcs"]
# Opt-in Arrow columnar fast path (#375): consume `RecordBatch`es so a
# `parquet → delta` / `delta → delta` chain skips `Value` materialization.
arrow = ["faucet-core/arrow"]

[dependencies]
faucet-core.workspace = true
faucet-common-delta.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
deltalake.workspace = true
arrow.workspace = true
arrow-json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
faucet-conformance.workspace = true
# `arrow` on the source dev-dep so the columnar round-trip test can read the
# table back via `stream_batches` (gated on the source's own `arrow` feature).
faucet-source-delta = { workspace = true, features = ["arrow"] }
futures.workspace = true
serde_json.workspace = true
schemars.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
