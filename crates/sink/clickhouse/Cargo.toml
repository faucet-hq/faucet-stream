[package]
name = "faucet-sink-clickhouse"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ClickHouse sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["clickhouse", "olap", "sink", "pipeline", "connector"]
categories.workspace = true

[features]
default = []
# Staged bulk load (#528): stage each page to S3/GCS and have the ClickHouse
# server pull it with the `s3()` / `gcs()` table function. Pulls `object_store`
# via `faucet-core/staging`.
staging = ["faucet-core/staging"]

[dependencies]
faucet-core.workspace = true
faucet-common-clickhouse.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
serde_json.workspace = true
schemars.workspace = true
reqwest = { workspace = true }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["clickhouse"] }
object_store.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
