[package]
name = "faucet-sink-iceberg"
version = "1.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Iceberg sink for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["iceberg", "lakehouse", "sink", "etl", "pipeline"]
categories.workspace = true

[features]
default = ["catalog-rest"]
# Catalog clients + storage factory live in faucet-common-iceberg; these
# forward so the source and sink gate catalogs identically.
catalog-rest = ["faucet-common-iceberg/catalog-rest"]
catalog-glue = ["faucet-common-iceberg/catalog-glue", "storage-opendal"]
catalog-sql  = ["faucet-common-iceberg/catalog-sql",  "storage-opendal"]
catalog-hms  = ["faucet-common-iceberg/catalog-hms",  "storage-opendal"]
# Cloud-warehouse storage (S3/GCS/local) for the non-REST catalogs, via an
# OpenDAL-backed StorageFactory. Auto-enabled by each non-REST catalog feature.
storage-opendal = ["faucet-common-iceberg/storage-opendal"]

[dependencies]
faucet-core.workspace = true
faucet-common-iceberg.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
futures.workspace = true
iceberg = "0.10.0"
uuid.workspace = true
# arrow/arrow-json/parquet aligned to iceberg 0.10.0's arrow major (58, == workspace):
arrow = "58"
arrow-json = "58"
parquet = { version = "58", features = ["async"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
tempfile = "3"
bytes = "1"
iceberg = "0.10.0"
iceberg-catalog-sql = "0.10.0"
# sqlx runtime-tokio must be enabled explicitly here because iceberg-catalog-sql's
# production dep only enables the `any` feature (no runtime).  Without this the
# pool panics at runtime: "either the `runtime-async-std` or `runtime-tokio`
# feature must be enabled".
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "any"] }
serde_json.workspace = true
faucet-conformance.workspace = true
schemars.workspace = true
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["minio"] }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
iceberg-storage-opendal = { version = "0.10.0", default-features = false, features = ["opendal-s3", "opendal-gcs", "opendal-fs"] }
typetag = "0.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
