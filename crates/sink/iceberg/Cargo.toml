[package]
name = "faucet-sink-iceberg"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Iceberg sink for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["iceberg", "lakehouse", "sink", "etl", "pipeline"]
categories.workspace = true

[features]
default = ["catalog-rest"]
catalog-rest = ["dep:iceberg-catalog-rest"]
catalog-glue = ["dep:iceberg-catalog-glue", "storage-opendal"]
catalog-sql  = ["dep:iceberg-catalog-sql",  "storage-opendal"]
catalog-hms  = ["dep:iceberg-catalog-hms",  "storage-opendal"]
# Cloud-warehouse storage (S3/GCS/local) for the non-REST catalogs, via an
# OpenDAL-backed StorageFactory. Auto-enabled by each non-REST catalog feature.
storage-opendal = ["dep:iceberg-storage-opendal", "dep:typetag"]

[dependencies]
faucet-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
futures.workspace = true
iceberg = "0.10.0"
uuid.workspace = true
# arrow/arrow-json/parquet aligned to iceberg 0.10.0's arrow major (58, == workspace):
arrow = "58"
arrow-json = "58"
parquet = { version = "58", features = ["async"] }
iceberg-catalog-rest = { version = "0.10.0", optional = true }
iceberg-catalog-glue = { version = "0.10.0", optional = true }
iceberg-catalog-sql  = { version = "0.10.0", optional = true }
iceberg-catalog-hms  = { version = "0.10.0", optional = true }
iceberg-storage-opendal = { version = "0.10.0", default-features = false, features = ["opendal-s3", "opendal-gcs", "opendal-fs"], optional = true }
typetag = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
tempfile = "3"
bytes = "1"
iceberg = "0.10.0"
iceberg-catalog-sql = "0.10.0"
# sqlx runtime-tokio must be enabled explicitly here because iceberg-catalog-sql's
# production dep only enables the `any` feature (no runtime).  Without this the
# pool panics at runtime: "either the `runtime-async-std` or `runtime-tokio`
# feature must be enabled".
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "any"] }
serde_json.workspace = true
faucet-conformance.workspace = true
schemars.workspace = true
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["minio"] }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
