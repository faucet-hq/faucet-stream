[package]
name = "faucet-sink-gcs"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Google Cloud Storage sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["gcs", "gcp", "storage", "sink", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-gcs.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
google-cloud-storage.workspace = true
futures.workspace = true
bytes.workspace = true
uuid.workspace = true
# Arrow columnar path (opt-in `arrow` feature, RFC 0002 / #375): encode Arrow
# `RecordBatch`es to Parquet objects for the row + columnar lanes. Optional so
# default builds pull neither `parquet` nor `arrow`.
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }

[features]
compression = ["faucet-core/compression"]
# Enables the `Parquet` object format + the columnar `write_batch_columnar` fast path.
arrow = ["faucet-core/arrow", "dep:arrow", "dep:parquet"]
# Uniform file formats (#604): write CSV, XML and Excel objects through
# `faucet_core::file_format`, so what this sink can write matches what the file
# sources can read. `file-formats` is the aggregate.
file-format-csv = ["faucet-core/file-format-csv"]
file-format-xml = ["faucet-core/file-format-xml"]
file-format-excel = ["faucet-core/file-format-excel"]
file-formats = ["file-format-csv", "file-format-xml", "file-format-excel"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
faucet-conformance.workspace = true
schemars.workspace = true
testcontainers = "0.27"
faucet-source-gcs = { workspace = true }
reqwest = { workspace = true }
urlencoding.workspace = true
futures.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
enum_variant_added = "allow"
