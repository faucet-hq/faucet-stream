[package]
name = "faucet-sink-redis"
version = "1.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Redis sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["redis", "streaming", "sink", "pipeline", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
redis = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
serde_json.workspace = true
faucet-conformance.workspace = true
schemars.workspace = true
futures.workspace = true
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["redis"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
