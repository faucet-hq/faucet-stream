[package]
name = "faucet-sink-sftp"
version = "1.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SFTP sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["sftp", "ssh", "file", "etl", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-file.workspace = true
faucet-common-sftp.workspace = true
russh-sftp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "sync", "fs"] }
# The `Parquet` format + the columnar path (#777).
arrow = { workspace = true, optional = true }
uuid.workspace = true

[features]
# Uniform file formats (#604): write CSV, XML and Excel files through
# `faucet_core::file_format`, so what this sink can write matches what the file
# sources can read. `file-formats` is the aggregate.
file-format-csv = ["faucet-core/file-format-csv", "faucet-common-file/file-format-csv"]
file-format-xml = ["faucet-core/file-format-xml", "faucet-common-file/file-format-xml"]
file-format-excel = ["faucet-core/file-format-excel", "faucet-common-file/file-format-excel"]
# Avro Object Container Files (#719). ORC is read-only, so sinks have no ORC
# feature.
file-format-avro = ["faucet-core/file-format-avro", "faucet-common-file/file-format-avro"]
file-formats = ["file-format-csv", "file-format-xml", "file-format-excel", "file-format-avro"]
# gzip / zstd files (#777).
compression = ["faucet-core/compression"]
# Encrypt files at rest (#777).
encryption = ["faucet-common-file/encryption"]
# Parquet files through the shared writer and the columnar fast path (#777).
arrow = ["faucet-core/arrow", "faucet-common-file/file-format-parquet", "dep:arrow"]

[dev-dependencies]
faucet-conformance = { workspace = true, features = ["containers"] }
faucet-common-sftp.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
schemars.workspace = true
futures = { workspace = true }
testcontainers = "0.27"
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
enum_variant_added = "allow"
