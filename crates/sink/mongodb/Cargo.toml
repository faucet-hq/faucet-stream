[package]
name = "faucet-sink-mongodb"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MongoDB sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["mongodb", "nosql", "database", "sink", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
mongodb = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
serde_json.workspace = true
faucet-conformance.workspace = true
schemars.workspace = true
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mongo"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
