[package]
name = "faucet-sink-oracle"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Oracle Database sink for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["oracle", "database", "sql", "sink", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-oracle.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
faucet-conformance.workspace = true
faucet-source-oracle.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
serde_json.workspace = true
schemars.workspace = true
testcontainers = "0.27"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
