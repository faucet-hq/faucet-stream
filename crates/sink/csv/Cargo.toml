[package]
name = "faucet-sink-csv"
version = "1.1.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CSV file sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["csv", "etl", "sink", "pipeline", "data"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
csv = { workspace = true }
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "fs"] }
serde_json.workspace = true
faucet-conformance.workspace = true
schemars.workspace = true
tempfile = "3"

[features]
compression = ["faucet-core/compression"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
