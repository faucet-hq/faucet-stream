[package]
name = "faucet-sink-snowflake"
version = "1.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Snowflake sink connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["snowflake", "sql", "etl", "sink", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-snowflake.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
# `sync` for the `OnceCell` guarding the one-shot exactly-once watermark-table
# DDL. Declared here (not relied on via feature unification) so the
# feature-isolation CI matrix, which builds this crate alone, still compiles.
tokio = { workspace = true, features = ["sync"] }
reqwest.workspace = true
base64.workspace = true
uuid.workspace = true

# Arrow columnar bulk-load path (#381, `arrow` feature): buffer RecordBatches
# to Parquet, upload to an external stage's cloud storage, then `COPY INTO`.
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
object_store = { workspace = true, features = ["aws", "gcp", "azure"], optional = true }
url = { workspace = true, optional = true }

[features]
# Opt-in Arrow columnar fast path (RFC 0002 / #375, #381). Additive: default
# (arrow-off) builds are byte-identical to the row-only sink.
arrow = ["faucet-core/arrow", "dep:arrow", "dep:parquet", "dep:object_store", "dep:url"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json.workspace = true
faucet-conformance.workspace = true
schemars.workspace = true
wiremock = "0.6"
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
