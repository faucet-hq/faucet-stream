    "source-sqlite",
    "source-sqs",
    "source-webhook",
    "source-websocket",
    "source-xml",
    "source-xml-excel",
]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
cargo-args = ["--jobs", "4"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of the registry's types are NOT part of this crate's
# stability surface — `RegistryError` and `BuildPolicy` are `#[non_exhaustive]`;
# match with a `_` arm. So adding an error variant, a field or a connector
# feature never forces a major. Every other API-stability lint stays at its
# default (deny) level, so genuine removals and signature changes still fail
# the gate.
[package.metadata.cargo-semver-checks.lints]
enum_marked_non_exhaustive = "allow"
enum_variant_added = "allow"
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
