[package]
name = "faucet-registry"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://faucet-hq.github.io/faucet-stream/"
description = "Build any faucet-stream source or sink from its type name and a JSON config: the by-name connector registry and shared auth catalog, for tools that embed faucet"
readme = "README.md"
exclude = ["tests/fixtures/**"]
keywords = ["registry", "connector", "etl", "pipeline", "faucet"]
categories.workspace = true

[features]
# No connector is on by default: enable the ones you need, or an aggregate.
default = []

# Every first-party source and sink, as in the `faucet` CLI's default build.
# The Oracle connectors load Oracle Instant Client at run time, so they are in
# `full` but not in these two (matching the CLI).
source = [
    "source-rest",
    "source-graphql",
    "source-xml",
    "source-grpc",
    "source-postgres",
    "source-postgres-cdc",
    "source-mysql",
    "source-mssql",
    "source-sqlite",
    "source-duckdb",
    "source-sqs",
    "source-nats",
    "source-rabbitmq",
    "source-sftp",
    "source-s3",
    "source-mongodb",
    "source-mongodb-cdc",
    "source-mysql-cdc",
    "source-mssql-cdc",
    "source-redshift",
    "source-pubsub",
    "source-clickhouse",
    "source-azure-blob",
    "source-redis",
    "source-webhook",
    "source-websocket",
    "source-csv",
    "source-file",
    "source-elasticsearch",
    "source-kafka",
    "source-kinesis",
    "source-parquet",
    "source-delta",
    "source-databricks",
    "source-iceberg",
    "source-dynamodb",
    "source-gcs",
    "source-bigquery",
    "source-snowflake",
    "source-spanner",
    "source-singer",
]
sink = [
    "sink-bigquery",
    "sink-file",
    "sink-postgres",
    "sink-jsonl",
    "sink-snowflake",
    "sink-mysql",
    "sink-mssql",
    "sink-sqlite",
    "sink-duckdb",
    "sink-sqs",
    "sink-nats",
    "sink-rabbitmq",
    "sink-sftp",
    "sink-singer",
    "sink-s3",
    "sink-mongodb",
    "sink-redis",
    "sink-csv",
    "sink-elasticsearch",
    "sink-http",
    "sink-stdout",
    "sink-kafka",
    "sink-kinesis",
    "sink-parquet",
    "sink-delta",
    "sink-gcs",
    "sink-iceberg",
    "sink-dynamodb",
    "sink-databricks",
    "sink-spanner",
    "sink-redshift",
    "sink-pubsub",
    "sink-clickhouse",
    "sink-azure-blob",
]

# Everything in this manifest.
full = [
    "source",
    "sink",
    "source-rest-excel",
    "source-xml-excel",
    "source-iceberg-glue",
    "source-iceberg-sql",
    "source-iceberg-hms",
    "source-oracle",
    "source-oracle-cdc",
    "sink-iceberg-glue",
    "sink-iceberg-sql",
    "sink-iceberg-hms",
    "sink-mssql-staging",
    "sink-clickhouse-staging",
    "sink-databricks-staging",
    "sink-oracle",
    "delta-s3",
    "delta-azure",
    "delta-gcs",
    "kafka-schema-registry",
    "compression",
    "file-format-csv",
    "file-format-xml",
    "file-format-excel",
    "file-format-avro",
    "file-format-orc",
    "file-format-parquet",
    "file-formats",
    "mtls",
    "rabbitmq-tls",
    "oauth1",
    "google-sa",
    "arrow",
    "encryption",
]

# Connectors.
