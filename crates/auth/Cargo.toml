[package]
name = "faucet-auth"
version = "1.0.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared, single-flight authentication providers (OAuth2, token-endpoint) for faucet-stream connectors"
readme = "README.md"
keywords = ["oauth2", "auth", "etl", "pipeline", "faucet"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
reqwest = { workspace = true, features = ["json", "form"] }
jsonpath-rust.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
futures.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
