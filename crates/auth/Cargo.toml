[package]
name = "faucet-auth"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared, single-flight authentication providers (OAuth2, token-endpoint) for faucet-stream connectors"
readme = "README.md"
keywords = ["oauth2", "auth", "etl", "pipeline", "faucet"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
reqwest = { workspace = true, features = ["json", "form"] }
jsonpath-rust.workspace = true
tracing.workspace = true
# HMAC-SHA256 request signing, used by the always-available `flow` provider
# (#511) and by OAuth1 (#496).
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
# RFC 3986 percent-encoding — only OAuth1's signature base string needs it.
percent-encoding = { workspace = true, optional = true }

[features]
# OAuth1 (one-legged, HMAC-SHA256) request-signing provider.
oauth1 = ["dep:percent-encoding"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
futures.workspace = true
tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
