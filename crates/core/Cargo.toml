[package]
name = "faucet-core"
version = "1.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types, traits, and utilities for the faucet-stream ecosystem"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["transform-flatten", "transform-rename-keys", "transform-keys-case"]
transform-flatten = []
transform-rename-keys = ["dep:regex"]
transform-select = []
transform-drop = []
transform-set = []
transform-rename-field = []
transform-cast = ["dep:chrono"]
transform-redact = []
transform-value-case = []
transform-spell-symbols = []
transform-keys-case = []
# SHA-256 / BLAKE3 field pseudonymization (#403). Pulls the hashing + encoding
# deps only when enabled.
transform-hash = ["dep:sha2", "dep:blake3", "dep:base64"]
# Parse a stringified-JSON field into a real nested value (#404). Dependency-free.
transform-json-parse = []
# Fill a missing/null field with a default or first-non-null fallback (#405).
transform-coalesce = []
# Split a delimited string into an array, and its inverse join (#406).
transform-split-join = []
transform-filter = []
transform-explode = []
transform-cdc-unwrap = []
transforms = [
    "transform-flatten",
    "transform-rename-keys",
    "transform-select",
    "transform-drop",
    "transform-set",
    "transform-rename-field",
    "transform-cast",
    "transform-redact",
    "transform-value-case",
    "transform-spell-symbols",
    "transform-keys-case",
    "transform-hash",
    "transform-json-parse",
    "transform-coalesce",
    "transform-split-join",
    "transform-filter",
    "transform-explode",
    "transform-cdc-unwrap",
]
observability-install = ["dep:metrics-exporter-prometheus", "dep:tracing-subscriber"]
# OTLP (OpenTelemetry) export of traces + metrics (#201). Opt-in; pulls the
# 0.31-line OTel stack. The wiring inside `install_observability` is additionally
# gated on `observability-install` (see otel.rs); enabling `otel` alone just makes
# the provider builders available to library callers.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:metrics-exporter-opentelemetry",
    "dep:metrics-util",
    "dep:tracing-subscriber",
    "tokio/rt",
]
compression = ["dep:async-compression", "dep:flate2", "dep:zstd"]
quality = ["dep:regex"]
quality-jsonschema = ["quality", "dep:jsonschema"]
# Data contracts (`contract:` config block, issue #204): a versioned output
# schema/constraint promise enforced per page with fail/quarantine/warn.
contract = ["dep:regex"]
# PII detection + column-level masking policies (`masking:` config block,
# issue #206): classify sensitive fields (name pattern / value detector /
# explicit list) and redact/hash/tokenize/partial-mask them per page, before
# every sink. `hmac`+`sha2` back the keyed hashing/tokenization actions.
masking = ["dep:regex", "dep:sha2", "dep:hmac"]
# Encryption at rest (#207): AES-256-GCM sealing for FileStateStore bookmark
# files and per-line JSONL/DLQ output. `sha2` derives the 32-byte key from the
# configured key string.
encryption = ["dep:aes-gcm", "dep:sha2"]
# Opt-in Apache Arrow columnar record path (RFC 0002 / #375). Adds the
# escape-hatch trait methods (`Source::stream_batches` /
# `Sink::write_batch_columnar`), the `ColumnarPage` type, and the
# `RecordBatch` <-> `Value` shim. Inert by default — default builds are
# byte-identical to the `Value`-only pipeline; the `arrow` deps are pulled only
# when a connector opts a chain into the columnar fast path.
arrow = ["dep:arrow", "dep:arrow-json"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
tracing.workspace = true
async-trait.workspace = true
reqwest.workspace = true
jsonpath-rust.workspace = true
regex = { workspace = true, optional = true }
futures-core.workspace = true
futures.workspace = true
async-stream = { workspace = true }
# `macros` is required by `tokio::select!` in the streaming loop's cooperative
# cancellation (#146 H16); without it a connector built in feature isolation
# (no dependent pulling tokio/macros in via unification) fails to compile.
tokio = { workspace = true, features = ["sync", "fs", "io-util", "time", "macros"] }
# `CancellationToken` for cooperative run cancellation (flush-on-cancel, #146 H16).
tokio-util = { workspace = true }
dotenvy = "0.15"
envy = "0.4"
metrics.workspace = true
schemars.workspace = true
uuid.workspace = true
metrics-exporter-prometheus = { workspace = true, optional = true }
# `FanoutBuilder` for the Prometheus + OTLP fanout recorder (#201); optional,
# pulled in only by the `otel` feature.
metrics-util = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
metrics-exporter-opentelemetry = { workspace = true, optional = true }
async-compression = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# BLAKE3 + base64 back the `hash` transform (feature `transform-hash`, #403).
blake3 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
# Opt-in columnar record path (feature `arrow`). Heavy, so strictly optional.
arrow = { workspace = true, optional = true }
arrow-json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
futures.workspace = true
tempfile = "3"
metrics-util.workspace = true
criterion = { workspace = true, features = ["async_tokio"] }
axum = { workspace = true }

[[bench]]
name = "observability"
harness = false

[[bench]]
name = "quality"
harness = false
required-features = ["quality", "quality-jsonschema"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# The transform-config enums (`RecordTransform`, `CompiledTransform`,
# `KeyCaseMode`, `ValueCaseMode`) are deliberate *extension points*: adding a
# built-in transform or a casing mode is an additive change. They are now
# `#[non_exhaustive]`, so `cargo-semver-checks` already treats future variant
# additions as a minor bump. Marking them `#[non_exhaustive]` for the first
# time is itself a one-time change that the `enum_marked_non_exhaustive` lint
# flags as major; we accept it here (allow) so this transition ships as a minor
# release. Every other API-stability lint stays at its default (deny) level, so
# genuine breaking changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
enum_marked_non_exhaustive = "allow"
