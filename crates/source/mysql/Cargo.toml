[package]
name = "faucet-source-mysql"
version = "1.4.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MySQL query source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["mysql", "sql", "database", "etl", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "mysql", "json", "chrono", "bigdecimal"] }
base64.workspace = true
async-stream = { workspace = true }
futures.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
serde_json.workspace = true
schemars.workspace = true
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mysql"] }
futures = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
