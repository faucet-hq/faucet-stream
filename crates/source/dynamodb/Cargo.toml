[package]
name = "faucet-source-dynamodb"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Amazon DynamoDB source (parallel scan, query, Streams CDC) for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["dynamodb", "aws", "cdc", "source", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-dynamodb.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-dynamodbstreams.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_yaml = "0.9"
testcontainers = "0.27"
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
