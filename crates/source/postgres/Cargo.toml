[package]
name = "faucet-source-postgres"
version = "1.7.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL query source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["postgres", "postgresql", "sql", "etl", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "uuid", "bigdecimal"] }
base64.workspace = true
async-stream = { workspace = true }
futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
futures.workspace = true
faucet-conformance.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
