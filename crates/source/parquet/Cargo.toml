[package]
name = "faucet-source-parquet"
version = "1.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Parquet file source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["parquet", "arrow", "etl", "pipeline", "connector"]
categories.workspace = true

[features]
# Opt into the Arrow columnar fast path (RFC 0002 / #375). When enabled the
# source implements `supports_columnar`/`stream_batches`, yielding Arrow
# `RecordBatch`es directly so a parquet -> parquet chain never materializes
# `serde_json::Value`. Off by default.
arrow = ["faucet-core/arrow"]

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
futures.workspace = true
arrow.workspace = true
arrow-json.workspace = true
parquet = { workspace = true }
object_store = { workspace = true, features = ["aws"] }
glob.workspace = true
url.workspace = true
bytes.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "fs", "io-util"] }
serde_json.workspace = true
schemars.workspace = true
futures.workspace = true
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
