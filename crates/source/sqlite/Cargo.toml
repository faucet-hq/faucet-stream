[package]
name = "faucet-source-sqlite"
version = "1.6.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite query source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["sqlite", "sql", "database", "etl", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "json"] }
base64.workspace = true
async-stream = { workspace = true }
futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
tempfile = "3"
futures.workspace = true
faucet-conformance.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "json"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
