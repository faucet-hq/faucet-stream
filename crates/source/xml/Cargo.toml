[package]
name = "faucet-source-xml"
version = "1.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "XML API source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["xml", "soap", "etl", "pipeline", "connector"]
categories.workspace = true

[features]
# Mutual-TLS client-certificate auth (#495): enables the `tls:` config block by
# turning on reqwest's native-tls identity APIs. Opt-in — off by default.
mtls = ["reqwest/native-tls"]
# Excel (XLSX) parsing in the response-decode pipeline (#540). Pulls `calamine`.
# CSV/gzip/zip/base64 decode are always available; only XLSX needs this feature.
excel = ["dep:calamine"]

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
quick-xml.workspace = true
# Response-decode pipeline (#540): base64 → gunzip/unzip → parse csv/xlsx.
base64 = "0.22"
jsonpath-rust = "1"           # `parse` step's records_path selection (#540)
flate2 = { workspace = true }
zip = { workspace = true }
csv-async = { workspace = true }
calamine = { workspace = true, optional = true }

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
serde_json.workspace = true
schemars.workspace = true
futures.workspace = true
tempfile = "3"
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
