[package]
name = "faucet-source-xml"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "XML API source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["xml", "soap", "etl", "pipeline", "connector"]
categories.workspace = true

[features]
# Mutual-TLS client-certificate auth (#495): enables the `tls:` config block by
# turning on reqwest's native-tls identity APIs. Opt-in — off by default.
mtls = ["reqwest/native-tls"]
# Excel (XLSX) parsing in the response-decode pipeline (#540). Pulls `calamine`.
# CSV/gzip/zip/base64 decode are always available; only XLSX needs this feature.
excel = ["dep:calamine"]

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
quick-xml.workspace = true
# Response-decode pipeline (#540): base64 → gunzip/unzip → parse csv/xlsx.
base64 = "0.22"
jsonpath-rust = "1"           # `parse` step's records_path selection (#540)
flate2 = { workspace = true }
zip = { workspace = true }
csv-async = { workspace = true }
calamine = { workspace = true, optional = true }

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
serde_json.workspace = true
schemars.workspace = true
futures.workspace = true
tempfile = "3"
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
