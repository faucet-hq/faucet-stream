[package]
name = "faucet-source-csv"
version = "1.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CSV file source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["csv", "etl", "pipeline", "connector", "data"]
categories.workspace = true

[features]
compression = ["faucet-core/compression"]

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
csv-async = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
async-stream = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
tempfile = "3"
futures = { workspace = true }
faucet-conformance.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
