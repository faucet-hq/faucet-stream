[package]
name = "faucet-source-sftp"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SFTP source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["sftp", "ssh", "file", "etl", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-sftp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "net"] }
async-stream = { workspace = true }
futures.workspace = true

[features]
# Uniform file formats (#604): CSV, XML and Excel files, decoded through
# `faucet_core::file_format` so every file connector reads the same shapes with
# the same options. `file-formats` is the aggregate.
file-format-csv = ["faucet-core/file-format-csv"]
file-format-xml = ["faucet-core/file-format-xml"]
file-format-excel = ["faucet-core/file-format-excel"]
file-formats = ["file-format-csv", "file-format-xml", "file-format-excel"]

[dev-dependencies]
faucet-conformance.workspace = true
faucet-common-sftp.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
serde_json.workspace = true
schemars.workspace = true
futures = { workspace = true }
testcontainers = "0.27"
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides — the workspace-wide
# declared contract (see crates/core/Cargo.toml): struct-literal construction
# and exhaustive matching of config types are NOT part of the stability
# surface, so adding an optional field or variant is a MINOR bump. Construct
# configs via serde / `new()` / the builder methods, not a struct literal.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
enum_variant_added = "allow"
