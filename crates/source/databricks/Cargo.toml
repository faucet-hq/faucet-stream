[package]
name = "faucet-source-databricks"
version = "1.1.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Databricks SQL query source (Statement Execution API) for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["databricks", "sql", "source", "etl", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
# Arrow columnar path (opt-in `arrow` feature, RFC 0002 / #375): decode the
# ARROW_STREAM (EXTERNAL_LINKS) result format as Arrow IPC for the row +
# columnar lanes. Optional so default builds pull neither `arrow` nor `bytes`.
arrow = { workspace = true, optional = true, features = ["ipc"] }
bytes = { workspace = true, optional = true }

[features]
# Enables `arrow_native` (ARROW_STREAM result format) + the columnar
# `stream_batches` fast path.
arrow = ["faucet-core/arrow", "dep:arrow", "dep:bytes"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
faucet-conformance.workspace = true
serde_json.workspace = true
schemars.workspace = true
# For the arrow-gated ARROW_STREAM integration test (build a synthetic Arrow
# IPC chunk body + iterate the columnar stream). Harmless when `arrow` is off.
arrow = { workspace = true, features = ["ipc"] }
futures.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
