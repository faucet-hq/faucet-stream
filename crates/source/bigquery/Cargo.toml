[package]
name = "faucet-source-bigquery"
version = "1.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BigQuery query source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["bigquery", "gcp", "etl", "pipeline", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-bigquery.workspace = true
gcp-bigquery-client = "0.28.0"
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tracing.workspace = true
tokio.workspace = true

# Arrow columnar Storage Read API path (#380, `arrow` feature). The gcloud-*
# stack (gRPC via tonic 0.14) is a separate family from the REST
# gcp-bigquery-client used above; it is only pulled in `arrow` builds.
arrow = { workspace = true, optional = true, features = ["ipc"] }
gcloud-googleapis = { workspace = true, optional = true, features = ["bigquery"] }
gcloud-gax = { workspace = true, optional = true }
gcloud-auth = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
# Opt-in Arrow columnar fast path (#380): BigQuery Storage Read API (gRPC) →
# Arrow RecordBatches. Additive — default (arrow-off) builds are byte-identical.
arrow = [
    "faucet-core/arrow",
    "dep:arrow",
    "dep:gcloud-googleapis",
    "dep:gcloud-gax",
    "dep:gcloud-auth",
    "dep:futures",
]

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
futures = { workspace = true }
serde_json.workspace = true
schemars.workspace = true
wiremock = "0.6"
tempfile = "3"
serde = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
