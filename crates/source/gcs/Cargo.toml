[package]
name = "faucet-source-gcs"
version = "1.6.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Google Cloud Storage source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["gcs", "gcp", "storage", "etl", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-gcs.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
google-cloud-storage = { workspace = true, features = ["unstable-stream"] }
google-cloud-gax = "1.10"
async-stream.workspace = true
futures.workspace = true
bytes.workspace = true
tokio-util.workspace = true
# Checksum verification (opt-in `verify_checksum`): `crc` computes CRC-32C and
# `md-5` computes MD5 to compare against the values GCS reports per object.
crc.workspace = true
md-5.workspace = true
# Arrow columnar path (opt-in `arrow` feature, RFC 0002 / #375): decode Parquet
# objects into Arrow `RecordBatch`es for the row + columnar lanes. Optional so
# default builds pull neither `parquet` nor `arrow`.
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }

[features]
compression = ["faucet-core/compression"]
# Enables the `Parquet` file format + the columnar `stream_batches` fast path.
arrow = ["faucet-core/arrow", "dep:arrow", "dep:parquet"]

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
schemars.workspace = true
futures = { workspace = true }
testcontainers = "0.27"
reqwest = { workspace = true }
urlencoding.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
