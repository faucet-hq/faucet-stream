[package]
name = "faucet-source-grpc"
version = "1.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC API source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["grpc", "protobuf", "etl", "pipeline", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
tonic.workspace = true
prost.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true
async-stream.workspace = true
futures-core.workspace = true
base64.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync"] }
serde_json.workspace = true
tonic = { workspace = true, features = ["transport", "server"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = { workspace = true }
prost.workspace = true
tempfile = "3"

[build-dependencies]
tonic-build = "0.13"
protoc-bin-vendored = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
