[package]
name = "faucet-source-elasticsearch"
version = "1.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Elasticsearch source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["elasticsearch", "search", "etl", "pipeline", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-elasticsearch.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
reqwest.workspace = true
async-stream = { workspace = true }
futures.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
schemars.workspace = true
futures = { workspace = true }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
