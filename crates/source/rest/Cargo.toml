[package]
name = "faucet-source-rest"
version = "1.4.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "REST API source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["rest", "http", "api", "etl", "pipeline"]
categories.workspace = true

[features]
default = ["transform-flatten", "transform-rename-keys", "transform-keys-case"]
transform-flatten = ["faucet-core/transform-flatten"]
transform-rename-keys = ["faucet-core/transform-rename-keys"]
transform-select = ["faucet-core/transform-select"]
transform-drop = ["faucet-core/transform-drop"]
transform-set = ["faucet-core/transform-set"]
transform-rename-field = ["faucet-core/transform-rename-field"]
transform-cast = ["faucet-core/transform-cast"]
transform-redact = ["faucet-core/transform-redact"]
transform-value-case = ["faucet-core/transform-value-case"]
transform-spell-symbols = ["faucet-core/transform-spell-symbols"]
transform-keys-case = ["faucet-core/transform-keys-case"]
transform-hash = ["faucet-core/transform-hash"]
transform-json-parse = ["faucet-core/transform-json-parse"]
transform-coalesce = ["faucet-core/transform-coalesce"]
transform-split-join = ["faucet-core/transform-split-join"]
transform-filter = ["faucet-core/transform-filter"]
transform-explode = ["faucet-core/transform-explode"]
transforms = ["faucet-core/transforms"]

[dependencies]
faucet-core.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonpath-rust = "1"
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
httpdate = "1"
tracing.workspace = true
async-stream = { workspace = true }
futures-core = "0.3.32"
futures.workspace = true  # try_join_all for concurrent partitions
async-trait.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
tracing-subscriber = "0.3"
futures.workspace = true
serde = { version = "1", features = ["derive"] }
tempfile = "3"
async-trait.workspace = true
faucet-conformance.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
