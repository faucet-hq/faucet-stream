[package]
name = "faucet-source-rest"
version = "1.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "REST API source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["rest", "http", "api", "etl", "pipeline"]
categories.workspace = true

[features]
default = ["transform-flatten", "transform-rename-keys", "transform-keys-case"]
transform-flatten = ["faucet-core/transform-flatten"]
transform-rename-keys = ["faucet-core/transform-rename-keys"]
transform-select = ["faucet-core/transform-select"]
transform-drop = ["faucet-core/transform-drop"]
transform-set = ["faucet-core/transform-set"]
transform-rename-field = ["faucet-core/transform-rename-field"]
transform-cast = ["faucet-core/transform-cast"]
transform-redact = ["faucet-core/transform-redact"]
transform-value-case = ["faucet-core/transform-value-case"]
transform-spell-symbols = ["faucet-core/transform-spell-symbols"]
transform-keys-case = ["faucet-core/transform-keys-case"]
transform-hash = ["faucet-core/transform-hash"]
transform-json-parse = ["faucet-core/transform-json-parse"]
transform-coalesce = ["faucet-core/transform-coalesce"]
transform-split-join = ["faucet-core/transform-split-join"]
transform-json-encode = ["faucet-core/transform-json-encode"]
transform-lookup = ["faucet-core/transform-lookup"]
transform-unpivot = ["faucet-core/transform-unpivot"]
transform-tree-flatten = ["faucet-core/transform-tree-flatten"]
transform-cross-join = ["faucet-core/transform-cross-join"]
transform-filter = ["faucet-core/transform-filter"]
transform-explode = ["faucet-core/transform-explode"]
transforms = ["faucet-core/transforms"]
# Mutual-TLS client-certificate auth (#495): enables the `tls:` config block by
# turning on reqwest's native-tls identity APIs. Opt-in — off by default.
mtls = ["reqwest/native-tls"]
# Excel (.xlsx/.xls) response parsing for `response_format: excel` (#497), via
# calamine. CSV parsing is always available; only Excel needs this feature.
excel = ["dep:calamine"]

[dependencies]
faucet-core.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonpath-rust = "1"
quick-xml = { workspace = true }  # OData $metadata (EDMX/CSDL) parsing (#512); XML decode (#515)
flate2 = { workspace = true }  # gunzip decode step (#515)
zip = { workspace = true }  # unzip decode step (#515)
csv-async = { workspace = true }
calamine = { workspace = true, optional = true }
chrono = { workspace = true }  # datetime window slicing (#527): now-clock + RFC3339 boundaries
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
httpdate = "1"
tracing.workspace = true
async-stream = { workspace = true }
futures-core = "0.3.32"
futures.workspace = true  # try_join_all for concurrent partitions
async-trait.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
tracing-subscriber = "0.3"
futures.workspace = true
serde = { version = "1", features = ["derive"] }
tempfile = "3"
async-trait.workspace = true
faucet-conformance.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
