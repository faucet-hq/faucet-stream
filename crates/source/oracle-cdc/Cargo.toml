[package]
name = "faucet-source-oracle-cdc"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Oracle Database CDC (LogMiner) source for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["oracle", "cdc", "logminer", "source", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-oracle.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
async-stream.workspace = true
futures.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
serde_json.workspace = true
schemars.workspace = true
futures = { workspace = true }
testcontainers = "0.27"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
