[package]
name = "faucet-source-snowflake"
version = "1.3.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Snowflake query source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["snowflake", "sql", "etl", "pipeline", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-snowflake.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
futures = { workspace = true }
serde_json.workspace = true
schemars.workspace = true
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
