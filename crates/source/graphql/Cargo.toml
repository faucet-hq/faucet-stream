[package]
name = "faucet-source-graphql"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GraphQL API source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["graphql", "api", "etl", "pipeline", "connector"]
categories.workspace = true

[features]
# Mutual-TLS client-certificate auth (#495): enables the `tls:` config block by
# turning on reqwest's native-tls identity APIs. Opt-in — off by default.
mtls = ["reqwest/native-tls"]

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
jsonpath-rust.workspace = true
async-stream = { workspace = true }
futures.workspace = true
base64.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
serde_json.workspace = true
schemars.workspace = true
wiremock = "0.6"
futures.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
