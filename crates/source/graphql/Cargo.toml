[package]
name = "faucet-source-graphql"
version = "1.2.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GraphQL API source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["graphql", "api", "etl", "pipeline", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest.workspace = true
jsonpath-rust.workspace = true
async-stream = { workspace = true }
futures.workspace = true
base64.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
serde_json.workspace = true
schemars.workspace = true
wiremock = "0.6"
futures.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
