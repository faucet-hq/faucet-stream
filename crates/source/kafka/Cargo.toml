[package]
name = "faucet-source-kafka"
version = "1.3.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Kafka consumer source for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["kafka", "streaming", "etl", "pipeline", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-kafka.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
tracing.workspace = true
rdkafka.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
base64.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "signal", "time", "test-util"] }
serde_json.workspace = true
schemars.workspace = true
futures = { workspace = true }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }

[features]
default = []
schema-registry = ["faucet-common-kafka/schema-registry"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
