[package]
name = "faucet-source-mongodb"
version = "1.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MongoDB source connector for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["mongodb", "nosql", "database", "etl", "pipeline"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
mongodb = { workspace = true }
tokio.workspace = true
futures-core.workspace = true
async-stream = { workspace = true }
futures.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
schemars.workspace = true
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mongo"] }
futures = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
