[package]
name = "faucet-source-kinesis"
version = "1.0.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AWS Kinesis Data Streams source connector for faucet-stream (sharded consumer, resumable checkpoints)"
readme = "README.md"
keywords = ["kinesis", "aws", "streaming", "etl", "connector"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-kinesis.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
aws-sdk-kinesis.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing.workspace = true
base64.workspace = true

[dev-dependencies]
faucet-conformance.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
schemars.workspace = true
futures = { workspace = true }
serde_yaml = "0.9"
# LocalStack-backed integration tests (Docker), mirroring the kafka pair.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["localstack"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
