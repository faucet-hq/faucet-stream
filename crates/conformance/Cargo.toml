[package]
name = "faucet-conformance"
version = "1.3.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable connector conformance test battery for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["faucet", "conformance", "testing", "connector", "etl"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
futures-core.workspace = true
# `scripted::ScriptedSink` can inject a latency into each write (the slow-sink /
# backpressure arm of the reliability suites), which needs an async sleep in
# non-test code. `time` only — this crate spawns no runtime of its own.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# The shared file-format layer (#604) is the one "connector" every file source
# and sink shares, so its typed fidelity is asserted here against the same
# corpus each connector pair uses.
faucet-core = { workspace = true, features = ["file-formats"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
# `scripted::Boundary` and `scripted::Event` exist to grow: the documented
# process for a new engine guarantee (#651, `.claude/rules/maintenance.md`) is
# "add a new Boundary/Event if the failure point is new". Both are
# `#[non_exhaustive]`, so a consumer already matches them with a `_` arm and a
# new variant cannot break one. Without these two allowances every new
# reliability boundary would force a major bump of the harness crate.
enum_variant_added = "allow"
enum_marked_non_exhaustive = "allow"
