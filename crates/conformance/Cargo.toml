[package]
name = "faucet-conformance"
version = "1.3.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable connector conformance test battery for the faucet-stream ecosystem"
readme = "README.md"
keywords = ["faucet", "conformance", "testing", "connector", "etl"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
futures-core.workspace = true
# `scripted::ScriptedSink` can inject a latency into each write (the slow-sink /
# backpressure arm of the reliability suites), which needs an async sleep in
# non-test code. `time` only — this crate spawns no runtime of its own.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
