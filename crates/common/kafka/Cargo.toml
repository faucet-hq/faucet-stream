[package]
name = "faucet-common-kafka"
version = "1.0.11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared configuration types for the faucet-stream Kafka source and sink connectors"
readme = "README.md"
keywords = ["kafka", "streaming", "etl", "pipeline", "faucet"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
rdkafka.workspace = true
tracing.workspace = true
base64.workspace = true

# Schema-registry-only deps
reqwest = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
apache-avro = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
protox = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }
url = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
serde_json.workspace = true
wiremock = "0.6"

[features]
default = []
schema-registry = [
    "dep:reqwest",
    "dep:lru",
    "dep:bytes",
    "dep:apache-avro",
    "dep:prost-reflect",
    "dep:prost",
    "dep:protox",
    "dep:jsonschema",
    "dep:tokio",
    "dep:url",
    "dep:urlencoding",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
