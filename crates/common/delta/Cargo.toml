[package]
name = "faucet-common-delta"
version = "1.0.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Delta Lake configuration and helpers for the faucet-stream source and sink connectors"
readme = "README.md"
keywords = ["delta", "deltalake", "lakehouse", "etl", "connector"]
categories.workspace = true

[features]
default = []
# Cloud object-store backends. Each forwards to the matching delta-rs feature
# and, for S3, unlocks the `register_handlers` shim in `table.rs`.
s3 = ["deltalake/s3"]
azure = ["deltalake/azure"]
gcs = ["deltalake/gcs"]

[dependencies]
faucet-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
tracing.workspace = true
deltalake.workspace = true
arrow.workspace = true
arrow-json.workspace = true
chrono.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Upstream semver violation, pinned here until it is fixed (2026-09-21).
#
# `deltalake 0.32.4` (the latest) pulls `buoyant_kernel 0.22.2`, which declares
# `buoyant_kernel_derive ^1` — but `buoyant_kernel_derive 1.2.0` removed the
# `parse_column_name!` macro that the 0.22 line calls, so a *minor* release
# breaks the build. Our `Cargo.lock` happens to hold 1.1.0, which is why
# ordinary builds are green; anything that re-resolves (cargo-semver-checks
# builds the current crate from the manifests, not the lockfile) picks 1.2.0
# and fails to compile.
#
# A dev-dependency is the smallest lever that constrains workspace resolution:
# it pins the version everywhere in this workspace while staying invisible to
# downstream consumers, who never resolve our dev-deps. Nothing here `use`s it.
#
# Remove once upstream yanks 1.2.0, or `deltalake` moves to the
# `buoyant_kernel` 0.28 line that pairs with it.
buoyant_kernel_derive = "=1.1.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides.
#
# Additive evolution is a MINOR bump by declared contract (CLAUDE.md
# "API-Evolution & Versioning Policy"): struct-literal construction and
# exhaustive matching of config/data types are NOT part of this crate's
# stability surface — construct via serde deserialization, `new()`/`Default`,
# or builders, and match with a `_` arm. So adding an optional config field
# never forces a major. Every other API-stability lint stays at its default
# (deny) level, so genuine removals and signature changes still fail the gate.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
