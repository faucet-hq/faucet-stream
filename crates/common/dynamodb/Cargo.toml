[package]
name = "faucet-common-dynamodb"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Amazon DynamoDB credential and client types for the faucet-stream DynamoDB connectors"
readme = "README.md"
keywords = ["dynamodb", "aws", "nosql", "etl", "faucet"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-dynamodbstreams.workspace = true
base64.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_yaml = "0.9"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
