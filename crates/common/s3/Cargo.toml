[package]
name = "faucet-common-s3"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared S3 client builder and file-writer storage backend for the faucet-stream S3 connectors"
readme = "README.md"
keywords = ["s3", "aws", "storage", "etl", "faucet"]
categories.workspace = true

[dependencies]
faucet-core.workspace = true
faucet-common-file.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
futures.workspace = true
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# API-stability (cargo-semver-checks) lint overrides — the workspace-wide
# declared contract (see crates/core/Cargo.toml).
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
constructible_struct_adds_private_field = "allow"
enum_struct_variant_field_added = "allow"
