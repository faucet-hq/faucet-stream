# The reference WASM transform modules target `wasm32-unknown-unknown` with
# their own release profile and are built out-of-band (see their README); they
# must not join the host workspace build (CI has no wasm target).
exclude = [
    "examples/wasm-transforms/rust",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/faucet-hq/faucet-stream"
# Shared crates.io discovery metadata, inherited by connector/state crates via
# `keywords.workspace = true` / `categories.workspace = true` (#78 LOW). Crates
# that want more specific keywords (cli, umbrella) set their own.
keywords = ["etl", "data-pipeline", "streaming", "connector", "faucet"]
categories = ["database", "asynchronous"]

