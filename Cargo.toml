# Shared external deps
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1.89"
regex = "1"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
futures-core = "0.3"
jsonpath-rust = "1.0.1"
quick-xml = { version = "0.37", features = ["serialize"] }
tonic = { version = "0.13", features = ["transport", "tls-ring"] }
prost = "0.13"
prost-reflect = { version = "0.15", features = ["serde"] }
prost-types = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "json"] }
# MSSQL stack. tiberius default features (native-tls, winauth) are off so the
# tree stays on rustls; bb8-tiberius supplies the tokio runtime glue + the
# `tls = ["tiberius/rustls"]` passthrough and never enables native-tls.
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono", "rust_decimal", "tds73"] }
bb8 = "0.9"
bb8-tiberius = { version = "0.16", default-features = false, features = ["with-tokio", "tds73", "tls"] }
rust_decimal = "1"
pgwire-replication = "=0.3.2"
byteorder = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
croner = "3"
jsonwebtoken = "9"
base64 = "0.22"
rsa = "0.9"
sha2 = "0.10"
# BLAKE3 cryptographic hash — used by the `hash` transform (#403) as an
# alternative to SHA-256.
blake3 = "1"
# AEAD for encryption-at-rest of FileStateStore bookmarks + JSONL/DLQ output (#207).
aes-gcm = "0.11"
hmac = "0.12"
crc = "3"
md-5 = "0.10"
dashmap = "6"
uuid = { version = "1", features = ["v4", "v7"] }
google-cloud-storage = "1.12"
google-cloud-auth = "1.10"
# Cloud Spanner stack: the mature community client (yoshidan/google-cloud-rust,
# renamed gcloud-*). The official `google-cloud-spanner` is still `-preview`, so
# per the dependency policy the stable community client is the pick. Default
# features are off to swap `jwt-aws-lc-rs` for the pure-Rust `jwt-rust-crypto`
# signer (no aws-lc build dep for JWT signing).
gcloud-spanner = { version = "1.8", default-features = false, features = ["auth", "rustls-tls", "jwt-rust-crypto"] }
# Raw protobuf types (Mutation, TypeCode, Field, …) used by the Spanner pair;
# not re-exported from gcloud-spanner's root.
gcloud-googleapis = { version = "1.3", features = ["spanner"] }
# gRPC plumbing for gcloud-spanner; needed directly only for
# `google_cloud_gax::conn::Environment` (the emulator-endpoint override).
gcloud-gax = "1.4"
# Cloud Pub/Sub client from the same yoshidan gcloud-* stack (source/sink pubsub,
# #347). default-features off + jwt-rust-crypto to stay coherent with the Spanner
# stack (avoids the dual-jwt compile_error in gcloud-auth).
gcloud-pubsub = { version = "1", default-features = false, features = ["auth", "rustls-tls", "jwt-rust-crypto"] }
gcloud-auth = { version = "1", default-features = false, features = ["rustls-tls", "jwt-rust-crypto"] }
aws-sdk-kinesis = "1"
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"
aws-sdk-secretsmanager = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
# NATS (JetStream-capable async client) for the nats source/sink pair.
async-nats = "0.50"
# SFTP over SSH (pure-Rust) for the sftp source/sink pair.
russh = "0.62"
russh-sftp = "2"
azure_security_keyvault_secrets = "1"
azure_identity = "1"
azure_core = "1"
tokio-util = { version = "0.7", features = ["io"] }

mongodb = "3"
mysql_async = { version = "0.37", default-features = false, features = ["binlog", "default-rustls-ring"] }
csv = "1.3"
csv-async = { version = "1.3", features = ["tokio"] }
redis = { version = "0.29", features = ["tokio-comp", "aio"] }
axum = "0.8"
subtle = "2"
tower-http = { version = "0.6", features = ["limit", "cors", "trace", "request-id", "util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
schemars = "1.2.1"
futures = "0.3"
async-stream = "0.3"
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "cmake-build", "ssl-vendored", "sasl"] }
apache-avro = { version = "0.21", default-features = false, features = ["snappy"] }
jsonschema = { version = "0.46", default-features = false }
lru = "0.18"
# Observability fixture. `metrics` and `tracing` are core deps because they are
# zero-cost when no recorder/subscriber is installed and connector authors can
# emit their own counters/spans without adding deps. The heavy exporter
# (`metrics-exporter-prometheus`) and subscriber (`tracing-subscriber`) are
# optional and gated behind faucet-cli's `observability` feature.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-util = "0.20"
# OpenTelemetry (OTLP) export — issue #201. PINNED TO THE 0.31 LINE: the metrics
# bridge `metrics-exporter-opentelemetry` 0.2.1 requires `opentelemetry`/`opentelemetry_sdk`
# ^0.31, so the whole stack is locked to 0.31 (tracing-opentelemetry 0.32.1 is the
# 0.31-compatible release — 0.33 targets opentelemetry 0.32). Before bumping any of
# these, confirm metrics-exporter-opentelemetry supports the newer line first.
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "grpc-tonic", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.32.1"
metrics-exporter-opentelemetry = "0.2.1"
bytes = "1"
url = "2"
percent-encoding = "2"
urlencoding = "2"
protox = "0.9"
arrow = "58"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
arrow-json = "58"
parquet = { version = "58", features = ["async", "object_store"] }
object_store = "0.13"
# Delta Lake (delta-rs). Cloud backends (s3/azure/gcs) are opt-in crate
# features; default `rustls` covers local FS. Pinned to the arrow-58 line,
# matching the workspace arrow/parquet pins. datafusion is deliberately NOT
# enabled — append uses the low-level RecordBatchWriter and reads enumerate
# active parquet files directly, keeping the dependency tree slim.
deltalake = { version = "0.32.4", default-features = false, features = ["rustls"] }
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }
flate2 = "1"
zstd = "0.13"
glob = "0.3"
duckdb = "1.10503"
# WebAssembly runtime for the `wasm` transform (issue #124). Lean embedding:
# JIT via Cranelift + the runtime, on std platforms (native signal traps). We
# drive core-wasm modules only — no component model, async, cache, or GC.
wasmtime = { version = "47", default-features = false, features = ["cranelift", "runtime", "std"] }
# WAT → wasm assembler, used to build tiny fixture modules in `transform-wasm`
# tests without a wasm toolchain on the CI runner.
wat = "1"
tempfile = "3"
# Live terminal UI for `faucet run --tui` (#203, CLI-only `cli-tui` feature).
# Default features include the crossterm backend.
ratatui = "0.30"

# Inline per-row progress line for `faucet run` (#385, CLI-only `cli-progress`
# feature). Draws to stderr so piped stdout stays clean.
indicatif = "0.18"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
