[book]
title = "faucet-stream"
description = "The fast, config-driven way to move data in Rust."
authors = ["faucet-stream contributors"]
language = "en"
src = "src"

[output.html]
# Full origin path for the GitHub Pages project site — fixes 404-page asset/nav
# links and gives the generated site a stable base URL (pairs with the sitemap).
site-url = "/faucet-stream/"
# Clean light default + navy dark — the brand accent in custom.css is tuned for
# both. (Was rust/ayu; light/navy reads more modern and closer to the reference
# docs sites.)
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/faucet-hq/faucet-stream"
edit-url-template = "https://github.com/faucet-hq/faucet-stream/edit/main/docs/book/{path}"
no-section-label = false
# custom.css   — site-wide visual polish (brand accent, typography, callouts,
#                tables, landing hero). Native additional-css; no preprocessor.
# learn-toggle — powers the Beginner/Architect toggle; both files are no-ops on
#                pages without a [data-mode-toggle] control.
# page-toc.js  — builds the right-hand "On this page" heading TOC (styled in
#                custom.css); a no-op on the landing page and short pages.
# header-ui.js — Pydantic-style header: relocates mdBook's search into the bar as
#                an always-visible "Search ⌘K" pill + a single light/dark toggle.
additional-css = ["custom.css", "learn-toggle.css"]
additional-js = ["learn-toggle.js", "page-toc.js", "header-ui.js", "fs-flow.js", "mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
