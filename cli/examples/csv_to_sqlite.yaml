# YAML equivalent of `faucet-stream/examples/csv_to_sqlite.rs`.
# TSV-like CSV (tab delimiter, no headers) → SQLite with JSON column mapping.
version: 1
name: csv_to_sqlite

pipeline:
  source:
    type: csv
    config:
      path: inventory.tsv
      has_headers: false
      delimiter: 9    # b'\t'
      quote: 39       # b'\''

  sink:
    type: sqlite
    config:
      database_url: sqlite:./inventory.db
      table_name: inventory
      column_mapping:
        json:
          column: row
      batch_size: 500
      max_connections: 4
