# YAML equivalent of `faucet-stream/examples/sqlite_to_jsonl.rs`.
version: 1
name: sqlite_to_jsonl

pipeline:
  source:
    type: sqlite
    config:
      database_url: sqlite:./app.db
      query: SELECT * FROM events ORDER BY ts
      max_connections: 4

  sink:
    type: file
    config:
      path: events.jsonl
      mode: append
      json_lines: { pretty: false }
