# Keep the local files a pipeline writes for three days, then let the output GC
# reclaim them. `local_outputs:` records every file the sinks write — here one
# dated JSON Lines file per run — in the `catalog:` store, which is where
# `faucet run` keeps that ledger (`faucet serve` uses its --history backend).
#
#   faucet validate cli/examples/csv_to_jsonl_with_local_outputs.yaml
#   faucet run      cli/examples/csv_to_jsonl_with_local_outputs.yaml
#
# Requires a build with the `catalog` feature (included in `--features full`)
# plus `serve-history-sqlite` for the SQLite store.
version: 1
name: csv_to_jsonl_with_local_outputs

catalog:
  url: sqlite:./faucet-catalog.db

local_outputs:
  track: true
  # Collectable three days after faucet last wrote the file (0 = keep forever).
  retention_days: 3

pipeline:
  source:
    type: file
    config:
      path: ./data/orders.csv

  sink:
    type: file
    config:
      path: "./out/orders-${now.date}.jsonl"
