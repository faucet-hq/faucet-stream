# Microsoft SQL Server -> JSONL, with incremental replication.
#
# Each run reads rows from the bookmark persisted in the file state store
# onward, in `updated_at` order, so re-runs continue where they left off. The
# source wraps the query as `updated_at >= @bookmark` and drops the rows it
# already emitted at the bookmark value, so rows sharing a timestamp are never
# skipped. `@bookmark` in the query (with `>=`) filters further inside it.
#
# Run:
#   faucet run cli/examples/mssql_to_jsonl.yaml
#
# Prereqs:
#   - SQL Server reachable on localhost:1433 with a `sales` database and a
#     `dbo.users (id, email, updated_at)` table.
#   - URL credentials are percent-encoded (@ -> %40, : -> %3A, / -> %2F).

version: 1
name: mssql_to_jsonl
pipeline:
  source:
    type: mssql
    config:
      connection_url: "mssql://sa:Str0ng%40Pass@localhost:1433/sales"
      query: "SELECT id, email, updated_at FROM dbo.users WHERE updated_at >= @bookmark"
      batch_size: 1000
      # Self-signed dev cert: trust it. Use `prefer`/`require` in production.
      tls:
        type: trust_server_certificate
      replication:
        type: incremental
        column: updated_at
        initial_value: "1970-01-01T00:00:00Z"

  sink:
    type: file
    config:
      path: ./out/users.jsonl
      if_exists: append

  state:
    type: file
    config:
      path: ./.faucet-state
