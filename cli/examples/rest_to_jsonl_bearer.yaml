# Bearer-token REST API → JSONL on disk.
#
# A plain bearer-authenticated, offset-token-paginated JSON API needs no
# dedicated connector crate: faucet's generic `rest` source covers it
# end-to-end (issue #414). The API here is a placeholder — point `base_url`
# and `path` at yours.
#
# How it maps onto the `rest` source:
#   - Bearer / personal-access-token auth  → auth: { type: bearer }
#   - Records live under the `records` array  → records_path: "$.records"
#   - The next-page token is `offset` in the body, sent back as the `offset`
#     query param  → pagination: { type: Cursor, next_token_path: offset,
#     param_name: offset }.  Pagination stops when `offset` is absent.
#   - A per-account rate limit that answers HTTP 429 with Retry-After is
#     honoured by the rest source's built-in retry (max_retries / retry_backoff).
#
# Required env vars:
#   API_TOKEN — a personal access token with read scope
#   API_BASE_ID — the workspace/base id the records live in
#
#   faucet run cli/examples/rest_to_jsonl_bearer.yaml
version: 1
name: rest_to_jsonl_bearer

vars:
  base_id: ${env:API_BASE_ID}
  table: Contacts

pipeline:
  source:
    type: rest
    config:
      base_url: https://api.example.com
      path: /v0/${vars.base_id}/${vars.table}
      method: GET
      auth:
        type: bearer
        config:
          token: ${env:API_TOKEN}
      query_params:
        pageSize: "100"
        # Optional: push a filter server-side.
        # filter: "status != 'archived'"
      records_path: "$.records"
      pagination:
        type: Cursor
        next_token_path: offset
        param_name: offset
      # A 429 + Retry-After is retried with backoff.
      max_retries: 5
      retry_backoff: 1
      tolerated_http_errors: []
      replication_method:
        type: FullTable
      primary_keys: ["id"]
      requests: []
      schema_sample_size: 100

  # Each record is { id, createdTime, fields: {...} }. Flatten collapses
  # the nested `fields` object into dotted top-level keys (fields.Name, …) for a
  # flatter downstream shape.
  transforms:
    - type: flatten

  sink:
    type: file
    config:
      path: ./out/contacts.jsonl
