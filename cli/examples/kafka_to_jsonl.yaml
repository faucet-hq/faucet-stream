version: 1
# Consume a Kafka topic and write each message as one JSON line.
#
# Run:
#   faucet run cli/examples/kafka_to_jsonl.yaml
#
# Prereqs:
#   - A running Kafka or Redpanda broker on localhost:9092.
#   - The topic 'orders' exists and has some messages.

pipeline:
  source:
    type: kafka
    config:
      brokers: "localhost:9092"
      topics: ["orders"]
      group_id: "faucet-example-kafka-to-jsonl"
      value_format: {type: json}
      auto_offset_reset: earliest
      # Stop when either condition fires.
      max_messages: 1000
      idle_timeout: 10

  sink:
    type: file
    config:
      path: ./out/orders.jsonl
      json_lines: { pretty: false }

  state:
    type: file
    config:
      path: ./.faucet-state
