# YAML equivalent of `faucet-stream/examples/webhook_to_csv.rs`.
# HTTP receiver → CSV file with semicolon delimiter.
version: 1
name: webhook_to_csv

pipeline:
  source:
    type: webhook
    config:
      listen_addr: 127.0.0.1:9090
      path: /inbox
      max_payloads: 5000
      timeout_secs: 120
      # Answer each sender once its event is written (the default); a page is
      # written at least every 5 s, and at most 1000 requests are held open.
      ack: on_commit
      max_hold_secs: 5
      max_held: 1000

  sink:
    type: file
    config:
      path: webhooks.csv
      csv:
        delimiter: ";"
        has_headers: true
      if_exists: append
