# YAML equivalent of `faucet-stream/examples/csv_to_mysql.rs`.
# CSV → MySQL with AutoMap column mapping.
version: 1
name: csv_to_mysql

pipeline:
  source:
    type: file
    config:
      path: customers.csv
      csv:
        has_headers: true
        delimiter: ","
        quote: '"'

  sink:
    type: mysql
    config:
      connection_url: mysql://user:pass@localhost/crm
      table_name: customers_imported
      column_mapping: auto_map
      batch_size: 1000
      max_connections: 10
