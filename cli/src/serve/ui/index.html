<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>faucet console</title>
    <link rel="icon" href="/assets/mark.svg" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/views/operate.css" />
    <link rel="stylesheet" href="/assets/views/templates.css" />
    <link rel="stylesheet" href="/assets/views/data.css" />
    <link rel="stylesheet" href="/assets/views/govern.css" />
    <link rel="stylesheet" href="/assets/views/build.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="side" id="side" aria-label="Console navigation"></aside>
      <main class="main" id="main">
        <header class="top" id="top">
          <div class="crumb" id="crumb"></div>
          <span class="delta" id="delta"></span>
          <div class="right">
            <span id="ctx" style="display:contents"></span>
            <span class="select" id="tenant-wrap" hidden><select id="tenant-select" title="Tenant: scopes Runs, Usage and Changes" aria-label="Tenant"></select></span>
            <span class="chip" id="tenant-pin" hidden></span>
            <span class="select"><select id="tz-select" title="Display timezone: how every time is shown" aria-label="Display timezone"></select></span>
            <button type="button" class="ibtn" id="theme-toggle" title="Switch light / dark" aria-label="Switch light / dark"></button>
            <button type="button" class="ibtn" id="copy-link" title="Copy a link to this page" aria-label="Copy a link to this page"></button>
            <button type="button" class="ibtn" id="expand-btn" title="Hide the sidebar" aria-label="Hide the sidebar" aria-pressed="false"></button>
          </div>
        </header>
        <section class="body" id="view"></section>
        <footer class="status" id="status"></footer>
      </main>
    </div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
