#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that a GitHub Release with this tag is assumed to exist as a draft
# with the appropriate title/body, and will be undrafted for you.

name: Release binaries (dist)
permissions:
  "contents": "read"

# Harden against transient crates.io connectivity drops (same guards as
# ci.yml / release-plz.yml): retry more, force HTTP/1.1 to the registry.
# (Hand edit — see allow-dirty = ["ci"] in dist-workspace.toml.)
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
# Hand-adjusted from the dist-generated workflow (see dist-workspace.toml,
# `allow-dirty = ["ci"]`): renamed to release-binaries.yml so the manual
# fallback keeps release.yml, and the tag trigger is narrowed to the CLI's
# per-crate tag so the ~50 other `<crate>-vX.Y.Z` tags release-plz pushes per
# release do not trigger binary builds. On pull requests only the cheap
# `dist plan` job runs (build jobs are gated on publishing).
# NOTE: the publish job pushes tags with RELEASE_PLZ_TOKEN, so the tag push
# fires this workflow. If RELEASE_PLZ_TOKEN is unset, release-plz falls back to
# the workflow-scoped GITHUB_TOKEN, whose ref pushes GitHub does not let
# trigger workflows; then trigger the release build manually:
#   gh workflow run release-binaries.yml --ref faucet-cli-vX.Y.Z
# (workflow_dispatch on the tag ref; the plan job reads the tag from the ref).
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "faucet-cli-vX.Y.Z tag to build (runs this workflow from the dispatch ref against that tag)"
        type: string
        default: ""
  push:
    tags:
      - 'faucet-cli-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && (inputs.tag || github.ref_name) || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', inputs.tag || github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        shell: bash
        env:
          DIST_INSTALLER_SHA256: b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5
        # Hand edit (#789 SUPPLY-11): verify the pinned installer before running
        # it; it carries the checksums of the binaries it downloads.
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf -o dist-installer.sh https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
          if command -v sha256sum >/dev/null; then
            echo "${DIST_INSTALLER_SHA256}  dist-installer.sh" | sha256sum -c -
          else
            echo "${DIST_INSTALLER_SHA256}  dist-installer.sh" | shasum -a 256 -c -
          fi
          sh dist-installer.sh
      # Hand edit (#978): dist generates `curl | sh` of the latest
      # cargo-auditable installer here; pin a release and verify it first.
      - name: Install cargo-auditable
        shell: bash
        env:
          AUDITABLE_INSTALLER_SHA256: 232904f2a30ecaf9027903f6327f08c8232917f8fa985540dce0ad9813e4dd92
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf -o cargo-auditable-installer.sh https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.7/cargo-auditable-installer.sh
          if command -v sha256sum >/dev/null; then
            echo "${AUDITABLE_INSTALLER_SHA256}  cargo-auditable-installer.sh" | sha256sum -c -
          else
            echo "${AUDITABLE_INSTALLER_SHA256}  cargo-auditable-installer.sh" | shasum -a 256 -c -
          fi
          sh cargo-auditable-installer.sh
      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        # Hand edit (#978): the dist arguments reach the shell through env.
        env:
          DIST_ARGS: ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', inputs.tag || github.ref_name)) || 'plan' }}
        run: |
          # shellcheck disable=SC2086 # DIST_ARGS is several words
          dist $DIST_ARGS --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          submodules: recursive
      # Hand edit (#978): dist's "install Rust in the container" step (curl | sh
      # of rustup) is removed. Every target builds on a native runner that has
      # Rust, so no matrix entry sets `container`; restore a checksum-verified
      # rustup-init if one ever does.
      - name: Install dist
        shell: bash
        env:
          DIST_INSTALLER_SHA256: b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5
        # Hand edit (#789 SUPPLY-11): verify the pinned installer before running
        # it; it carries the checksums of the binaries it downloads.
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf -o dist-installer.sh https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
          if command -v sha256sum >/dev/null; then
            echo "${DIST_INSTALLER_SHA256}  dist-installer.sh" | sha256sum -c -
          else
            echo "${DIST_INSTALLER_SHA256}  dist-installer.sh" | shasum -a 256 -c -
          fi
          sh dist-installer.sh
      # Hand edit (#978): dist generates `curl | sh` of the latest
      # cargo-auditable installer here; pin a release and verify it first.
      # It must run in this job, where `dist build` runs.
      - name: Install cargo-auditable
        shell: bash
        env:
          AUDITABLE_INSTALLER_SHA256: 232904f2a30ecaf9027903f6327f08c8232917f8fa985540dce0ad9813e4dd92
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf -o cargo-auditable-installer.sh https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.7/cargo-auditable-installer.sh
          if command -v sha256sum >/dev/null; then
            echo "${AUDITABLE_INSTALLER_SHA256}  cargo-auditable-installer.sh" | sha256sum -c -
          else
            echo "${AUDITABLE_INSTALLER_SHA256}  cargo-auditable-installer.sh" | shasum -a 256 -c -
          fi
          sh cargo-auditable-installer.sh
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        # The command comes from the dist plan (dist-workspace.toml), not from
        # an event payload.
        run: | # zizmor: ignore[template-injection]
          ${{ matrix.packages_install }}
      # Hand edit: the chocolatey NASM package does not put nasm.exe on PATH,
      # and aws-lc-sys / openssl-src look it up there.
      - name: Put NASM on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
      # Hand edit: openssl-src must run Strawberry Perl, not the MSYS perl of the bash shell.
      - name: Use Strawberry Perl for OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
      - name: Build artifacts
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          # Actually do builds and make zips and whatnot
          # shellcheck disable=SC2086 # the flags are word lists
          dist build $TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Hand edit (#978): dist generates `curl | sh` of a cargo-cyclonedx
      # installer here; download a pinned release binary and verify it.
      - name: Install cargo-cyclonedx
        env:
          CYCLONEDX_SHA256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf -o cargo-cyclonedx.tar.xz https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz
          echo "${CYCLONEDX_SHA256}  cargo-cyclonedx.tar.xz" | sha256sum -c -
          tar -xJf cargo-cyclonedx.tar.xz
          install -m 0755 cargo-cyclonedx-x86_64-unknown-linux-gnu/cargo-cyclonedx ~/.cargo/bin/
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist build ${TAG_FLAG} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # Hand edit (#978): one SBOM for the shipped binary (the CLI's `full`
      # build, dependencies of every target) rather than dist's one per
      # workspace crate.
      - id: cargo-cyclonedx
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/sbom-start"
          cargo cyclonedx --manifest-path cli/Cargo.toml --features full --target all \
            --format json --spec-version 1.5 --override-filename faucet-cli
          # The file name --override-filename produces differs between cargo-cyclonedx releases.
          sbom=$(find . -path ./target -prune -o -name 'faucet-cli*.json' -newer "$RUNNER_TEMP/sbom-start" -print | head -n 1)
          if [ -z "$sbom" ]; then
            echo "::error::cargo cyclonedx wrote no faucet-cli SBOM"
            exit 1
          fi
          echo "SBOM written to $sbom"
          mv "$sbom" target/distrib/faucet-cli.cdx.json
          echo "path=target/distrib/faucet-cli.cdx.json" >> "$GITHUB_OUTPUT"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ steps.cargo-cyclonedx.outputs.path }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    permissions:
      contents: write
      # Build provenance for every release asset (#789 SUPPLY-05).
      id-token: write
      attestations: write
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist host ${TAG_FLAG} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "artifacts/*"
      # Hand edit (#978): attach the Sigstore bundle beside each asset so the
      # provenance is verifiable offline with
      # `gh attestation verify <asset> --bundle <asset>.sigstore.json`. One bundle
      # covers every subject; a copy per asset keeps the pairing obvious.
      - name: Attach provenance bundles
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          for asset in artifacts/*; do
            case "$asset" in *.sigstore.json) continue ;; esac
            cp "$BUNDLE" "$asset.sigstore.json"
          done
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # If we're editing a release in place, we need to upload things ahead of time.
          # release-plz creates the GitHub release for this tag (create-release = false
          # in dist-workspace.toml); tolerate the small window where the tag exists but
          # the release record does not yet.
          for i in 1 2 3 4 5 6; do
            if gh release view "${TAG}" >/dev/null 2>&1; then break; fi
            echo "release for ${TAG} not visible yet (attempt $i); waiting 30s"
            sleep 30
          done
          gh release upload "${TAG}" artifacts/* --clobber

          gh release edit "${TAG}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --draft=false

  # The Connector Hub feed (#572): attached to the release so the website
  # picks up every released connector without a manual snapshot.
  connector-export:
    permissions:
      contents: write
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      # This job builds only connectors.json (connector metadata for the
      # website), not a shipped artifact; uncached it takes over 30 minutes.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: # zizmor: ignore[cache-poisoning]
          key: connector-export
      - name: Export and upload connectors.json
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cargo build -p faucet-cli --no-default-features --features full
          ./target/debug/faucet conformance --export --require-all > connectors.json
          gh release upload "${TAG}" connectors.json --clobber
      # notify-site fires minutes after the release burst, long before this
      # job finishes, so that rebuild still reads the previous feed. Rebuild
      # the site again now that the feed is attached.
      - name: Rebuild the site with the new connector feed
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN || secrets.RELEASE_PLZ_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Set SITE_DISPATCH_TOKEN (or RELEASE_PLZ_TOKEN) with contents:write on faucet-hq/faucet-hq.github.io; the site picks up the feed at its next scheduled build"
            exit 0
          fi
          gh api --method POST repos/faucet-hq/faucet-hq.github.io/dispatches \
            -f event_type=faucet-release \
            -f "client_payload[tag]=$TAG"

  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          repository: "faucet-hq/homebrew-faucet-stream"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push

  announce:
    permissions:
      contents: write
    needs:
      - plan
      - host
      - publish-homebrew-formula
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          submodules: recursive
