name: Release (manual fallback)

# Manual release workflow — retained as a fallback for ad-hoc / partial
# releases. The default release path is now `release-plz.yml`, which runs
# automatically on every push to `main` (opens a release PR; publishes on
# merge). Use this workflow only when:
#   - release-plz is unavailable, or
#   - you need a one-off bulk re-publish (e.g. scope=all after a registry
#     incident or a CI regression that broke the automatic flow).
# See CONTRIBUTING.md (#release-process) for the recommended flow.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to release"
        required: true
        type: choice
        options:
          - all         # bump + publish every publishable crate (in rate-limited waves)
          - core        # faucet-core only
          - connectors  # every publishable crate except faucet-core, the umbrella, and faucet-cli
          - umbrella    # faucet-stream umbrella only
          - custom      # specify crates in custom_crates input
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      custom_crates:
        description: "Comma-separated crate names (only when scope=custom), e.g. faucet-sink-postgres,faucet-source-rest"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no publish, no git changes)"
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Check out (and thus push commits/tags) with an admin PAT, not the
          # bot GITHUB_TOKEN. Two reasons:
          #  1. GitHub suppresses workflow triggers from GITHUB_TOKEN-pushed
          #     refs, so tags pushed here would NOT trigger release-binaries.yml
          #     (no CLI binaries / Homebrew update). A PAT-pushed tag does.
          #  2. With a `main` ruleset bypass for this token/App, the version-bump
          #     commit can push to protected `main` without disabling protection.
          # Falls back to GITHUB_TOKEN if the PAT secret is unset.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      # ── DISABLED 2026-08-07 ──────────────────────────────────────────────
      # This job no longer compiles the workspace (fmt/clippy/test were removed
      # and publishing uses `cargo publish --no-verify`), so nothing fills the
      # disk. Kept commented — re-enable verbatim if a build/verify step that
      # exhausts the runner's ~14 GB disk is ever added back to this workflow.
      #
      # - name: Free up disk space
      #   run: |
      #     sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
      #                 /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      #     sudo docker image prune --all --force || true
      #     df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"

      # ── DISABLED 2026-08-07 ──────────────────────────────────────────────
      # Needed only to compile the `rdkafka` crate (librdkafka from source).
      # Nothing in this job builds the Kafka connectors anymore (no test step;
      # `cargo publish --no-verify` skips the per-crate build). `ubuntu-latest`
      # already ships build-essential/libssl-dev/cmake for `cargo install
      # cargo-release`. Kept commented — re-enable if a build/verify step that
      # compiles the Kafka crates is added back.
      #
      # - name: Install librdkafka prerequisites
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # NOTE: fmt / clippy / test are intentionally NOT re-run here — they are
      # already enforced on every push/PR by ci.yml (sharded across the
      # feature matrix). This manual fallback exists to *publish*; cargo-release
      # builds and verifies each crate during `cargo publish`. Re-running the
      # full all-features test in this single job is redundant and was
      # exhausting the runner disk (see "Free up disk space" above).

      # ── Derive publishable crate lists from cargo metadata ────────────
      #
      # Single source of truth — never hand-maintain the list. The previous
      # hardcoded arrays silently drifted and omitted 8 crates (parquet,
      # gcs, sink-stdout, both state backends, faucet-cli), so `scope=all`
      # would have shipped a broken release (#78/#11).
      #
      # `ordered_all` is every publishable workspace member (publish != false)
      # in dependency order, computed with `tsort` over the intra-workspace
      # normal/build deps so the wave-publish step never tries to publish a
      # crate before its dependencies. `ordered_connectors` drops faucet-core,
      # the umbrella, and the CLI binary.
      - name: Compute publishable crate lists
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          set_json=$(echo "$metadata" | jq '[.packages[] | select(.publish==null) | .name]')
          ordered_all=$(
            {
              # Anchor every member to a synthetic root so isolated crates are
              # still emitted, then add a "dep pkg" edge per intra-workspace
              # (non-dev) dependency so tsort orders dependencies first.
              echo "$set_json" | jq -r '.[] | "__root__ \(.)"'
              echo "$metadata" | jq -r --argjson set "$set_json" '
                .packages[] | select(.publish==null) as $p
                | $p.dependencies[]? | select(.kind != "dev")
                | select(.name as $n | $set | index($n))
                | "\(.name) \($p.name)"'
            } | tsort | grep -vx '__root__'
          )
          ordered_connectors=$(echo "$ordered_all" | grep -vxE 'faucet-core|faucet-stream|faucet-cli')

          # Fail fast if the derivation dropped or duplicated a crate (a tsort
          # cycle, a jq-filter regression, a malformed dependency edge). The
          # whole point of deriving the list from `cargo metadata` is that a
          # `scope=all` publish covers *every* publishable member — never ship
          # a silently-partial set the way the old hardcoded arrays did
          # (#78/#11).
          expected=$(echo "$set_json" | jq 'length')
          actual=$(echo "$ordered_all" | grep -c .)
          if [ "$actual" -ne "$expected" ]; then
            echo "ERROR: dependency-ordered list has $actual crate(s) but cargo metadata reports $expected publishable member(s) — tsort dropped or duplicated a crate." >&2
            echo "Derived order was:" >&2
            echo "$ordered_all" | nl >&2
            exit 1
          fi
          dupes=$(echo "$ordered_all" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "ERROR: duplicate crate(s) in the dependency-ordered publish list:" >&2
            echo "$dupes" >&2
            exit 1
          fi
          # The three structural anchors must always be present and publishable.
          for anchor in faucet-core faucet-stream faucet-cli; do
            if ! echo "$ordered_all" | grep -qx "$anchor"; then
              echo "ERROR: expected publishable crate '$anchor' is missing from the derived list — check its 'publish' setting." >&2
              exit 1
            fi
          done

          echo "Publishable crates in dependency order ($actual total):"
          echo "$ordered_all" | nl
          echo "ordered_all=$(echo "$ordered_all" | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "ordered_connectors=$(echo "$ordered_connectors" | tr '\n' ' ')" >> "$GITHUB_ENV"

      # ── Dry run ───────────────────────────────────────────────────────
      - name: Release (dry run)
        if: ${{ inputs.dry_run }}
        # Inputs reach the script as environment variables, never spliced
        # into its text (#789 SUPPLY-10).
        env:
          SCOPE: ${{ inputs.scope }}
          BUMP: ${{ inputs.bump }}
          CUSTOM_CRATES: ${{ inputs.custom_crates }}
        run: |

          read -ra all_crates <<< "$ordered_all"
          read -ra connectors <<< "$ordered_connectors"

          case "$SCOPE" in
            all)        selected=("${all_crates[@]}") ;;
            core)       selected=(faucet-core) ;;
            connectors) selected=("${connectors[@]}") ;;
            umbrella)   selected=(faucet-stream) ;;
            custom)
              IFS=',' read -ra selected <<< "$CUSTOM_CRATES"
              selected=("${selected[@]// /}")  # trim whitespace
              ;;
          esac

          PKGS=""
          for c in "${selected[@]}"; do PKGS="$PKGS -p $c"; done

          echo "==> Dry run: cargo release $BUMP $PKGS"
          cargo release "$BUMP" $PKGS --no-confirm --no-push --no-tag --no-publish --verbose

      # ── Real release ──────────────────────────────────────────────────
      #
      # crates.io rate-limits *new* crate registrations to a burst of 5, then
      # 1 per 10 minutes. For "all" and "connectors" scopes, we bump versions
      # first (no publish), then publish in waves of 5 with 15-minute waits
      # between waves. For small scopes (core, umbrella, custom <=5), publish
      # directly with cargo-release.
      #
      # Every publish is verified against the sparse index before moving on
      # (#447). The previous `cargo publish || echo WARNING; sleep 5` loop had
      # two compounding defects that produced silently-partial releases:
      #
      #   1. `|| { ... continuing }` swallowed *every* failure as a warning, so
      #      a genuine error was indistinguishable from "already published" and
      #      the job still reported success.
      #   2. `sleep 5` is far too short for sparse-index propagation, so a
      #      dependent published seconds after its dependency could not resolve
      #      the new version — it failed, and the failure was swallowed.
      #
      # The loop below instead: skips a crate whose target version is already on
      # the index (idempotent re-runs), retries a publish that fails only
      # because a just-published dependency has not propagated yet, waits for
      # the index to serve the new version before publishing anything that might
      # depend on it, and fails the job at the end naming every crate it could
      # not publish.
      - name: Release
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SCOPE: ${{ inputs.scope }}
          BUMP: ${{ inputs.bump }}
          CUSTOM_CRATES: ${{ inputs.custom_crates }}
        run: |
          set -uo pipefail

          read -ra all_crates <<< "$ordered_all"
          read -ra connectors <<< "$ordered_connectors"

          case "$SCOPE" in
            all)        selected=("${all_crates[@]}") ;;
            core)       selected=(faucet-core) ;;
            connectors) selected=("${connectors[@]}") ;;
            umbrella)   selected=(faucet-stream) ;;
            custom)
              IFS=',' read -ra selected <<< "$CUSTOM_CRATES"
              selected=("${selected[@]// /}")
              ;;
          esac

          # ── Sparse-index helpers ────────────────────────────────────────
          #
          # crates.io's sparse index serves one newline-delimited-JSON file per
          # crate under a name-length-derived prefix. `index_has` answers "is
          # version V of crate C resolvable yet?" — the authoritative check for
          # both "already published" and "has propagated".
          index_path() {
            local name="$1"
            case ${#name} in
              1) echo "1/$name" ;;
              2) echo "2/$name" ;;
              3) echo "3/${name:0:1}/$name" ;;
              *) echo "${name:0:2}/${name:2:2}/$name" ;;
            esac
          }
          index_has() {
            local name="$1" version="$2"
            curl -sf "https://index.crates.io/$(index_path "$name")" \
              | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null 2>&1
          }
          # Block until `version` of `name` is resolvable, or time out.
          wait_for_index() {
            local name="$1" version="$2" waited=0
            while [ "$waited" -lt "$INDEX_TIMEOUT" ]; do
              if index_has "$name" "$version"; then
                echo "  index: $name@$version resolvable after ${waited}s"
                return 0
              fi
              sleep "$INDEX_POLL"
              waited=$(( waited + INDEX_POLL ))
            done
            echo "  index: $name@$version NOT resolvable after ${waited}s" >&2
            return 1
          }
          # Publish one crate, tolerating only the two benign outcomes:
          # already-published (idempotent re-run) and a dependency that has not
          # propagated yet (retried). Anything else fails.
          publish_one() {
            local crate="$1" version="$2" attempt=1 log rc
            if index_has "$crate" "$version"; then
              echo "  $crate@$version already on crates.io — skipping"
              return 0
            fi
            while [ "$attempt" -le "$PUBLISH_ATTEMPTS" ]; do
              echo "  Publishing $crate@$version (attempt $attempt/$PUBLISH_ATTEMPTS)..."
              log=$(cargo publish -p "$crate" --no-verify 2>&1)
              rc=$?
              echo "$log"
              if [ "$rc" -eq 0 ]; then
                wait_for_index "$crate" "$version" || return 1
                return 0
              fi
              # Already on the registry (a re-run, or a racing publish): fine.
              if grep -qiE "already (been )?uploaded|crate version .* is already" <<< "$log"; then
                echo "  $crate@$version already uploaded — treating as published"
                wait_for_index "$crate" "$version" || return 1
                return 0
              fi
              # Dependency not visible on the index yet — the propagation race
              # this step exists to defeat. Back off and retry.
              if grep -qiE "no matching package named|failed to select a version|could not find .* in registry" <<< "$log"; then
                echo "  $crate: dependency not yet propagated; retrying in ${PUBLISH_RETRY_WAIT}s" >&2
                sleep "$PUBLISH_RETRY_WAIT"
                attempt=$(( attempt + 1 ))
                continue
              fi
              # Rate limited — wait out the window and retry.
              if grep -qiE "429|too many requests|rate limit" <<< "$log"; then
                echo "  $crate: rate limited; waiting ${RATE_LIMIT_WAIT}s" >&2
                sleep "$RATE_LIMIT_WAIT"
                attempt=$(( attempt + 1 ))
                continue
              fi
              echo "  $crate: publish failed with a non-retriable error" >&2
              return 1
            done
            echo "  $crate: publish still failing after $PUBLISH_ATTEMPTS attempt(s)" >&2
            return 1
          }

          INDEX_POLL=10
          INDEX_TIMEOUT=600        # 10 min for a version to appear on the index
          PUBLISH_ATTEMPTS=5
          PUBLISH_RETRY_WAIT=60    # dependency-propagation backoff
          RATE_LIMIT_WAIT=630      # crates.io: 1 new crate per 10 minutes

          # If 5 or fewer crates, publish directly with cargo-release, which
          # bumps, publishes in dependency order, and waits for propagation
          # between dependents itself (and fails the job on any error).
          if [ ${#selected[@]} -le 5 ]; then
            PKGS=""
            for c in "${selected[@]}"; do PKGS="$PKGS -p $c"; done
            echo "==> Publishing ${#selected[@]} crates directly"
            cargo release "$BUMP" $PKGS --no-confirm --execute
            exit $?
          fi

          # Step 1: Bump versions, commit, tag — but don't publish yet.
          PKGS=""
          for c in "${selected[@]}"; do PKGS="$PKGS -p $c"; done
          echo "==> Step 1: Bumping versions for ${#selected[@]} crates"
          if ! cargo release "$BUMP" $PKGS --no-confirm --no-publish --execute; then
            echo "ERROR: version bump failed; nothing was published." >&2
            exit 1
          fi

          # Push the bump commit + tags BEFORE publishing (#447). If publishing
          # is partial, `main` and the tags still describe exactly the versions
          # we intended, and re-running this workflow resumes from the index
          # rather than re-bumping. Pushing only after a fully-successful
          # publish would, on a partial failure, leave crates.io ahead of the
          # repository — the worse of the two inconsistencies.
          echo "==> Pushing bump commit and tags before publishing"
          if ! git push --follow-tags origin HEAD; then
            echo "ERROR: failed to push version bumps; aborting before publish." >&2
            exit 1
          fi

          # Read the post-bump target version of every selected crate, so the
          # index checks compare against what we are actually publishing.
          declare -A target_version
          while IFS=$'\t' read -r name version; do
            target_version["$name"]="$version"
          done < <(cargo metadata --no-deps --format-version 1 \
                   | jq -r '.packages[] | "\(.name)\t\(.version)"')

          # Step 2: Publish in waves of 5 with 15-minute waits between waves.
          WAVE_SIZE=5
          WAVE_WAIT=900  # 15 minutes
          total=${#selected[@]}
          wave=1
          failed=()

          for (( i=0; i<total; i+=WAVE_SIZE )); do
            wave_crates=("${selected[@]:i:WAVE_SIZE}")
            echo ""
            echo "==> Wave $wave: publishing ${wave_crates[*]}"

            for crate in "${wave_crates[@]}"; do
              version="${target_version[$crate]:-}"
              if [ -z "$version" ]; then
                echo "  $crate: no version in cargo metadata — cannot verify publish" >&2
                failed+=("$crate (unknown version)")
                continue
              fi
              if ! publish_one "$crate" "$version"; then
                failed+=("$crate@$version")
              fi
            done

            remaining=$(( total - i - WAVE_SIZE ))
            if [ $remaining -gt 0 ]; then
              echo "==> Waiting ${WAVE_WAIT}s for crates.io rate limit reset..."
              sleep $WAVE_WAIT
            fi

            wave=$((wave + 1))
          done

          # A partial release must never report success (#447). Tags/bumps are
          # already on the branch, so the recovery is to re-run this workflow
          # (publishes are idempotent — already-published crates are skipped).
          if [ ${#failed[@]} -gt 0 ]; then
            echo ""
            echo "ERROR: ${#failed[@]} crate(s) were NOT published:" >&2
            for f in "${failed[@]}"; do echo "  - $f" >&2; done
            echo "" >&2
            echo "Versions and tags are committed; re-run this workflow with the same" >&2
            echo "scope to publish the stragglers (already-published crates are skipped)." >&2
            exit 1
          fi
          echo ""
          echo "==> All ${total} selected crate(s) published and resolvable on the index."

      # Catch-up push. The >5-crate path already pushes its bump commit + tags
      # before publishing (see the Release step); the ≤5 path lets cargo-release
      # push. This is a no-op in both cases unless something was left local.
      # `always()` so a partial-publish failure still lands the bumps that were
      # pushed above rather than silently dropping this step's catch-up.
      - name: Push tags and commits
        if: ${{ !inputs.dry_run && always() }}
        run: |
          git push --follow-tags origin HEAD
