# Daily RustSec advisory scan (#789 SUPPLY-03). The `Supply chain` CI job gates
# merges; this catches advisories published between merges and files an issue
# so someone triages them (fix the dependency, or add a dated `ignore` entry
# with a reason to deny.toml); a green scan closes it.
name: Advisories

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.19.7
      - name: cargo deny check advisories
        id: deny
        env:
          REPORT: ${{ runner.temp }}/advisories.md
        run: |
          set -uo pipefail
          : > "$REPORT"
          failed=0
          for manifest in Cargo.toml fuzz/Cargo.toml; do
            json="$RUNNER_TEMP/deny-$(dirname "$manifest" | tr / _).json"
            cargo deny --manifest-path "$manifest" --all-features --format json --log-level warn \
              check advisories 2> "$json"
            status=$?
            jq -R -r 'fromjson? | select(.type == "diagnostic") | .fields.message // empty' "$json" || true
            if [ "$status" -ne 0 ]; then
              failed=1
              found=$(jq -R -r 'fromjson? | select(.type == "diagnostic" and .fields.severity == "error")
                | if .fields.advisory then
                    "- [\(.fields.advisory.id)](https://rustsec.org/advisories/\(.fields.advisory.id)) in `\(.fields.advisory.package)`: \(.fields.advisory.title)"
                  else
                    "- \(.fields.code): \(.fields.message)"
                  end' "$json" 2>/dev/null | sort -u)
              if [ -z "$found" ]; then
                found="- the scan failed without naming an advisory (a tool or network error); see the run log"
              fi
              printf '**%s**\n%s\n\n' "$manifest" "$found" >> "$REPORT"
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Open or update the tracking issue
        if: steps.deny.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ runner.temp }}/advisories.md
        run: |
          title="RustSec advisory needs triage"
          body="The daily advisory scan failed: ${RUN_URL}

          $(cat "$REPORT")
          Fix the dependency (bump to a fixed release) or add a dated \`ignore\` entry with a reason to \`deny.toml\`. This issue closes itself after the next green scan."
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label bug --label tier-1 --body "$body"
          fi
      - name: Close the tracking issue after a green scan
        if: steps.deny.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="RustSec advisory needs triage"
          gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number' |
            while read -r n; do
              gh issue close "$n" --reason completed --comment "The advisory scan is green again: ${RUN_URL}"
            done
      - name: Fail when advisories are open
        if: steps.deny.outputs.failed != '0'
        run: exit 1
