name: CI

on:
  # Run on PRs, and on pushes to main — the latter so the Coverage job uploads
  # main-branch coverage to Codecov (the badge tracks branch/main) and so merge
  # commits themselves get CI-verified (PR CI only tests the PR head).
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  # Harden against transient crates.io connectivity drops seen on GitHub-hosted
  # runners (`curl failed` / `SSL_read: unexpected eof` / connection reset) that
  # abort cargo during dependency download. Retry more, and disable HTTP/2
  # multiplexing to avoid the "Error in the HTTP2 framing layer" download
  # failures specifically (forces HTTP/1.1).
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same ref (PR branch / main) so stale builds
# don't keep holding runner slots — important on a shared/capacity-limited pool.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether a PR touches anything that can affect the build/tests. When a
  # PR only changes docs / workflows / assets, the heavy (non-required) jobs
  # below skip. Pushes to main always run everything (the `github.event_name`
  # guard on each job), so main stays fully verified and coverage still uploads.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.gate.outputs.code }}
      ui: ${{ steps.filter.outputs.ui }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # 'every' quantifier: a changed file counts toward `code` only if it
          # matches ALL these negations — i.e. it is NOT a doc/workflow/asset
          # file. So `code` is true iff at least one real source/build file
          # changed. If detection is ever uncertain, paths-filter errs toward
          # "changed" (fail-safe → run everything).
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!.github/**'
              - '!LICENSE*'
              - '!**/*.png'
              - '!**/*.svg'
              - '!**/*.jpg'
              - '!cli/src/serve/ui/**'
              - '!deploy/**'
            # serve web-console assets (JS/CSS/HTML). They embed into the binary,
            # so a change here needs the serve-ui isolation test — but NOT the
            # Rust matrix, clippy, semver, connector features, or supply-chain.
            ui:
              - 'cli/src/serve/ui/**'
            # Deployment manifests (Helm chart). A change here needs a Helm lint /
            # template render — but NOT the Rust matrix, clippy, semver, connector
            # features, or supply-chain. Excluded from `code` above so a chart-only
            # PR skips the heavy suite (like docs), and validated by `helm-lint`.
            deploy:
              - 'deploy/helm/**'
      # The release-plz "chore: release" PR is auto-updated on every push to main
      # (version + changelog bumps), which would otherwise re-run the full CI on
      # it after every normal merge. Force `code=false` for that PR so all heavy
      # work skips (the whole-job-gated jobs skip; the required checks — clippy,
      # docs, cli-build, semver, coverage — run cheap and report green because
      # their expensive steps are also code-gated). Opt back in by adding the
      # `release-ci` label to the release PR when you're ready to cut a release.
      - id: gate
        env:
          RAW_CODE: ${{ steps.filter.outputs.code }}
          IS_RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz') }}
          HAS_RELEASE_CI: ${{ contains(github.event.pull_request.labels.*.name, 'release-ci') }}
        run: |
          code="$RAW_CODE"
          if [ "$IS_RELEASE_PR" = "true" ] && [ "$HAS_RELEASE_CI" != "true" ]; then
            echo "release-plz PR without the 'release-ci' label → skipping CI. Add the label to run it."
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - run: cargo fmt --all --check

  doc-counts:
    name: Doc counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check connector counts in docs match connector crates
        run: bash scripts/check-doc-counts.sh
      - name: Check no third-party vendor names in the engine (#780)
        run: |
          python3 scripts/test_vendor_names.py
          python3 scripts/vendor-names.py
      - name: Check no connector crate depends on another connector (#784)
        run: python3 scripts/connector-deps.py
      - name: Check no published crate packages a private key (#789 SUPPLY-20)
        run: python3 scripts/packaged-keys.py
      - name: Check `full` enables every feature and the image builds `full` (#845)
        run: |
          python3 scripts/test_full_feature_coverage.py
          python3 scripts/full-feature-coverage.py
      - name: Check the Helm chart appVersion equals the faucet-cli version (#830)
        run: |
          python3 scripts/test_helm_app_version.py
          python3 scripts/helm-app-version.py

  # The agent skills ship with the engine (#853): they link to docs pages and
  # cli/examples files that must exist, carry no version facts, and their
  # plugin version is the faucet-cli version. Every connector, mode and
  # top-level block must have a validated example in cli/examples/.
  skills:
    name: Skills and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Test the skill and example scripts
        run: |
          python3 scripts/test_check_skills.py
          python3 scripts/test_example_coverage.py
          python3 scripts/test_plugin_version.py
      - name: Skills link to real docs pages and examples, and carry no version facts
        run: python3 scripts/check_skills.py --emit-yaml "$RUNNER_TEMP/skill-yaml"
      - name: The plugin version equals the faucet-cli version
        run: python3 scripts/plugin-version.py
      - name: Every connector, write mode, mirror mode and config block has an example
        run: python3 scripts/example-coverage.py

  skill-connector-examples:
    name: Skill connector examples
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        crate: [faucet-source-acme, faucet-sink-acme]
    env:
      MANIFEST: skills/faucet-connector/examples/${{ matrix.crate }}/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: skills/faucet-connector/examples/${{ matrix.crate }}
      # The crates depend on crates.io `faucet-core = "1"` as a third-party
      # connector would; patch them onto this commit's faucet-core and
      # faucet-conformance so the skill's example tracks the engine.
      - name: Build, lint and run the conformance tests against the workspace faucet-core
        run: |
          patch=(--config "patch.crates-io.faucet-core.path='$GITHUB_WORKSPACE/crates/core'"
                 --config "patch.crates-io.faucet-conformance.path='$GITHUB_WORKSPACE/crates/conformance'")
          cargo fmt --manifest-path "$MANIFEST" --check
          cargo clippy --manifest-path "$MANIFEST" "${patch[@]}" --all-targets -- -D warnings
          cargo test --manifest-path "$MANIFEST" "${patch[@]}"
          cargo tree --manifest-path "$MANIFEST" "${patch[@]}" -i faucet-core --depth 0 | grep -q "$GITHUB_WORKSPACE/crates/core"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # Required check → job always runs (stays green), but the heavy step is
    # gated so a docs/workflow-only PR reports green without a full build.
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Fail on any rustdoc warning (broken intra-doc links, etc.) so the
      # docs.rs render stays clean. The `doc_cfg` feature-badge path itself is
      # nightly-only and exercised by docs.rs, not here.
      - name: Build docs
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    # Drop debug info for this job. The all-features workspace binary plus the
    # serve-ui isolation test binaries are enormous; with full DWARF the final
    # `ld` intermittently dies with `signal 7 [Bus error]` (an out-of-memory
    # linker mmap fault — the runner has ~115 GB free disk but limited RAM).
    # debuginfo=0 shrinks the object files and link memory sharply; test
    # pass/fail and panic file:line are unaffected (only symbolized backtraces
    # are lost). Coverage (which needs debug info) runs in a separate job.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # This job provides Docker, the Oracle Instant Client and sqlite3, so an
      # integration test whose backend cannot start must fail here instead of
      # passing silently (#789 SUPPLY-09).
      FAUCET_REQUIRE_BACKENDS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk space
        # The all-features instrumented build (bundled DuckDB + the full
        # connector tree) plus the coverage profraw data and testcontainer
        # images exceed the hosted runner's free disk. Drop every large
        # preinstalled toolchain we never use (~40 GB) and clear the apt cache.
        # None of these are used by the Rust / DuckDB / testcontainers build.
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /opt/microsoft \
            /usr/lib/jvm \
            /usr/local/julia* \
            /usr/share/miniconda \
            /usr/local/share/vcpkg \
            /usr/share/az_* \
            /usr/lib/google-cloud-sdk \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo apt-get clean
          docker image prune -af >/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential sqlite3
      # The Oracle connectors (ODPI-C) load Instant Client at runtime; without it
      # their integration tests skip and the integration-coverage gate fails.
      - name: Cache Oracle Instant Client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/oracle/instantclient-basiclite-linuxx64.zip
          key: oracle-instantclient-basiclite-linuxx64-23.26.2.0.0
      - name: Install Oracle Instant Client
        run: |
          set -euo pipefail
          zip="$HOME/.cache/oracle/instantclient-basiclite-linuxx64.zip"
          # A pinned release, verified (#789 SUPPLY-12); bump the URL, the
          # digest and the cache key together.
          if [ ! -s "$zip" ]; then
            mkdir -p "$(dirname "$zip")"
            curl -fsSL --retry 3 -o "$zip" \
              https://download.oracle.com/otn_software/linux/instantclient/2326200/instantclient-basiclite-linux.x64-23.26.2.0.0.zip
          fi
          echo "c5e97765e633ad02597b8274c35efe5c10bd249a3285e34ee58fa7b318243225  $zip" | sha256sum -c -
          sudo apt-get install -y libaio1t64 || sudo apt-get install -y libaio1
          if [ ! -e /usr/lib/x86_64-linux-gnu/libaio.so.1 ] && [ -e /usr/lib/x86_64-linux-gnu/libaio.so.1t64 ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          fi
          sudo mkdir -p /opt/oracle
          sudo unzip -qo "$zip" -d /opt/oracle
          dir="$(ls -d /opt/oracle/instantclient_* | sort -V | tail -1)"
          echo "LD_LIBRARY_PATH=$dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "Oracle Instant Client installed at $dir"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clear Docker before the container-backed tests
        # Testcontainer images and volumes left by earlier steps count against
        # the runner disk the tests (MinIO's free-space check among them) need.
        run: |
          docker ps -aq | xargs -r docker rm -f >/dev/null
          docker system prune -af --volumes >/dev/null
          df -h /
      - name: Run workspace tests
        # Integration tests boot Docker containers via testcontainers, whose
        # in-process (bollard) image pull intermittently fails. Only that is
        # retried: any other failure — a flaky test included — fails at once.
        run: scripts/retry-on-image-pull.sh cargo test --workspace --all-features
      - name: Free disk taken by the workspace test binaries
        # The next step rebuilds faucet-cli with other features; the runner
        # runs out of disk if the workspace run's test executables stay.
        run: |
          find target/debug/deps -maxdepth 1 -type f -perm -u+x -delete
          rm -rf target/debug/incremental
          df -h /
      - name: Run serve-ui and serve-openapi tests in isolation
        # Explicitly target the embedded-console tests with serve-ui so the
        # feature-gated #![cfg(feature = "serve-ui")] gate is exercised and
        # the OpenAPI two-way sync test runs against the console-enabled router.
        run: cargo test -p faucet-cli --features serve-ui --test serve_ui --test serve_openapi

  # #651 Category A/G — the reliability gate. Deliberately separate from `test`:
  # `test` runs the whole workspace including every testcontainer suite, takes
  # ~25 min, and is NOT a required check. The guarantees this job covers (no
  # loss, no duplication, atomic refresh, cleanup never deletes on a partial
  # run, state written by a release stays readable) are the ones a regression in
  # would corrupt data silently, so they get a fast, Docker-free, REQUIRED job
  # that cannot be skipped or flake on an image pull.
  reliability:
    name: Reliability guarantees
    runs-on: ubuntu-latest
    needs: changes
    # Required check → the job ALWAYS runs so it always reports, and the heavy
    # steps are gated instead (the same shape `clippy` uses). A job-level `if`
    # would skip the whole job on a docs-only PR, and a skipped required check
    # can leave a PR sitting on "Expected — waiting for status" forever — the
    # exact failure mode that keeps `codecov/patch` out of the required set.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
      - name: Engine guarantee suites (Category A) + state-format gates (Category G)
        # No Docker, no network: the scripted doubles inject failures at exact
        # engine boundaries, so these run in seconds and never flake.
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        run: cargo test -p faucet-conformance --all-features
      - name: Engine unit suites backing the same guarantees
        # `faucet-core`'s own in-file suites cover the DLQ routing/budget matrix
        # and the masking-before-DLQ ordering, which the Category A5/A7 audit
        # found already covered there rather than duplicating.
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        run: cargo test -p faucet-core --all-features

  # Safety net for frontend-only PRs (serve console assets). When a PR touches
  # ONLY cli/src/serve/ui/** the whole Rust matrix is skipped (code == false),
  # so this one small job rebuilds the embedded console and runs the serve-ui /
  # serve-openapi isolation tests — a broken asset still can't merge. When real
  # Rust changed (code == true) the full `test` job already covers these, so this
  # job stays out of the way.
  serve-ui:
    name: Serve UI (assets)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true' && needs.changes.outputs.code != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Serve-ui + serve-openapi isolation tests
        run: cargo test -p faucet-cli --features serve-ui --test serve_ui --test serve_openapi

  # Lint + render the Helm chart on chart-only PRs (which skip the Rust suite).
  # Pushes to main always run it so the chart stays verified.
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.deploy == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Helm 4: the chart tests render NOTES with `install --dry-run=client`,
          # which Helm 3 cannot do without a cluster.
          version: v4.2.4
      - name: helm lint
        run: helm lint deploy/helm/faucet-stream
      - name: helm template (default values)
        run: helm template faucet-stream deploy/helm/faucet-stream > /dev/null
      - name: helm template (serve + existing PVC + secret files)
        run: |
          helm template faucet-stream deploy/helm/faucet-stream \
            --set serve.enabled=true \
            --set serve.persistence.existingClaim=my-pvc \
            --set secretFiles.enabled=true > /dev/null
      - name: helm template (history URL never on the command line; replica gates)
        run: |
          set -euo pipefail
          chart=deploy/helm/faucet-stream
          out=$(helm template t "$chart" --set serve.enabled=true --set serve.replicaCount=2 \
            --set serve.cluster.enabled=true --set serve.history.backend=postgres \
            --set serve.history.url=postgres://u:secret@pg/db)
          ! grep -q -- '--history' <<<"$out"
          grep -q 'name: FAUCET_SERVE_HISTORY' <<<"$out"
          for bad in "serve.replicaCount=2" "serve.autoscaling.enabled=true" \
                     "serve.replicaCount=2,serve.history.backend=postgres,serve.history.url=x"; do
            if helm template t "$chart" --set serve.enabled=true --set "$bad" >/dev/null 2>&1; then
              echo "::error::$bad rendered; it must be refused"; exit 1
            fi
          done
      - name: chart tests (ci/ values, ci/fail/ refusals, examples)
        run: bash deploy/helm/test-chart.sh deploy/helm/faucet-stream

  # Verify each feature compiles in isolation (catches accidental cross-feature deps)
  feature-check:
    name: Feature isolation
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        feature:
          # Sources
          - source-rest
          - source-rest-excel
          - source-graphql
          - source-xml
          - source-grpc
          - source-postgres
          - source-postgres-cdc
          - source-mysql
          - source-mysql-cdc
          - source-mssql
          - source-mssql-cdc
          - source-redshift
          - source-pubsub
          - source-clickhouse
          - source-azure-blob
          - source-sqlite
          - source-duckdb
          - source-sqs
          - source-nats
          - source-rabbitmq
          - source-sftp
          - source-s3
          - source-mongodb
          - source-mongodb-cdc
          - source-redis
          - source-webhook
          - source-websocket
          - source-csv
          - source-file
          - "source-file,file-formats"
          - source-elasticsearch
          - source-kafka
          - source-kinesis
          - source-parquet
          - source-delta
          - source-databricks
          - source-iceberg
          - "source-iceberg,source-iceberg-sql"
          - source-dynamodb
          - source-oracle
          - source-oracle-cdc
          - source-gcs
          - source-bigquery
          - source-snowflake
          - source-spanner
          - source-singer
          # Sinks
          - sink-bigquery
          - sink-iceberg
          - sink-postgres
          - sink-jsonl
          - sink-snowflake
          - sink-mysql
          - sink-mssql
          - sink-sqlite
          - sink-duckdb
          - sink-sqs
          - sink-nats
          - sink-rabbitmq
          - sink-sftp
          - sink-file
          - "sink-file,file-formats"
          - sink-singer
          - sink-s3
          - sink-mongodb
          - sink-redis
          - sink-csv
          - sink-elasticsearch
          - sink-http
          - sink-stdout
          - sink-kafka
          - sink-kinesis
          - sink-spanner
          - sink-parquet
          - sink-delta
          - sink-gcs
          - sink-redshift
          - sink-pubsub
          - sink-clickhouse
          - sink-azure-blob
          - sink-dynamodb
          - sink-databricks
          - sink-databricks-staging
          - sink-oracle
          # Kafka extras
          - kafka-schema-registry
          # State-store backends
          - state-redis
          - state-postgres
          # Aggregates
          - source
          - sink
          - state
          - auth
          - full
          - compression
          # Uniform file formats on every file connector (#604)
          - file-format-csv
          - file-format-xml
          - file-format-excel
          # Avro (read + write) and ORC (read) (#719)
          - file-format-avro
          - file-format-orc
          - file-format-parquet
          - "source-s3,sink-s3,file-format-avro,file-format-orc"
          - "source-azure-blob,sink-azure-blob,source-sftp,sink-sftp,file-format-avro,file-format-orc"
          - "source-gcs,sink-gcs,file-format-avro"
          - file-formats
          # Mutual-TLS client-certificate auth on the HTTP sources (#495)
          - mtls
          # TLS (amqps://) on the RabbitMQ pair (#561)
          - "source-rabbitmq,sink-rabbitmq,rabbitmq-tls"
          # OAuth1 request-signing auth provider (#496)
          - oauth1
          # Opt-in Arrow columnar record path (RFC 0002 / #375)
          - arrow
          # Encryption at rest (state bookmarks + JSONL/DLQ, #207)
          - encryption
          # Quality checks
          - quality
          - quality-jsonschema
          # Data contracts
          - contract
          # PII detection + column-level masking
          - masking
          # Data-flow policies (#702)
          - policy
          # OpenLineage emission
          - lineage
          - lineage-kafka
          # SQL transform (embedded DuckDB)
          - transform-sql
          # WASM transform (wasmtime)
          - transform-wasm
          # Scheduler (CLI-only)
          - schedule
          # HTTP control plane (CLI-only) + its persistent run-history backends + embedded web console
          - serve
          - serve-history-postgres
          - serve-history-sqlite
          - serve-ui
          # MCP server (CLI-only; implies serve)
          - mcp
          # Data Movement Catalog (CLI-only; implies serve + lineage)
          - catalog
          # Event-driven triggers (CLI-only)
          - triggers
          - triggers-object-store
          - triggers-redis
          - triggers-kafka
          # Pipeline template registry + parameterized triggers (CLI-only; implies serve)
          - templates
          # Template hosting + sync from remote origins (CLI-only; implies templates)
          - templates-sync
          - templates-sync-object-store
          # Multi-tenant embedded integrations (CLI-only; implies serve, templates, encryption, notify)
          - tenants
          # Remote Template Hub catalogs (CLI-only, #677)
          - hub-remote
          # Notification / incident routing (CLI-only)
          - notify
          # Local dev loop — `faucet dev` filesystem watch (CLI-only)
          - cli-dev
          # Live terminal UI — `faucet run --tui` (CLI-only)
          - cli-tui
          # Inline live progress line — `faucet run` (CLI-only, #385)
          - cli-progress
          # Secrets backends
          - secrets-vault
          - secrets-aws-sm
          - secrets-gcp-sm
          - secrets-azure-kv
          # CLI build matrix — verify the binary builds with every default-on
          # feature plus a slim "only the bare minimum" combo.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.feature }}
      - name: Install librdkafka prerequisites (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - name: Install librdkafka prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl@3 curl
      - name: Check feature in isolation
        run: |
          # Secrets, schedule, serve, catalog, templates, and triggers features
          # live in faucet-cli (CLI layer), not in the faucet-stream umbrella
          # crate. Route accordingly.
          if [[ "${{ matrix.feature }}" == secrets-* || "${{ matrix.feature }}" == "schedule" || "${{ matrix.feature }}" == serve* || "${{ matrix.feature }}" == "mcp" || "${{ matrix.feature }}" == "catalog" || "${{ matrix.feature }}" == triggers* || "${{ matrix.feature }}" == templates* || "${{ matrix.feature }}" == "tenants" || "${{ matrix.feature }}" == "hub-remote" || "${{ matrix.feature }}" == "notify" || "${{ matrix.feature }}" == "cli-dev" || "${{ matrix.feature }}" == "cli-tui" || "${{ matrix.feature }}" == "cli-progress" ]]; then
            cargo check -p faucet-cli --no-default-features --features ${{ matrix.feature }}
          else
            cargo check -p faucet-stream --no-default-features --features ${{ matrix.feature }}
          fi

  cli-build:
    name: CLI build
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        # Defaults pull in every connector; the slim profile covers the
        # smallest interesting combination so accidental cross-feature deps
        # surface immediately. The observability+slim combo specifically
        # guards the observability feature against unexpected cross-feature
        # gating regressions (the "full" entry covers observability+everything
        # because the full aggregate now includes observability).
        features:
          - "full"
          - "source-rest,sink-file,sink-stdout,transforms"
          - "observability,source-rest,sink-file,sink-stdout,transforms"
          - "otel,source-rest,sink-file,sink-stdout,transforms"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
      - name: Install librdkafka prerequisites
        if: contains(matrix.features, 'full') || contains(matrix.features, 'kafka')
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.features }}
      - if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        run: cargo build -p faucet-cli --no-default-features --features "${{ matrix.features }}"
      # The Connector Hub feed (#572) must cover every registry connector.
      - name: Connector Hub export
        if: ${{ matrix.features == 'full' && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
        run: |
          ./target/debug/faucet conformance --export --require-all > connectors.json
          jq -e '.format == "faucet-connector-export" and (.connectors | length) > 0 and all(.connectors[]; .compiled and .config_schema != null)' connectors.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.features == 'full' && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
        with:
          name: connectors-export
          path: connectors.json

  # Windows (#565): the prebuilt x86_64-pc-windows-msvc binary's feature set
  # (CLI default + the dist-workspace.toml `features`) must build and pass the
  # engine + CLI unit suites and the real-binary end-to-end suite. The Docker-
  # backed integration suites stay Linux-only (Windows runners have no Linux
  # containers). Not a required check.
  windows:
    name: Windows (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    needs: changes
    # On hold with #565: Windows is not a supported platform yet.
    if: false
    env:
      SHIPPED_FEATURES: "serve,serve-ui,schedule,lineage,templates,mcp,notify,secrets,catalog,serve-history-sqlite,serve-history-postgres"
      # openssl-src must run Strawberry Perl; the Git Bash (MSYS) perl lacks
      # Locale::Maketext::Simple and misdetects the target.
      OPENSSL_SRC_PERL: C:/Strawberry/perl/bin/perl.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings and allow long paths
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
      # aws-lc-sys and the vendored OpenSSL (librdkafka) assemble with NASM;
      # Strawberry Perl, CMake and MSVC are already on the image.
      - name: Install NASM
        run: |
          choco install nasm --yes --no-progress
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the shipped CLI
        run: cargo build -p faucet-cli --features "$SHIPPED_FEATURES"
      - name: Smoke-test the binary
        run: |
          ./target/debug/faucet.exe --version
          ./target/debug/faucet.exe list > /dev/null
      - name: Engine unit tests
        run: cargo test -p faucet-core --lib
      - name: CLI unit + end-to-end tests
        run: cargo test -p faucet-cli --features "$SHIPPED_FEATURES" --lib --test cli_end_to_end

  observability-bench:
    name: Observability bench (5% regression budget)
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run observability benchmark
        run: cargo bench -p faucet-core --bench observability -- --warm-up-time 1 --measurement-time 3 --save-baseline ci
      - name: Check regression threshold
        run: python3 .github/scripts/check_obs_regression.py

  kafka-integration:
    name: Kafka integration tests (Docker)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    env:
      FAUCET_REQUIRE_BACKENDS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # These steps boot Docker containers (Kafka, Elasticsearch) via
      # testcontainers, whose in-process (bollard) image pull intermittently
      # fails. Only an image-pull failure is retried; anything else fails once.
      - name: Run kafka source integration tests
        run: scripts/retry-on-image-pull.sh cargo test -p faucet-source-kafka --test integration -- --test-threads=1
      - name: Run kafka sink integration tests
        run: scripts/retry-on-image-pull.sh cargo test -p faucet-sink-kafka --test integration -- --test-threads=1
      - name: Run kafka schema-registry-enabled tests
        run: scripts/retry-on-image-pull.sh cargo test -p faucet-common-kafka --all-features
      - name: Run faucet-common-elasticsearch tests
        run: scripts/retry-on-image-pull.sh cargo test -p faucet-common-elasticsearch

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hard gate: licenses, banned crates, and dependency sources are
      # deterministic and in our control.
      - name: Licenses / bans / sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
      # Hard gate (#789 SUPPLY-03): RustSec advisories and yanked crates. A
      # known advisory that cannot be fixed yet is triaged in deny.toml with a
      # dated reason; anything else fails the build. advisories.yml re-runs this
      # daily and opens an issue for advisories published between merges.
      - name: Advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # Hard gate: the public API must not break without a deliberate major-version
  # bump. `faucet-core` is the one crate every third-party connector depends on
  # (the Faucet Connector Protocol, §8) — a breaking change to its object-safe
  # trait surface would silently break every external `faucet-source-*` /
  # `faucet-sink-*`. cargo-semver-checks compares this revision's public API
  # against the version last published to crates.io and fails on any breaking
  # change. Two sanctioned ways past it: bump the crate's major version (moves
  # the baseline), or — for additive evolution of config/data types — the
  # declared contract in `[package.metadata.cargo-semver-checks.lints]`
  # (struct-literal construction / exhaustive matching are not part of the
  # stability surface; construct via serde, `new()`/`Default`, or builders).
  # Additive changes (new defaulted trait methods, new items) are a minor bump
  # and pass. See CONTRIBUTING.md.
  semver-checks:
    name: API stability (cargo-semver-checks)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
      # This job builds rustdoc for every publishable crate, which reaches
      # rdkafka's `sasl2-sys` and its bundled C build. Every other build job
      # already installs these; this one did not, and a warm `rust-cache`
      # hid it — until a lockfile change rotated the cache key and the
      # build script ran for real.
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Excluded: faucet-cli / faucet-stream / the Delta trio (see
      # scripts/semver-exclude.py for why) plus any crate not yet on crates.io
      # — computed, so a crate is guarded from its first release on without
      # anyone pruning a hand-kept list (#789 SUPPLY-18).
      - name: Crates without a published baseline
        id: semver-exclude
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        run: echo "list=$(python3 scripts/semver-exclude.py)" >> "$GITHUB_OUTPUT"
      - name: Check every published crate's public API for breaking changes
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          exclude: ${{ steps.semver-exclude.outputs.list }}
          # No `package:` — check the whole workspace. Gating only `faucet-core`
          # left 89 crates unguarded, so a genuine removal or signature change in
          # a connector could publish in a minor and break dependents silently
          # (#654 H10). Every published crate now also declares the additive-is-
          # minor lint contract in its own `[package.metadata.cargo-semver-checks.lints]`,
          # so this gate fails only on real breaks.
          # Use the 1.96.0 toolchain installed above, not the action's default.
          rust-toolchain: manual

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: changes
    env:
      # Same backends as `test`: a skipped integration suite must fail (#789 SUPPLY-09).
      FAUCET_REQUIRE_BACKENDS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the patch-coverage gate below can resolve a merge
          # base against origin/main.
          fetch-depth: 0
      - name: Free runner disk space
        # The all-features instrumented build (bundled DuckDB + the full
        # connector tree) plus the coverage profraw data and testcontainer
        # images exceed the hosted runner's free disk. Drop every large
        # preinstalled toolchain we never use (~40 GB) and clear the apt cache.
        # None of these are used by the Rust / DuckDB / testcontainers build.
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /opt/microsoft \
            /usr/lib/jvm \
            /usr/local/julia* \
            /usr/share/miniconda \
            /usr/local/share/vcpkg \
            /usr/share/az_* \
            /usr/lib/google-cloud-sdk \
            /usr/local/share/boost \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/node \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo apt-get clean
          docker image prune -af >/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
          components: llvm-tools-preview
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential sqlite3
      # The Oracle connectors (ODPI-C) load Instant Client at runtime; without it
      # their integration tests skip and the integration-coverage gate fails.
      - name: Cache Oracle Instant Client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/oracle/instantclient-basiclite-linuxx64.zip
          key: oracle-instantclient-basiclite-linuxx64-23.26.2.0.0
      - name: Install Oracle Instant Client
        run: |
          set -euo pipefail
          zip="$HOME/.cache/oracle/instantclient-basiclite-linuxx64.zip"
          # A pinned release, verified (#789 SUPPLY-12); bump the URL, the
          # digest and the cache key together.
          if [ ! -s "$zip" ]; then
            mkdir -p "$(dirname "$zip")"
            curl -fsSL --retry 3 -o "$zip" \
              https://download.oracle.com/otn_software/linux/instantclient/2326200/instantclient-basiclite-linux.x64-23.26.2.0.0.zip
          fi
          echo "c5e97765e633ad02597b8274c35efe5c10bd249a3285e34ee58fa7b318243225  $zip" | sha256sum -c -
          sudo apt-get install -y libaio1t64 || sudo apt-get install -y libaio1
          if [ ! -e /usr/lib/x86_64-linux-gnu/libaio.so.1 ] && [ -e /usr/lib/x86_64-linux-gnu/libaio.so.1t64 ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          fi
          sudo mkdir -p /opt/oracle
          sudo unzip -qo "$zip" -d /opt/oracle
          dir="$(ls -d /opt/oracle/instantclient_* | sort -V | tail -1)"
          echo "LD_LIBRARY_PATH=$dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "Oracle Instant Client installed at $dir"
      - uses: taiki-e/install-action@24b35e792c4eb272ee06051198c72db034fd0be3 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clear Docker before the container-backed tests
        # Testcontainer images and volumes left by earlier steps count against
        # the runner disk the tests (MinIO's free-space check among them) need.
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        run: |
          docker ps -aq | xargs -r docker rm -f >/dev/null
          docker system prune -af --volumes >/dev/null
          df -h /
      # Cover unit + integration tests, and keep the integration-only share
      # separately (#695). One build, two phases:
      #   1. integration — compiles every library once, plus each crate's
      #      `tests/` binaries, runs them, writes integration.lcov;
      #   2. teardown — deletes what only phase 1 needed (the integration test
      #      binaries, their profiles, every testcontainer image/volume), which
      #      is what ran the runner out of disk when phase 2 started compiling;
      #   3. unit — reuses the compiled libraries and builds only each crate's
      #      `cfg(test)` harness, runs it, writes unit.lcov.
      # lcov.info is the two reports concatenated: codecov and
      # scripts/patch-coverage.py both treat a line as covered when any record
      # of it is, so no merged profile (and no kept integration binary) is
      # needed. The integration tests boot Docker testcontainers whose image
      # pulls intermittently flake, so each phase is retried like `test` is.
      - name: Collect coverage (integration, then unit)
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        env:
          # Coverage mapping does not need DWARF; dropping debuginfo keeps the
          # instrumented all-features build within the runner's disk.
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          IGNORE_RE: '(/tests?/|/examples?/|/benches?/|build\.rs$|crates/sink/clickhouse/src/staged_exec\.rs$|crates/sink/mssql/src/staged_exec\.rs$)'
        run: |
          retry() { scripts/retry-on-image-pull.sh "$@"; }
          cargo llvm-cov clean --workspace
          rm -f target/*.profraw
          eval "$(cargo llvm-cov show-env --sh)"
          retry cargo test --workspace --all-features --test '*'
          # The staged-load execution shims need a live warehouse that can reach
          # a live bucket, so they are excluded here, in codecov.yml, and in
          # scripts/patch-coverage.py (all three kept in sync).
          cargo llvm-cov report --lcov --output-path integration.lcov --ignore-filename-regex "$IGNORE_RE"

          echo "::group::teardown before the unit phase"
          df -h /
          cargo test --workspace --all-features --test '*' --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true) | .executable // empty' \
            | while read -r exe; do rm -f "$exe" "${exe}.d"; done
          rm -f target/*.profraw
          docker ps -aq | xargs -r docker rm -f >/dev/null
          docker system prune -af --volumes >/dev/null
          df -h /
          echo "::endgroup::"

          retry cargo test --workspace --all-features --lib --bins
          cargo llvm-cov report --lcov --output-path unit.lcov --ignore-filename-regex "$IGNORE_RE"
          cat integration.lcov unit.lcov > lcov.info
      - name: Test the coverage gate scripts
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Enforce >=95% patch coverage
        # The project standard is >=95% coverage of changed lines. `codecov/patch`
        # reports the same number but posts unreliably — of the eight PRs merged
        # before this gate landed, only one carried a codecov status on its head
        # commit (including a large code PR that carried none), so it cannot be a
        # required check without blocking PRs on "Expected — waiting for status".
        # This runs inside the already-required Coverage job instead, where the
        # result is deterministic.
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
        run: |
          # `--depth=0` is not a valid depth; this printed a red "fatal:"
          # on every coverage run and made real failures look like tooling
          # breakage. `checkout@v4` above already uses fetch-depth: 0, so the
          # merge base is present — deepen only if the clone were shallow.
          git rev-parse --is-shallow-repository | grep -qx false \
            || git fetch --no-tags --unshallow origin "${{ github.base_ref }}" || true
          python3 scripts/patch-coverage.py \
            --lcov lcov.info \
            --base "origin/${{ github.base_ref }}" \
            --min 95
      - name: Require integration tests for changed I/O code
        # Changed connector / state-store / serve / executor lines must run in
        # an integration test, not only a unit test (#695). A PR description
        # line `no-integration-test: <reason>` downgrades a failure to a
        # warning; the job summary shows the per-file table either way.
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/integration-coverage.py \
            --lcov integration.lcov \
            --unit-lcov unit.lcov \
            --base "origin/${{ github.base_ref }}" \
            --min 60
      - name: Upload to Codecov
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        # `continue-on-error` keeps a Codecov outage from failing the build — the
        # merge gate is the patch-coverage step above, which needs no third party.
        # But `fail_ci_if_error: true` makes the step itself go red and log the
        # reason, so a broken upload is visible instead of silently doing nothing.
        # That combination was the actual defect: with both set to "ignore", the
        # one upload that failed (PR #482) looked identical to a healthy run.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
      - name: Upload unit coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: unit.lcov
          flags: unit
          fail_ci_if_error: true
      - name: Upload integration coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: integration.lcov
          flags: integration
          fail_ci_if_error: true
