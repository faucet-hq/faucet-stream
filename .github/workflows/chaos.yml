name: Chaos (faucet serve)

# Runs scripts/chaos/run.sh (#908) against an image built from this commit:
# a 3-node kind cluster, clustered and single-pod deployments from the Helm
# chart, and pod kills, a node stop, a full outage, a history-database outage,
# rolling restarts, a burst and a poison run. Not a required check (it takes
# about 30 minutes); the report lands in the run summary and as an artifact.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated scenarios to run (empty = all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Only the connectors the scenarios use, so the build stays short.
      - name: Build the image under test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            SOURCES=postgres
            SINKS=postgres
            ORACLE_CLIENT=false
          tags: faucet-chaos:ci
          cache-from: type=gha,scope=faucet-chaos
          cache-to: type=gha,mode=max,scope=faucet-chaos
          provenance: false

      - name: Run the chaos scenarios
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          args=(--image faucet-chaos:ci --out chaos-report)
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
          scripts/chaos/run.sh "${args[@]}"

      - name: Report
        if: always()
        run: |
          if [ -f chaos-report/chaos-report.md ]; then
            cat chaos-report/chaos-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The chaos run produced no report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chaos-report
          path: chaos-report/
          if-no-files-found: ignore
