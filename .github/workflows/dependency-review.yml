# Dependency review (#978): reports new dependencies with known high-severity
# vulnerabilities or a license outside deny.toml's allow list. Not a required
# check; cargo-deny remains the enforced gate.
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Keep in sync with [licenses] allow in deny.toml.
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, Apache-2.0 WITH LLVM-exception,
            BSD-2-Clause, BSD-3-Clause, ISC, Unicode-3.0, Unicode-DFS-2016,
            Zlib, MPL-2.0, CC0-1.0, BSL-1.0, CDLA-Permissive-2.0
          # brotli-decompressor declares "BSD-3-Clause/MIT", which the review
          # misreads (cargo-deny reads it as allowed); libfuzzer-sys adds NCSA
          # for the bundled libFuzzer and is only in the unpublished fuzz crate.
          # The npm packages are build-time tools of the docs site (docs/site,
          # never shipped) under permissive licences outside the Rust list:
          # tslib is 0BSD; lru-cache, sax and common-ancestor-path are BlueOak-1.0.0.
          allow-dependencies-licenses: >-
            pkg:cargo/brotli-decompressor, pkg:cargo/libfuzzer-sys,
            pkg:npm/tslib, pkg:npm/lru-cache, pkg:npm/sax,
            pkg:npm/common-ancestor-path
          comment-summary-in-pr: on-failure
