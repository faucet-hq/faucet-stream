name: Docs site (Starlight)

# Builds the Astro Starlight docs site in docs/site from the mdBook sources
# (#1073). Build only for now; docs.yml keeps deploying the mdBook until the
# switch-over PR moves the deploy here.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/book/src/**"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/book/src/**"
      - ".github/workflows/docs-site.yml"

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/site/.node-version
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Convert the mdBook sources and build
        run: npm run build
      - name: Check every old mdBook URL has a page or a redirect
        run: node scripts/check-redirects.mjs
      - name: Check internal links and anchors
        run: node scripts/check-links.mjs
