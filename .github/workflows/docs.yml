name: Docs site

# Builds the Astro Starlight docs site in docs/site. On pull requests it only
# verifies the build, the old-URL redirects and every internal link; on push to
# main it also deploys to GitHub Pages.
#
# NOTE: deployment requires Pages to be enabled for the repo with the source set
# to "GitHub Actions" (Settings → Pages → Build and deployment → GitHub Actions).

on:
  # Manual trigger so the site can be re-deployed on demand without a docs change.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: each page's "Last updated" date comes from git.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/site/.node-version
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Check old URLs, internal links and anchors
        run: npm run check
      # Inlined actions/upload-pages-artifact: it calls actions/upload-artifact by tag, which the repository's SHA-pinning rule refuses.
      - name: Archive Pages artifact
        if: github.ref == 'refs/heads/main'
        run: |
          tar --dereference --hard-dereference --directory dist \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
