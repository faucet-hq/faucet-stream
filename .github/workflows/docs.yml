name: Docs site

# Builds the mdBook in docs/book. On pull requests it only verifies the book
# builds; on push to main it also deploys to GitHub Pages.
#
# NOTE: deployment requires Pages to be enabled for the repo with the source set
# to "GitHub Actions" (Settings → Pages → Build and deployment → GitHub Actions).

on:
  # Manual trigger so the site can be re-deployed on demand — e.g. when a docs
  # change lands via a PR that did NOT touch docs/book/** (the path filter below
  # only fires the deploy on docs/book changes, so a teal-theme rebuild can be
  # forced from the Actions tab without a dummy commit).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/book/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.3"
  MDBOOK_MERMAID_VERSION: "0.17.0"

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install mdbook-mermaid
        run: |
          url="https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz -C "$HOME/.local/bin"
      - name: Build
        run: mdbook build docs/book
      - name: Inject per-page SEO metadata
        # mdBook's head.hbs is site-wide; rewrite per-page description + Open
        # Graph / Twitter title & description from each page's <h1>/first <p>.
        run: python3 scripts/inject-page-meta.py docs/book/book
      - name: Generate sitemap.xml
        # mdBook has no native sitemap (rust-lang/mdBook#1491); generate one from
        # the built HTML so search engines can crawl every page. Uses the full
        # Pages origin (site-url in book.toml is only a path prefix).
        env:
          BASE_URL: "https://faucet-hq.github.io/faucet-stream"
        run: |
          cd docs/book/book
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find . -type f -name '*.html' ! -name '404.html' ! -name 'print.html' \
              | sed 's|^\./||' \
              | LC_ALL=C sort \
              | while IFS= read -r f; do
                  loc="${f%index.html}"
                  echo "  <url><loc>${BASE_URL}/${loc}</loc></url>"
                done
            echo '</urlset>'
          } > sitemap.xml
          echo "Wrote $(grep -c '<url>' sitemap.xml) URLs to sitemap.xml"
      # Inlined actions/upload-pages-artifact: it calls actions/upload-artifact by tag, which the repository's SHA-pinning rule refuses.
      - name: Archive Pages artifact
        if: github.ref == 'refs/heads/main'
        run: |
          tar --dereference --hard-dereference --directory docs/book/book \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
