name: Docker images

# Publishes named per-profile faucet-stream images to GHCR. Each profile is a
# fixed connector set compiled into the image (connectors are compile-time
# features — see deploy/README.md). Point the Helm chart's `image.tag` at the
# profile your deployment needs.
#
# Triggers:
#   - manual (workflow_dispatch), optional push
#   - on a published `faucet-cli-v*` GitHub release (pushes :<profile> and
#     :<version>-<profile>). release-plz publishes a GitHub release per crate
#     tag, so both jobs gate on the faucet-cli tag to build ONCE per app
#     release rather than once per crate.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR (otherwise build-only)"
        type: boolean
        default: false
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
      # Keyless signing + build provenance (#789 SUPPLY-05).
      id-token: write
      attestations: write
    # release-plz publishes one GitHub release per crate tag, but the images
    # should build ONCE per app release. Gate to the faucet-cli release (or a
    # manual dispatch) so a `faucet-source-*` / `faucet-sink-*` crate tag does
    # not trigger a full image build. Mirrors the `helm` job's guard below.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'faucet-cli-v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Complete image — every first-party connector + serve. Heavy.
          - profile: full
            sources: ""
            sinks: ""
          # Lean, common analytics/ELT set.
          - profile: core
            sources: "rest,postgres,s3,csv"
            sinks: "postgres,s3,jsonl,stdout"
          - profile: analytics
            sources: "rest,postgres,s3,bigquery,snowflake"
            sinks: "bigquery,snowflake,s3,jsonl"
          - profile: cdc
            sources: "postgres-cdc,mysql-cdc,mongodb-cdc"
            sinks: "postgres,kafka,s3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lowercase image name
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          base="${{ steps.img.outputs.name }}"
          tags="${base}:${{ matrix.profile }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${GITHUB_REF_NAME#faucet-cli-v}"; v="${v#v}"
            tags="${tags},${base}:${v}-${{ matrix.profile }}"
            if [ "${{ matrix.profile }}" = "full" ]; then
              tags="${tags},${base}:latest,${base}:${v}"
            fi
          fi
          echo "tags=${tags}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name == 'release' || inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.profile }})
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'release' || inputs.push }}
          build-args: |
            SOURCES=${{ matrix.sources }}
            SINKS=${{ matrix.sinks }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=faucet-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=faucet-${{ matrix.profile }}
          # SLSA provenance and an SBOM travel with the image (#789 SUPPLY-05).
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: github.event_name == 'release' || inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: github.event_name == 'release' || inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ steps.img.outputs.name }}@${DIGEST}"

      - name: Attest build provenance
        if: github.event_name == 'release' || inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Publish the Helm chart as an OCI artifact on GHCR and attach a
  # Dockerfile+chart deploy bundle to the release. Gated to the faucet-cli
  # release so the chart gets ONE version per app release (not one per crate
  # tag). Manual runs use the chart's appVersion and only push when push=true.
  helm:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'faucet-cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload the release asset
      packages: write   # push the OCI chart
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.2

      - name: Derive version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${GITHUB_REF_NAME#faucet-cli-v}"; v="${v#v}"
          else
            v="$(sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' deploy/helm/faucet-stream/Chart.yaml)"
          fi
          echo "v=$v" >>"$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package deploy/helm/faucet-stream \
            --version "${{ steps.v.outputs.v }}" \
            --app-version "${{ steps.v.outputs.v }}"

      - name: Push chart to GHCR (OCI)
        if: github.event_name == 'release' || inputs.push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          helm push "faucet-stream-${{ steps.v.outputs.v }}.tgz" \
            "oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts"

      - name: Build deploy bundle (Dockerfile + chart + README)
        run: |
          root="faucet-stream-deploy-${{ steps.v.outputs.v }}"
          mkdir -p "bundle/${root}"
          cp Dockerfile "bundle/${root}/"
          cp -r deploy/helm/faucet-stream "bundle/${root}/helm-chart"
          cat > "bundle/${root}/README.md" <<MD
          # faucet-stream deployment bundle (v${{ steps.v.outputs.v }})

          Self-contained Dockerfile + Helm chart.

          ## Container image (prebuilt, GHCR)
              docker pull ${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/faucet-stream:${{ steps.v.outputs.v }}

          ## Helm chart (OCI, GHCR)
              helm install faucet oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts/faucet-stream --version ${{ steps.v.outputs.v }}

          ## Or from this bundle
              helm install faucet ./helm-chart
              # (build the image yourself from ./Dockerfile if you don't use GHCR)
          MD
          tar czf "${root}.tar.gz" -C bundle "${root}"

      - name: Attach bundle to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "faucet-stream-deploy-${{ steps.v.outputs.v }}.tar.gz" --clobber
