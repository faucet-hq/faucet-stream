name: Docker images

# Publishes named per-profile faucet-stream images to GHCR. Each profile is a
# fixed connector set compiled into the image (connectors are compile-time
# features — see deploy/README.md). Point the Helm chart's `image.tag` at the
# profile your deployment needs.
#
# Triggers:
#   - manual (workflow_dispatch), optional push: `:<profile>-<sha>` only
#   - on a published `faucet-cli-v*` GitHub release (pushes :<profile> and
#     :<version>-<profile>). release-plz publishes a GitHub release per crate
#     tag, so both jobs gate on the faucet-cli tag to build ONCE per app
#     release rather than once per crate.
#   - manual with `release: X.Y.Z`: publishes THIS commit's build under that
#     release's tags (`:<X.Y.Z>-<profile>`, and `:latest` / `:<X.Y.Z>` for
#     full), so a release can be re-imaged after an image-only fix (#845). It
#     refuses unless this commit's faucet-cli version is X.Y.Z and it differs
#     from the `faucet-cli-vX.Y.Z` tag only in image-build files (Dockerfile,
#     .github, scripts, deploy, docs), so a tag never names another binary.
#
# Every image is built natively for linux/amd64 and linux/arm64 and
# smoke-tested on its own architecture first (it starts; `full` carries its
# features and loads the Oracle client); only images that pass are pushed. The
# merge job then publishes one multi-arch tag set per profile and signs and
# attests it (#904). Sizes land in the run summary.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR (otherwise build-only)"
        type: boolean
        default: false
      release:
        description: "Publish this commit under release X.Y.Z's tags (it may differ from faucet-cli-vX.Y.Z only in image-build files); empty = no version tags"
        type: string
        default: ""
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
      # Keyless signing + build provenance (#789 SUPPLY-05).
      id-token: write
      attestations: write
    # release-plz publishes one GitHub release per crate tag, but the images
    # should build ONCE per app release. Gate to the faucet-cli release (or a
    # manual dispatch) so a `faucet-source-*` / `faucet-sink-*` crate tag does
    # not trigger a full image build. Mirrors the `helm` job's guard below.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'faucet-cli-v')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # A full build takes about an hour; anything far past that is a hang.
    timeout-minutes: 180
    env:
      PUSH: ${{ github.event_name == 'release' || inputs.push }}
      RELEASE: ${{ inputs.release }}
      # Optional read-only Docker Hub login for pulls past the mirror.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        # Every profile is built natively on both architectures (#904): amd64
        # on ubuntu-latest, arm64 on GitHub's arm64 runner, with no emulation.
        arch: [amd64, arm64]
        profile: [full, core, analytics, cdc]
        include:
          # The CLI's `full` feature: every connector and every feature, plus
          # the Oracle Instant Client its Oracle connectors load. Heavy.
          - profile: full
            sources: ""
            sinks: ""
            oracle: "auto"
            # Fat LTO runs out of memory linking every feature (#911).
            cargo_profile: release
          # Lean, common analytics/ELT set.
          - profile: core
            sources: "rest,postgres,s3,csv"
            sinks: "postgres,s3,jsonl,stdout"
            oracle: "false"
            cargo_profile: release-lto
          - profile: analytics
            sources: "rest,postgres,s3,bigquery,snowflake"
            sinks: "bigquery,snowflake,s3,jsonl"
            oracle: "false"
            cargo_profile: release-lto
          - profile: cdc
            sources: "postgres-cdc,mysql-cdc,mongodb-cdc"
            sinks: "postgres,kafka,s3"
            oracle: "false"
            cargo_profile: release-lto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the release matches this commit's faucet-cli version
        if: env.RELEASE != ''
        run: |
          case "$RELEASE" in
            ""|*[!0-9.]*) echo "::error::release must look like X.Y.Z, got '$RELEASE'"; exit 1 ;;
          esac
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -1)"
          if [ "$v" != "$RELEASE" ]; then
            echo "::error::this commit's faucet-cli is $v, not $RELEASE; run the workflow on a commit of that version"
            exit 1
          fi
          tag="faucet-cli-v$RELEASE"
          if ! git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            echo "::error::release tag $tag does not exist"
            exit 1
          fi
          changed="$(git diff --name-only "$tag" HEAD -- . \
            ':!Dockerfile' ':!.dockerignore' ':!.github' ':!scripts' ':!deploy' ':!docs')"
          if [ -n "$changed" ]; then
            echo "::error::this commit changes more than image-build files since $tag, so its binary is not release $RELEASE:"
            echo "$changed"
            exit 1
          fi

      - name: Lowercase image name
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      # Base-image pulls go through the Docker Hub mirror the test jobs use
      # (scripts/docker-hub-mirror.sh), so builds avoid the anonymous rate limit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (${{ matrix.profile }}, ${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: |
            SOURCES=${{ matrix.sources }}
            SINKS=${{ matrix.sinks }}
            ORACLE_CLIENT=${{ matrix.oracle }}
            CARGO_PROFILE=${{ matrix.cargo_profile }}
          tags: faucet-smoke:${{ matrix.profile }}
          cache-from: type=gha,scope=faucet-${{ matrix.profile }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=faucet-${{ matrix.profile }}-${{ matrix.arch }}
          provenance: false

      - name: Smoke-test the image
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          img="faucet-smoke:${PROFILE}"
          # Every command is bounded: a hung container fails the step instead
          # of holding the runner for hours.
          drun() { timeout --kill-after=10 180 docker run --rm "$@"; }
          drun "$img" --version
          drun "$img" list > list.txt
          if [ "$PROFILE" = full ]; then
            # A sample of what #845 found missing from the old :full image.
            drun "$img" schema transform sql > /dev/null
            drun "$img" schema transform wasm > /dev/null
            drun "$img" schema templates-sync > /dev/null
            grep -qw oracle list.txt
            mkdir -p smoke
            printf '%s\n' \
              'version: 1' \
              'name: oracle-client-smoke' \
              'pipeline:' \
              '  source:' \
              '    type: oracle' \
              '    config: { host: 127.0.0.1, port: 1, service_name: X, username: u, password: p, query: "SELECT 1 FROM DUAL" }' \
              '  sink: { type: stdout, config: {} }' > smoke/oracle.yaml
            out="$(drun -v "$PWD/smoke:/smoke:ro" "$img" run --no-env-file /smoke/oracle.yaml 2>&1 || true)"
            echo "$out" | tail -5
            if echo "$out" | grep -qE 'DPI-1047|DPI-1072'; then
              echo "::error::the Oracle client did not load in full"; exit 1
            fi
            echo "$out" | grep -qE 'ORA-|DPI-' \
              || { echo "::error::no Oracle error came back, so the client was never exercised"; exit 1; }
          fi
          test "$(docker image inspect -f '{{.Architecture}}' "$img")" = "${{ matrix.arch }}"
          raw=$(docker image inspect -f '{{.Size}}' "$img")
          echo "| ${PROFILE} | ${{ matrix.arch }} | $((raw / 1048576)) MiB |" | tee -a "$GITHUB_STEP_SUMMARY"

      # Same inputs and a warm cache, so this reuses the tested build's layers.
      # Pushed by digest only; the merge job puts every architecture behind
      # the profile's tags.
      - name: Push by digest (${{ matrix.profile }}, ${{ matrix.arch }})
        id: build
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            SOURCES=${{ matrix.sources }}
            SINKS=${{ matrix.sinks }}
            ORACLE_CLIENT=${{ matrix.oracle }}
            CARGO_PROFILE=${{ matrix.cargo_profile }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=faucet-${{ matrix.profile }}-${{ matrix.arch }}
          # SLSA provenance and an SBOM travel with the image (#789 SUPPLY-05).
          provenance: mode=max
          sbom: true

      - name: Hand the digest to the merge job
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUSH == 'true'
        with:
          name: digests-${{ matrix.profile }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-arch tag set per profile over the per-architecture digests, then
  # sign and attest that index (#904).
  merge:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.push) || startsWith(github.ref_name, 'faucet-cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE: ${{ inputs.release }}
    strategy:
      fail-fast: false
      matrix:
        profile: [full, core, analytics, cdc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.profile }}-*
          path: digests
          merge-multiple: true

      - name: Lowercase image name
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          base="${{ steps.img.outputs.name }}"
          profile="${{ matrix.profile }}"
          v=""
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${GITHUB_REF_NAME#faucet-cli-v}"; v="${v#v}"
          elif [ -n "$RELEASE" ]; then
            v="$RELEASE"
          fi
          # Floating tags (:<profile>, :latest) only ever move to the newest
          # faucet-cli release; anything else gets an immutable tag.
          newest="$(git tag --list 'faucet-cli-v[0-9]*' | sed 's/^faucet-cli-v//' | sort -V | tail -1)"
          tags=""
          if [ -n "$v" ]; then
            tags="${base}:${v}-${profile}"
            if [ "$profile" = "full" ]; then
              tags="${tags},${base}:${v}"
            fi
            if [ "$v" = "$newest" ]; then
              tags="${tags},${base}:${profile}"
              if [ "$profile" = "full" ]; then
                tags="${tags},${base}:latest"
              fi
            else
              echo "::notice::$v is not the newest faucet-cli release ($newest); floating tags stay put"
            fi
          else
            tags="${base}:${profile}-${GITHUB_SHA::12}"
          fi
          echo "tags=${tags}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch tags
        id: index
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          sources=()
          for f in digests/*; do sources+=("${IMAGE}@sha256:${f#digests/}"); done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::expected an amd64 and an arm64 digest, found ${#sources[@]}"; exit 1
          fi
          args=()
          IFS=, read -ra tags <<<"$TAGS"
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          first="${TAGS%%,*}"
          docker buildx imagetools inspect "$first"
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          index=$(docker buildx imagetools inspect --raw "$first")
          {
            echo "| Profile | Architecture | Compressed (pull) |"
            echo "|---|---|---|"
            for arch in amd64 arm64; do
              d=$(echo "$index" | jq -r --arg a "$arch" '[.manifests[] | select(.platform.architecture == $a)][0].digest')
              bytes=$(docker buildx imagetools inspect --raw "${IMAGE}@${d}" | jq '[.layers[]?.size] | add // 0')
              echo "| ${{ matrix.profile }} | ${arch} | $((bytes / 1048576)) MiB |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes --recursive "${{ steps.img.outputs.name }}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # Publish the Helm chart as an OCI artifact on GHCR and attach a
  # Dockerfile+chart deploy bundle to the release. Gated to the faucet-cli
  # release so the chart gets ONE version per app release (not one per crate
  # tag). Manual runs use the chart's appVersion and only push when push=true.
  helm:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'faucet-cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload the release asset
      packages: write   # push the OCI chart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.2

      - name: Derive version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${GITHUB_REF_NAME#faucet-cli-v}"; v="${v#v}"
          else
            v="$(sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' deploy/helm/faucet-stream/Chart.yaml)"
          fi
          echo "v=$v" >>"$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package deploy/helm/faucet-stream \
            --version "${{ steps.v.outputs.v }}" \
            --app-version "${{ steps.v.outputs.v }}"

      - name: Push chart to GHCR (OCI)
        if: github.event_name == 'release' || inputs.push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          helm push "faucet-stream-${{ steps.v.outputs.v }}.tgz" \
            "oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts"

      - name: Build deploy bundle (Dockerfile + chart + README)
        run: |
          root="faucet-stream-deploy-${{ steps.v.outputs.v }}"
          mkdir -p "bundle/${root}"
          cp Dockerfile "bundle/${root}/"
          cp -r deploy/helm/faucet-stream "bundle/${root}/helm-chart"
          cat > "bundle/${root}/README.md" <<MD
          # faucet-stream deployment bundle (v${{ steps.v.outputs.v }})

          Self-contained Dockerfile + Helm chart.

          ## Container image (prebuilt, GHCR)
              docker pull ${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/faucet-stream:${{ steps.v.outputs.v }}

          ## Helm chart (OCI, GHCR)
              helm install faucet oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts/faucet-stream --version ${{ steps.v.outputs.v }}

          ## Or from this bundle
              helm install faucet ./helm-chart
              # (build the image yourself from ./Dockerfile if you don't use GHCR)
          MD
          tar czf "${root}.tar.gz" -C bundle "${root}"

      - name: Attach bundle to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "faucet-stream-deploy-${{ steps.v.outputs.v }}.tar.gz" --clobber
