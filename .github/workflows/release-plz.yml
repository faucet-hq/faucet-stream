name: release-plz

# Automates per-crate version bumps, changelog entries, and crates.io
# publishing for the 45-crate workspace.
#
# - `release-plz-pr` (every push to main): opens or updates a "chore: release"
#   PR that bumps versions and prepends changelog entries for every crate with
#   feat/fix/perf commits since its last per-crate tag. Review the PR like any
#   other change; merging it triggers the publish job.
# - `release-plz-release` (only when the pushed commit is a release commit,
#   `chore: release …` / `chore(<crate>): release …` / `chore(release): …`):
#   waits for approval in the protected `release` environment, then publishes the bumped crates to crates.io
#   in dependency order, creates per-crate GitHub releases, and pushes
#   per-crate `<crate>-v<X.Y.Z>` tags.
#
# Config lives in /release-plz.toml. The legacy manual `release.yml`
# (`workflow_dispatch` waves-of-5) is retained as a fallback only — see
# CONTRIBUTING.md for when to use it.

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Harden against transient crates.io connectivity drops on GitHub-hosted
  # runners — "Error in the HTTP2 framing layer (Connection reset by peer)" /
  # "curl failed" / "SSL_read: unexpected eof" — that abort `cargo publish`
  # mid-release (hit during the 1.1.0 release: faucet-sink-parquet failed on an
  # HTTP2 reset). Retry more, and disable HTTP/2 multiplexing to force HTTP/1.1
  # against the registry. Mirrors the same guards in .github/workflows/ci.yml.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

permissions:
  contents: read

jobs:
  release-gate:
    name: Detect a release commit
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
    steps:
      - id: detect
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          if [[ "$subject" =~ ^chore(\([^\)]*\))?:\ release || "$subject" =~ ^chore\(release\): ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release-plz-pr:
    name: Open / update release PR
    runs-on: ubuntu-latest
    # Run AFTER release-plz-release so the per-crate tags it creates already
    # exist before this job evaluates. Without this, a release-PR merge fires
    # both jobs in parallel and this one can observe a just-bumped manifest
    # whose tag release-plz-release hasn't created yet — concluding the version
    # is unreleased and opening a redundant duplicate release PR (see #169,
    # #172). `needs` serializes them; `!cancelled()` keeps this running even
    # when the release job was a no-op (normal push) or failed.
    needs: release-plz-release
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      pull-requests: write
    # Only one release-PR job at a time so concurrent merges to main don't race
    # on the same release branch.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      # Required by `rdkafka` (faucet-source-kafka / faucet-sink-kafka) and the
      # OpenSSL-backed reqwest variants. release-plz runs `cargo publish` for
      # each bumped crate, which compiles the crate; the build fails without
      # these system libraries.
      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
          config: release-plz.toml
        env:
          # Use `RELEASE_PLZ_TOKEN` (a PAT or GitHub App token with
          # `contents: write` + `pull-requests: write`) when set, falling back
          # to the default `GITHUB_TOKEN`. Note: PRs opened by the default
          # `GITHUB_TOKEN` do NOT trigger downstream workflow runs (i.e. CI
          # won't run on the release PR) — set `RELEASE_PLZ_TOKEN` to a PAT or
          # App token to get CI on the release PR.
          # No CARGO_REGISTRY_TOKEN: release-pr only reads the public index.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      # release-plz bumps Cargo manifests only. The Helm chart's image tag
      # defaults to its appVersion, and the agent-skills plugin version names
      # the faucet-cli release whose skills it carries, so the release PR must
      # carry the new faucet-cli version in both (#830, #853); CI fails when
      # they differ. The subject deliberately is not `chore: release`, which
      # the release gate above treats as a release commit.
      - name: Sync the Helm chart appVersion and the skills plugin version on the release PR
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
          PUSH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          branch=$(jq -r '.head_branch // empty' <<<"${PR:-"{}"}")
          if [ -z "$branch" ]; then
            echo "No release PR opened or updated."
            exit 0
          fi
          git fetch --quiet origin "$branch"
          git switch --quiet -C "$branch" FETCH_HEAD
          python3 scripts/helm-app-version.py --write
          python3 scripts/plugin-version.py --write
          if git diff --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -am "chore: sync the Helm chart and skills plugin versions with faucet-cli"
          git push --quiet "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"

  release-plz-release:
    name: Publish to crates.io
    needs: release-gate
    if: needs.release-gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
    # Serialize publishes against each other — release-plz handles dependency
    # ordering internally, but two concurrent runs would race on the registry.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - name: Install librdkafka prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libssl-dev libcurl4-openssl-dev cmake build-essential

      # crates.io enforces TWO separate publish rate limits, and this ladder must
      # survive both:
      #   1. Updates to EXISTING crates — a burst of ~30, then a slow refill. A
      #      workspace-wide release that bumps more crates than the burst (e.g.
      #      the reliability-audit release that touched all 57 crates, #264)
      #      exhausts it mid-run.
      #   2. Brand-NEW crate names — a burst of ~5, then only **1 new crate per
      #      ~10 minutes** (much harsher). A release that introduces several new
      #      1.0.0 crates at once — e.g. the 1.5.0 release adding the delta /
      #      databricks / spanner source+sink crates — blows past the burst, and
      #      each remaining new crate must then wait out its own ~10-minute
      #      window. (This is exactly what left 1.5.0 partially published: the
      #      old 4m + 6m cool-downs were tuned for limit #1 and could not clear
      #      limit #2, so `faucet-cli` — published last — never shipped.)
      # In both cases `cargo publish` aborts with "429 Too Many Requests" and
      # release-plz exits non-zero, leaving a partially-published release.
      #
      # `release-plz release` is **idempotent** — it checks the sparse index and
      # skips already-published crates — so the cure is to retry it with a
      # cool-down between attempts, letting the limit refill so each attempt
      # resumes where the last stopped. Because the NEW-crate limit is the
      # binding one (~1 / 10 min), each cool-down is ~11 minutes, and the job
      # keeps retrying until the publish succeeds or ~2 hours have passed —
      # enough for a burst of 5 new crates plus ~10 more. The common case (a
      # handful of crates, no new names) publishes on the first attempt and
      # never sleeps. If the cap is hit the job fails loudly; a maintainer
      # re-runs it (idempotent) or uses the manual `release.yml`.
      - name: Record the publish start time
        run: echo "PUBLISH_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # The action installs release-plz and configures git; the retry loop
      # below reuses both.
      - name: Publish to crates.io (first attempt)
        id: publish1
        continue-on-error: true
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
          config: release-plz.toml
        env:
          # Prefer the RELEASE_PLZ_TOKEN PAT when configured: refs (per-crate
          # tags) pushed with the default GITHUB_TOKEN do NOT trigger other
          # workflows, so release-binaries.yml never fires automatically after
          # a publish. A PAT-pushed tag triggers it normally. Falls back to
          # GITHUB_TOKEN (today's behavior: trigger release-binaries manually).
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish to crates.io (retry until done, ~2h cap)
        if: steps.publish1.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          COOL_DOWN_SECS: "660"
          CAP_SECS: "7200"
        run: |
          deadline=$(( PUBLISH_STARTED + CAP_SECS ))
          attempt=2
          while true; do
            if (( $(date +%s) + COOL_DOWN_SECS > deadline )); then
              echo "::error::crates.io publish still incomplete after $((attempt - 1)) attempts and the ~2h cap; re-run this job (idempotent) or use the manual release.yml."
              exit 1
            fi
            echo "::warning::publish attempt $((attempt - 1)) exited non-zero (commonly a crates.io 429). Waiting ${COOL_DOWN_SECS}s for the new-crate rate-limit window to refill, then retrying idempotently."
            sleep "$COOL_DOWN_SECS"
            if release-plz release --git-token "$GITHUB_TOKEN" --config release-plz.toml -o json; then
              echo "publish completed on attempt $attempt"
              exit 0
            fi
            attempt=$(( attempt + 1 ))
          done

      # crates.io makes the publishing account the only owner of a brand-new
      # crate. Add the org team to every crate this run released (its
      # `<crate>-v<version>` tag points at this commit), so each crate is owned
      # by both the publisher and github:faucet-hq:owners. Runs after a failed
      # publish too, because a partial release still published some crates.
      # Needs CARGO_REGISTRY_TOKEN with the change-owners scope, owned by a
      # member of the faucet-hq/owners GitHub team.
      - name: Add github:faucet-hq:owners to the crates this run released
        if: ${{ !cancelled() }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TEAM: github:faucet-hq:owners
          UA: faucet-stream release (https://github.com/faucet-hq/faucet-stream)
        run: |
          git fetch --quiet --force --tags origin
          mapfile -t crates < <(git tag --points-at "$GITHUB_SHA" | sed -nE 's/^(.+)-v[0-9]+\.[0-9]+\.[0-9]+.*$/\1/p' | sort -u)
          if [ "${#crates[@]}" -eq 0 ]; then
            echo "No crates released at $GITHUB_SHA."
            exit 0
          fi
          failed=0
          for crate in "${crates[@]}"; do
            owners=$(curl -fsS -A "$UA" "https://crates.io/api/v1/crates/${crate}/owners" | jq -r '.users[].login') || {
              echo "::error::${crate}: could not read its crates.io owners"
              failed=$((failed + 1))
              continue
            }
            if grep -qxF "$TEAM" <<<"$owners"; then
              echo "${crate}: already owned by ${TEAM}"
            elif cargo owner --add "$TEAM" "$crate"; then
              echo "${crate}: added ${TEAM}"
            else
              echo "::error::${crate}: cargo owner --add ${TEAM} failed"
              failed=$((failed + 1))
            fi
            sleep 1
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} released crate(s) still lack ${TEAM}. CARGO_REGISTRY_TOKEN needs the change-owners scope and must belong to a member of that team."
            exit 1
          fi
