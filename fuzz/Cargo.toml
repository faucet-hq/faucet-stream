[package]
name = "faucet-fuzz"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "cargo-fuzz targets for faucet-stream's parsers (not published)"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: the fuzz crate builds on nightly with sanitizer flags and
# must never join the main workspace's build, lockfile or release.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1"
chrono = "0.4"
faucet-core = { path = "../crates/core", features = ["compression", "file-format-csv", "file-format-xml", "file-format-excel"] }
faucet-cli = { path = "../cli", default-features = false, features = ["mcp"] }
faucet-source-rest = { path = "../crates/source/rest", default-features = false, features = ["excel"] }
faucet-source-xml = { path = "../crates/source/xml", features = ["excel"] }
tokio = { version = "1", features = ["rt", "io-util"] }
# The pgoutput decoder is compiled from its source files (fuzz_targets/pgoutput.rs)
# so the postgres-cdc crate, and the sqlx macros the sanitizer build cannot load, stay out.
base64 = "0.22"
byteorder = "1"
# The SQL Server driver, to compare its connection-string reading with the screen (fuzz_targets/ado_connection_string.rs).
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73"] }
# The Azure Blob client's settings, to compare with the connection-string screen (fuzz_targets/azure_connection_string.rs).
faucet-common-azure = { path = "../crates/common/azure" }
tracing = "0.1"

[[bin]]
name = "interpolate"
path = "fuzz_targets/interpolate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quote_ident"
path = "fuzz_targets/quote_ident.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pgoutput"
path = "fuzz_targets/pgoutput.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fidelity_from_str"
path = "fuzz_targets/fidelity_from_str.rs"
test = false
doc = false
bench = false

[[bin]]
