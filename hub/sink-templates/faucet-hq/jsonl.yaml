# Template Hub sink: local JSON Lines files — the "validate locally first"
# destination. One file per stream under `<out_dir>/<source>/`, written by the
# file sink. The file is replaced on every run, and a stream that wants
# `overwrite` gets the file sink's atomic overwrite. Keyed modes (`upsert`)
# cannot be satisfied by a file.
kind: sink-template
name: jsonl
owner: faucet-hq
description: Local JSON Lines files, one per stream — the local validation destination
tags: [file, local]
params:
  out_dir: { type: string, default: ./out, description: "Directory to write <source>/<stream>.jsonl under" }
sink:
  type: file
  config:
    format: json_lines
per_stream:
  path: "${param.out_dir}/${source}/${stream}.jsonl"
