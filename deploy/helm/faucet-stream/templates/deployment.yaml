{{- if .Values.serve.enabled -}}
{{- $mountPath := .Values.serve.persistence.mountPath | trimSuffix "/" -}}
{{- $features := include "faucet-stream.serveFileFeatures" . | fromYaml -}}
{{- $serveFiles := include (print $.Template.BasePath "/configmap-serve-files.yaml") . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "faucet-stream.fullname" . }}
  labels:
    {{- include "faucet-stream.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  {{- if not .Values.serve.autoscaling.enabled }}
  replicas: {{ .Values.serve.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "faucet-stream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: serve
  template:
    metadata:
      labels:
        {{- include "faucet-stream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: serve
        {{- with .Values.serve.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.pipelineConfig.create }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if trim $serveFiles }}
        checksum/serve-files: {{ $serveFiles | sha256sum }}
        {{- end }}
        {{- if .Values.secret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret-env.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.serve.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "faucet-stream.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.serve.terminationGracePeriodSeconds }}
      {{- $verify := include "faucet-stream.verifyInitContainer" . }}
      {{- if or (trim $verify) .Values.extraInitContainers }}
      initContainers:
        {{- if trim $verify }}
        {{- $verify | nindent 8 }}
        {{- end }}
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: serve
          image: {{ include "faucet-stream.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=0.0.0.0:8080
            {{- if eq .Values.serve.auth.mode "none" }}
            - --no-auth
            {{- else if eq .Values.serve.auth.mode "rbac" }}
            {{- if .Values.serve.auth.existingSecret }}
            - --auth-config=/etc/faucet-auth/{{ .Values.serve.auth.existingSecretKey }}
            {{- else }}
            - --auth-config=/etc/faucet-auth/rbac.yaml
            {{- end }}
            {{- end }}

            {{- if not .Values.serve.ui.enabled }}
            - --no-ui
            {{- end }}
            {{- if .Values.serve.cluster.enabled }}
            - --cluster
            {{- end }}
            {{- if .Values.pipelineConfig.create }}
            - --default-config={{ include "faucet-stream.configFilePath" . }}
            {{- end }}
            {{- range $key, $f := $features }}
            {{- $block := index $.Values.serve $key }}
            {{- if $block.enabled }}
            - --{{ $f.flag }}={{ $f.dir }}/{{ $block.fileName }}
            {{- end }}
            {{- end }}
            {{- if .Values.serve.tenants.enabled }}
            {{- range $i, $_ := .Values.serve.tenants.previousKeys }}
            - --vault-previous-key=$(FAUCET_VAULT_PREVIOUS_KEY_{{ $i }})
            {{- end }}
            {{- end }}
            {{- with .Values.serve.approvals.require }}
            - --require-approval={{ join "," . }}
            {{- end }}
            {{- with .Values.serve.approvals.expirySecs }}
            - --approval-expiry-secs={{ int64 . }}
            {{- end }}
            {{- if .Values.serve.mcp.enabled }}
            - --mcp
            {{- if .Values.serve.mcp.allowMutations }}
            - --mcp-allow-mutations
            {{- end }}
            {{- end }}
            {{- with .Values.serve.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Retention window for local sink outputs (#587). Passed as env rather
            # than a flag so it can be overridden per environment without
            # touching args.
            - name: FAUCET_LOCAL_SINK_OUTPUT_RETENTION_DAYS
              value: {{ .Values.serve.localOutputs.retentionDays | quote }}
            - name: FAUCET_LOCAL_SINK_OUTPUT_IN_FLIGHT_GRACE_SECS
              value: {{ .Values.serve.localOutputs.inFlightGraceSeconds | quote }}
            # Dataset preview of local sink outputs (#586). Off unless explicitly
            # enabled: it reads file contents back over HTTP. The two caps ride
            # along so they can be tuned per environment without a rebuild.
            - name: FAUCET_SERVE_PREVIEW_LOCAL_OUTPUTS
              value: {{ .Values.serve.preview.enabled | quote }}
            - name: FAUCET_SERVE_PREVIEW_DEFAULT_ROWS
              value: {{ .Values.serve.preview.rows | quote }}
            - name: FAUCET_SERVE_PREVIEW_MAX_ROWS
              value: {{ .Values.serve.preview.maxRows | quote }}
            {{- /* The history URL travels as FAUCET_SERVE_HISTORY, never on the
                   command line: a postgres DSN carries a password (#789 SUPPLY-07). */}}
            {{- if ne .Values.serve.history.backend "memory" }}
            {{- if or .Values.serve.history.existingSecret .Values.serve.history.url }}
            {{- if or .Values.serve.history.existingSecret (eq .Values.serve.history.backend "postgres") }}
            - name: FAUCET_SERVE_HISTORY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serve.history.existingSecret | default (include "faucet-stream.historySecretName" .) }}
                  key: {{ .Values.serve.history.existingSecretKey }}
            {{- else }}
            - name: FAUCET_SERVE_HISTORY
              value: {{ .Values.serve.history.url | quote }}
            {{- end }}
            {{- else if eq .Values.serve.history.backend "sqlite" }}
            - name: FAUCET_SERVE_HISTORY
              value: {{ printf "sqlite://%s/history.db" $mountPath | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.otel.logs.enabled }}
            # Log shipping over OTLP (#806).
            {{- if not .Values.serve.otel.enabled }}
            - name: FAUCET_SERVE_OTEL_CONFIG
              value: /etc/faucet-otel/otel.yaml
            {{- end }}
            - name: FAUCET_SERVE_LOG_RETENTION_SECS
              value: {{ .Values.otel.logs.retentionSeconds | int64 | quote }}
            - name: FAUCET_SERVE_LOG_BUFFER_MAX_AGE_SECS
              value: {{ .Values.otel.logs.maxAgeSeconds | int64 | quote }}
            - name: FAUCET_SERVE_LOG_BUFFER_MAX_BYTES
              value: {{ .Values.otel.logs.maxBytes | int64 | quote }}
            {{- with .Values.otel.logs.linkTemplate }}
            - name: FAUCET_SERVE_LOG_LINK_TEMPLATE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.serve.tenants.enabled }}
            - name: FAUCET_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serve.tenants.vaultKey.existingSecret }}
                  key: {{ .Values.serve.tenants.vaultKey.existingSecretKey }}
            {{- range $i, $k := .Values.serve.tenants.previousKeys }}
            - name: FAUCET_VAULT_PREVIOUS_KEY_{{ $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ $k.existingSecret }}
                  key: {{ $k.existingSecretKey | default "FAUCET_VAULT_KEY" }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.serve.auth.mode "token" }}
            - name: FAUCET_SERVE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serve.auth.existingSecret | default (include "faucet-stream.authSecretName" .) }}
                  key: {{ .Values.serve.auth.existingSecretKey }}
            {{- end }}
            {{- include "faucet-stream.env" . | nindent 12 }}
          {{- $envFrom := include "faucet-stream.envFrom" . }}
          {{- if trim $envFrom }}
          envFrom:
            {{- $envFrom | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.serve.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.serve.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.serve.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: scratch
              mountPath: {{ $mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.pipelineConfig.create .Values.pipelineConfig.existingConfigMap }}
            - name: pipeline-config
              mountPath: {{ .Values.pipelineConfig.mountPath }}
              readOnly: true
            {{- end }}
            {{- if eq .Values.serve.auth.mode "rbac" }}
            - name: rbac-auth
              mountPath: /etc/faucet-auth
              readOnly: true
            {{- end }}
            {{- if and .Values.otel.logs.enabled (not .Values.serve.otel.enabled) }}
            - name: otel-config
              mountPath: /etc/faucet-otel
              readOnly: true
            {{- end }}
            {{- range $key, $f := $features }}
            {{- if (index $.Values.serve $key).enabled }}
            - name: {{ $f.volume }}
              mountPath: {{ $f.dir }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.secretFiles.enabled }}
            - name: secret-files
              mountPath: {{ .Values.secretFiles.mountPath }}
              readOnly: true
            {{- end }}
            {{- with include "faucet-stream.extraVolumeMounts" . | trim }}{{ . | nindent 12 }}{{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if or .Values.serve.persistence.enabled .Values.serve.persistence.existingClaim }}
        - name: scratch
          persistentVolumeClaim:
            claimName: {{ .Values.serve.persistence.existingClaim | default (printf "%s-data" (include "faucet-stream.fullname" .)) }}
        {{- else }}
        - name: scratch
          emptyDir: {}
        {{- end }}
        {{- if or .Values.pipelineConfig.create .Values.pipelineConfig.existingConfigMap }}
        - name: pipeline-config
          configMap:
            name: {{ include "faucet-stream.configMapName" . }}
        {{- end }}
        {{- if and .Values.otel.logs.enabled (not .Values.serve.otel.enabled) }}
        - name: otel-config
          configMap:
            name: {{ include "faucet-stream.fullname" . }}-otel
        {{- end }}
        {{- range $key, $f := $features }}
        {{- $block := index $.Values.serve $key }}
        {{- if $block.enabled }}
        - name: {{ $f.volume }}
          {{- if $block.existingSecret }}
          secret:
            secretName: {{ $block.existingSecret }}
          {{- else }}
          configMap:
            name: {{ $block.existingConfigMap | default (include "faucet-stream.serveFileConfigMapName" (dict "root" $ "volume" $f.volume)) }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- if eq .Values.serve.auth.mode "rbac" }}
        - name: rbac-auth
          secret:
            secretName: {{ .Values.serve.auth.existingSecret | default (include "faucet-stream.authSecretName" .) }}
        {{- end }}
        {{- if .Values.secretFiles.enabled }}
        - name: secret-files
          secret:
            secretName: {{ .Values.secretFiles.existingSecret | default (include "faucet-stream.envSecretName" .) }}
        {{- end }}
        {{- with include "faucet-stream.extraVolumes" . | trim }}{{ . | nindent 8 }}{{- end }}
      {{- with .Values.serve.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serve.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serve.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serve.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
