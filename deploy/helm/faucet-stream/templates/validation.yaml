{{- /* Fail fast on inconsistent value combinations. Renders no objects. */ -}}
{{- $hasConfig := or .Values.pipelineConfig.create .Values.pipelineConfig.existingConfigMap -}}
{{- if and .Values.job.enabled (not $hasConfig) -}}
{{- fail "job.enabled=true requires a pipeline config: set pipelineConfig.create=true with pipelineConfig.content, or pipelineConfig.existingConfigMap." -}}
{{- end -}}
{{- if and .Values.cronjob.enabled (not $hasConfig) -}}
{{- fail "cronjob.enabled=true requires a pipeline config: set pipelineConfig.create=true with pipelineConfig.content, or pipelineConfig.existingConfigMap." -}}
{{- end -}}
{{- if and .Values.serve.enabled (not (or (eq .Values.serve.auth.mode "token") (eq .Values.serve.auth.mode "none") (eq .Values.serve.auth.mode "rbac"))) -}}
{{- fail (printf "serve.auth.mode must be one of token|none|rbac (got %q)." .Values.serve.auth.mode) -}}
{{- end -}}
{{- if and .Values.serve.enabled (eq .Values.serve.auth.mode "rbac") (not .Values.serve.auth.rbacConfig) (not .Values.serve.auth.existingSecret) -}}
{{- fail "serve.auth.mode=rbac requires serve.auth.rbacConfig (inline principals) or serve.auth.existingSecret." -}}
{{- end -}}
{{- if and .Values.serve.enabled .Values.serve.cluster.enabled (eq .Values.serve.history.backend "memory") -}}
{{- fail "serve.cluster.enabled=true requires a persistent history backend: set serve.history.backend to sqlite or postgres." -}}
{{- end -}}
{{- if and .Values.serve.enabled (lt (int .Values.serve.localOutputs.retentionDays) 0) -}}
{{- fail (printf "serve.localOutputs.retentionDays must be 0 (never expire) or a positive number of days (got %v)." .Values.serve.localOutputs.retentionDays) -}}
{{- end -}}
{{- if and .Values.serve.enabled (lt (int .Values.serve.localOutputs.inFlightGraceSeconds) 0) -}}
{{- fail (printf "serve.localOutputs.inFlightGraceSeconds must be 0 (disabled) or a positive number of seconds (got %v)." .Values.serve.localOutputs.inFlightGraceSeconds) -}}
{{- end -}}
{{- if and .Values.serve.enabled (lt (int .Values.serve.preview.rows) 0) -}}
{{- fail (printf "serve.preview.rows must be 0 (preview the whole dataset by default) or a positive number of rows (got %v)." .Values.serve.preview.rows) -}}
{{- end -}}
{{- if and .Values.serve.enabled (lt (int .Values.serve.preview.maxRows) 0) -}}
{{- fail (printf "serve.preview.maxRows must be 0 (no ceiling) or a positive number of rows (got %v)." .Values.serve.preview.maxRows) -}}
{{- end -}}
{{- /* #789 SUPPLY-08: replicas share nothing unless the history is Postgres —
       memory and per-pod SQLite give each pod its own runs and idempotency keys. */ -}}
{{- $multi := or (gt (int .Values.serve.replicaCount) 1) .Values.serve.autoscaling.enabled -}}
{{- if and .Values.serve.enabled $multi (ne .Values.serve.history.backend "postgres") -}}
{{- fail "serve.replicaCount > 1 or serve.autoscaling.enabled requires serve.history.backend=postgres (a shared history): with memory or a per-pod SQLite file each replica has its own run records and idempotency keys, so GET/cancel 404 on the other pods and a retried keyed submission can run twice." -}}
{{- end -}}
{{- if and .Values.serve.enabled $multi (not .Values.serve.cluster.enabled) -}}
{{- fail "serve.replicaCount > 1 or serve.autoscaling.enabled requires serve.cluster.enabled=true, so runs are claimed and failed over across replicas instead of running only on the pod that received them." -}}
{{- end -}}
{{- if and .Values.serve.enabled (eq .Values.serve.history.backend "postgres") (not .Values.serve.history.url) (not .Values.serve.history.existingSecret) -}}
{{- fail "serve.history.backend=postgres requires serve.history.url or serve.history.existingSecret." -}}
{{- end -}}
{{- if .Values.serve.enabled -}}
{{- $features := include "faucet-stream.serveFileFeatures" . | fromYaml -}}
{{- range $key, $f := $features -}}
{{- $block := index $.Values.serve $key -}}
{{- if $block.enabled -}}
{{- $sources := 0 -}}
{{- range list $block.content $block.existingConfigMap $block.existingSecret -}}{{- if . -}}{{- $sources = add1 $sources -}}{{- end -}}{{- end -}}
{{- if ne (int $sources) 1 -}}
{{- fail (printf "serve.%s.enabled=true needs exactly one of serve.%s.content, serve.%s.existingConfigMap or serve.%s.existingSecret (got %d)." $key $key $key $key (int $sources)) -}}
{{- end -}}
{{- if not $block.fileName -}}
{{- fail (printf "serve.%s.fileName must not be empty." $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.serve.tenants.enabled -}}
{{- if eq .Values.serve.history.backend "memory" -}}
{{- fail "serve.tenants.enabled=true requires a persistent history backend: tenants, their sealed connections and state ledgers live in the run history, so with memory every restart deletes them. Set serve.history.backend to sqlite (with serve.persistence) or postgres." -}}
{{- end -}}
{{- if not (and .Values.serve.tenants.vaultKey.existingSecret .Values.serve.tenants.vaultKey.existingSecretKey) -}}
{{- fail "serve.tenants.enabled=true requires serve.tenants.vaultKey.existingSecret (and existingSecretKey): the server refuses to store or open tenant connections without a vault key. Create one with: kubectl create secret generic faucet-vault --from-literal=FAUCET_VAULT_KEY=$(openssl rand -base64 48)" -}}
{{- end -}}
{{- range $i, $k := .Values.serve.tenants.previousKeys -}}
{{- if not (and (kindIs "map" $k) $k.existingSecret) -}}
{{- fail (printf "serve.tenants.previousKeys[%d] needs existingSecret (and optionally existingSecretKey, default FAUCET_VAULT_KEY)." $i) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.serve.connectProviders.enabled (not .Values.serve.tenants.enabled) -}}
{{- fail "serve.connectProviders.enabled=true requires serve.tenants.enabled=true: a hosted OAuth connect stores the grant as a tenant connection sealed with the vault key." -}}
{{- end -}}
{{- range .Values.serve.approvals.require -}}
{{- if not (has . (list "run" "template_register" "template-register" "template_launch" "template-launch")) -}}
{{- fail (printf "serve.approvals.require: unknown change kind %q (expected run, template_register or template_launch)." .) -}}
{{- end -}}
{{- if and $.Values.serve.templatesSync.enabled (ne . "run") -}}
{{- fail (printf "serve.approvals.require=%s cannot be combined with serve.templatesSync.enabled: template sync registers and launches templates on its own schedule, which would bypass the approval (faucet serve refuses to start). Drop one of the two." .) -}}
{{- end -}}
{{- end -}}
{{- with .Values.serve.approvals.expirySecs -}}
{{- if le (int64 .) 0 -}}
{{- fail (printf "serve.approvals.expirySecs must be a positive number of seconds (got %v)." .) -}}
{{- end -}}
{{- end -}}
{{- if and (not (kindIs "invalid" .Values.serve.approvals.expirySecs)) (eq (toString .Values.serve.approvals.expirySecs) "0") -}}
{{- fail "serve.approvals.expirySecs must be a positive number of seconds (got 0); leave it null for the server default." -}}
{{- end -}}
{{- if and .Values.serve.mcp.allowMutations (not .Values.serve.mcp.enabled) -}}
{{- fail "serve.mcp.allowMutations=true has no effect without serve.mcp.enabled=true." -}}
{{- end -}}
{{- if and .Values.otel.logs.enabled .Values.serve.otel.enabled .Values.serve.otel.content -}}
{{- $otel := .Values.serve.otel.content -}}
{{- if kindIs "string" $otel -}}{{- $otel = fromYaml $otel -}}{{- end -}}
{{- if not (has "logs" (default list $otel.export)) -}}
{{- fail "serve.otel replaces the server OTLP file otel.logs renders, and its `export` does not list `logs`: run-log shipping would silently stop. Add `logs` to serve.otel export (with the collector endpoint), or disable one of the two." -}}
{{- end -}}
{{- end -}}
{{- end -}}
