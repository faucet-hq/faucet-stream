{{- /* The history URL (a postgres DSN carries a password) as a Secret the
       deployment reads into FAUCET_SERVE_HISTORY (#789 SUPPLY-07). Every url
       but memory goes here, so no spelling of it lands in the pod spec. */ -}}
{{- if and .Values.serve.enabled (include "faucet-stream.historyUrlSecret" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "faucet-stream.historySecretName" . }}
  labels:
    {{- include "faucet-stream.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.serve.history.existingSecretKey }}: {{ .Values.serve.history.url | quote }}
{{- end -}}
