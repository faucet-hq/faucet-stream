{{- /* The postgres history DSN (it carries a password) as a Secret the
       deployment reads into FAUCET_SERVE_HISTORY (#789 SUPPLY-07). */ -}}
{{- if and .Values.serve.enabled (eq .Values.serve.history.backend "postgres") .Values.serve.history.url (not .Values.serve.history.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "faucet-stream.historySecretName" . }}
  labels:
    {{- include "faucet-stream.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.serve.history.existingSecretKey }}: {{ .Values.serve.history.url | quote }}
{{- end -}}
