# Templates sync / triggers with memory history render, with a warning in NOTES.
# expect: WARNING: serve.templatesSync is on with serve.history.backend=memory
# expect: Note: serve.triggers runs with serve.history.backend=memory
serve:
  templatesSync:
    enabled: true
    existingConfigMap: my-sync
  triggers:
    enabled: true
    existingConfigMap: my-triggers
