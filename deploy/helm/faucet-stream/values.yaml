# Default values for the faucet-stream chart.
# See deploy/helm/faucet-stream/README.md for the full guide.

# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------
# NOTE: connectors are COMPILE-TIME features. The image tag you pick already
# fixes which sources/sinks exist. The `connectors:` block below only *declares
# and verifies* that intent — it cannot enable a connector that wasn't built in.
image:
  repository: ghcr.io/faucet-hq/faucet-stream
  # Defaults to Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Declare-and-verify: which connectors/features this deployment expects to exist
# in the image. If verify.enabled, an initContainer runs `faucet schema
# source|sink <name>` for each and refuses to start the pod when any is missing
# — turning a silent runtime "unknown connector type" into a clear boot failure.
# -----------------------------------------------------------------------------
connectors:
  sources: []   # e.g. [rest, postgres, s3]
  sinks: []     # e.g. [bigquery, jsonl, stdout]
  verify:
    enabled: true

# -----------------------------------------------------------------------------
# Service account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# Pod-level security (applied to serve Deployment, Job, and CronJob pods)
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# -----------------------------------------------------------------------------
# Extra env / envFrom shared by every faucet pod (serve, job, cronjob).
# Use for connector credentials, e.g. via a Secret referenced in envFrom.
# -----------------------------------------------------------------------------
env: []
# - name: FAUCET_LOG
#   value: info
envFrom: []
# - secretRef:
#     name: my-connector-credentials

# Optional chart-managed Secret (stringData). Referenced automatically in
# every pod's envFrom when create=true.
secret:
  create: false
  # name: ""     # defaults to <release>-faucet-stream-env
  data: {}
  #   PGPASSWORD: "s3cr3t"
  #   GOOGLE_APPLICATION_CREDENTIALS_JSON: "..."

# Mount secrets as FILES (for `${file:...}` interpolation), in addition to the
# env / envFrom paths above. Each Secret key becomes a file under mountPath. Uses
# the chart-managed env Secret (secret.create=true) by default, or an existing one.
# NB: this is a k8s-native Secret volume — for an EXTERNAL fetcher (Vault etc.)
# use extraInitContainers below to populate a shared volume.
secretFiles:
  enabled: false
  mountPath: /var/run/secrets/faucet
  existingSecret: ""   # defaults to the chart-managed env Secret when secret.create=true

# Extra init containers (verbatim k8s specs) run before the app starts — e.g. a
# Vault/cloud secrets fetcher that writes into a shared volume the app also mounts.
# The chart's own optional `verify` init container still runs alongside these.
extraInitContainers: []
#  - name: fetch-secrets
#    image: my/secrets-fetcher:tag
#    volumeMounts: [{ name: secret-files, mountPath: /var/run/secrets/faucet }]

# -----------------------------------------------------------------------------
# Pipeline config (a `faucet` YAML/JSON). Mounted read-only at
# pipelineConfig.mountPath. Used by Job/CronJob, and optionally as the serve
# workspace default-config.
# -----------------------------------------------------------------------------
pipelineConfig:
  # Render a ConfigMap from `content` below.
  create: false
  # Or reference an existing ConfigMap (takes precedence over create).
  existingConfigMap: ""
  fileName: pipeline.yaml
  mountPath: /etc/faucet
  content: ""
  #   version: 1
  #   name: my-pipeline
  #   pipeline:
  #     source: { type: rest, config: { ... } }
  #     sink:   { type: jsonl, config: { path: /var/lib/faucet/out.jsonl } }

# -----------------------------------------------------------------------------
# Log shipping over OTLP (#806). Requires an image built with the `otel`
# feature (the `full` image). Every run-log line is buffered locally first and
# shipped to the collector; delivered lines are kept `retentionSeconds`,
# undelivered ones until delivered (bounded by maxAge / maxBytes).
#
# - serve: the run-history backend is the buffer. Use history.backend sqlite +
#   serve.persistence (or postgres) for a buffer that survives a restart; with
#   `memory` the buffer is lost on restart.
# - job / cronjob: `faucet run` spools to `spoolDir` (mounted below). The
#   pipeline config must turn shipping on itself:
#     observability:
#       otel: { endpoint: ..., export: [logs] }
#       logs: { spool_dir: /var/lib/faucet-logs }
# -----------------------------------------------------------------------------
otel:
  logs:
    enabled: false
    endpoint: ""            # e.g. http://otel-collector:4317 (grpc) / :4318 (http)
    protocol: grpc          # grpc | http
    serviceName: faucet
    headers: {}             # e.g. { authorization: "Bearer ..." }
    retentionSeconds: 86400
    maxAgeSeconds: 604800
    maxBytes: 1073741824
    # "View logs" link in the console once a run's local copy aged out.
    linkTemplate: ""        # e.g. https://grafana.example/explore?...{run_id}...
    # job / cronjob spool directory and its volume.
    spoolDir: /var/lib/faucet-logs
    buffer:
      persistence:
        enabled: false      # emptyDir otherwise: undelivered lines die with the pod
        size: 1Gi
        storageClass: ""
        accessModes: [ReadWriteOnce]
        existingClaim: ""

# =============================================================================
# serve — long-running HTTP control plane (Deployment)
# =============================================================================
serve:
  enabled: true
  replicaCount: 1

  # Auth for /v1/* : "token" | "none" | "rbac"
  auth:
    mode: token
    # mode=token: provide a token, or point at an existing Secret key. If both
    # are empty and mode=token, the chart generates a random token on first
    # install (kept stable across upgrades) and stores it in a Secret.
    token: ""
    existingSecret: ""
    existingSecretKey: FAUCET_SERVE_AUTH_TOKEN
    # mode=rbac: inline RBAC principals (rendered to a Secret + mounted), or
    # reference an existing file via existingSecret/Key.
    rbacConfig: {}
    #   principals:
    #     - { name: ci,    token: "...", role: operator }
    #     - { name: admin, token: "...", role: admin }

  # Run-history backend: "memory" | "sqlite" | "postgres"
  history:
    backend: memory
    # sqlite: defaults to a file on the mounted volume (see persistence).
    # postgres: a DSN. The URL reaches the pod as FAUCET_SERVE_HISTORY, never
    # on the command line; a postgres DSN is stored in a chart-managed Secret.
    url: ""
    # Or read the URL from your own Secret (recommended for postgres, so the
    # password never sits in Helm values).
    existingSecret: ""
    existingSecretKey: FAUCET_SERVE_HISTORY

  # Enable the embedded web console (image must include the serve-ui feature).
  ui:
    enabled: true

  # Retention GC for the local files a run's sinks write (jsonl / csv / parquet)
  # — a local-testing convenience that keeps the pod's data footprint bounded.
  # Surfaced as FAUCET_LOCAL_SINK_OUTPUT_RETENTION_DAYS.
  #
  # The sweeper deletes ONLY files faucet recorded as its own sink outputs
  # (paths come from the run/catalog record) — never a glob or a directory, and
  # never a file faucet merely appended to. Run history, catalog entries, and
  # lineage are never touched: a cleaned output keeps its record, marked expired.
  #
  # Set retentionDays: 0 to disable the automatic sweep; outputs are still
  # tracked and can be cleaned on demand from the console's Datasets page or
  # with `faucet cleanup`. Requires an image built with the `catalog` feature,
  # and a persistent history backend for the ledger to survive a restart.
  localOutputs:
    retentionDays: 7
    # Never delete an output touched within this many seconds — the guard against
    # unlinking a file a run is still writing (including a run the ledger has not
    # recorded yet). Raise it above the longest gap between a slow source's pages;
    # 0 disables it. Surfaced as FAUCET_LOCAL_SINK_OUTPUT_IN_FLIGHT_GRACE_SECS.
    inFlightGraceSeconds: 60

  # Dataset preview of those local outputs (#586): the console's Datasets page
  # can read back the first N rows of a tracked jsonl / csv / parquet file.
  #
  # OFF by default, and it should usually stay off in a cluster: it returns the
  # *contents* of files on the pod's disk over HTTP. It is a local-testing
  # convenience. Only paths the local-output ledger recorded as faucet's own sink
  # outputs can ever be read — never a path from the request — and reading needs
  # the LocalOutputRead scope (viewer and up), so enabling it grants every viewer
  # sight of the data those pipelines wrote. Enable it only where that is
  # intended (a dev/staging namespace).
  #
  # The two caps are surfaced as env so a deployment can raise or lower them
  # without a rebuild: `rows` loads when the request omits `row_count_to_load`,
  # and `maxRows` is the ceiling a larger request is clamped to.
  preview:
    enabled: false
    # FAUCET_SERVE_PREVIEW_DEFAULT_ROWS — the soft cap. 0 = the whole dataset by
    # default.
    rows: 500
    # FAUCET_SERVE_PREVIEW_MAX_ROWS — the hard cap. A larger `row_count_to_load`
    # (including `all`) is clamped to it, so this is the number that decides how
    # much of a file one request can pull.
    #
    # 0 LIFTS THE CEILING: `row_count_to_load=all` then reads an entire output
    # file into one HTTP response. That is a local/dev choice — the read is still
    # bounded by a 64 MiB response budget and a 30s deadline, and returns a
    # partial answer that says which bound stopped it, but it is not something to
    # leave open on a shared deployment.
    maxRows: 5000

  # Multi-instance clustered execution (requires history.backend != memory).
  cluster:
    enabled: false

  # Extra raw args appended to `faucet serve`.
  extraArgs: []
  # - --cors-origin=https://app.example.com
  # - --max-concurrent-runs=8

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # A writable scratch dir (root fs is read-only). Also backs sqlite history
  # when persistence.enabled=false (emptyDir) — use persistence for durability.
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
    mountPath: /var/lib/faucet
    # Reuse an existing PVC instead of letting the chart create one. Setting this
    # mounts the claim on its own (no need to also set `enabled`), and the chart
    # renders no PVC of its own. Leave empty for a chart-managed claim.
    existingClaim: ""
    # Tip: point durable sink outputs (and the sqlite history/catalog) under
    # mountPath so they survive restarts, e.g.:
    #   sink: { type: jsonl, config: { path: /var/lib/faucet/out.jsonl } }

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  # Graceful drain: serve handles SIGTERM (--shutdown-grace-secs, default 60).
  terminationGracePeriodSeconds: 65

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: null

  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: faucet.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: faucet-tls
  #    hosts: [faucet.example.com]

# Prometheus Operator ServiceMonitor for the unauthenticated /metrics endpoint.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []
  metricRelabelings: []

# =============================================================================
# job — one-shot `faucet run <config>`
# =============================================================================
job:
  enabled: false
  # Uses pipelineConfig (ConfigMap) mounted at pipelineConfig.mountPath.
  # Extra args appended after `run <config>`.
  extraArgs: []
  backoffLimit: 3
  # Delete the Job object this long after completion (requires TTL controller).
  ttlSecondsAfterFinished: 3600
  restartPolicy: Never
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Re-run on every `helm upgrade` (Jobs are immutable). "" disables the hook.
  helmHook: ""   # e.g. post-install,post-upgrade
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# cronjob — scheduled `faucet run <config>`
# =============================================================================
cronjob:
  enabled: false
  schedule: "0 * * * *"
  timeZone: ""             # e.g. "Etc/UTC" (k8s >= 1.27)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  backoffLimit: 3
  restartPolicy: Never
  extraArgs: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
