# Generated by `faucet hub import openapi` from example-store.yaml.
# Review the import report's open decisions before publishing.
kind: source-template
requires_faucet: '>=1.14'
version: 1
name: example-store
owner: acme
description: Example Store — A synthetic store API used to show what `faucet hub import openapi` maps.
docs: https://api.example.com/docs
tags:
- rest
params:
  api_root:
    type: string
    description: API root; tests and replays point it at a local server
    default: https://api.example.com/v1
  api_token:
    type: string
    description: Bearer token (`bearerAuth` in the spec)
    required: true
    secret: true
source:
  type: rest
  config:
    base_url: ${param.api_root}
    auth:
      type: bearer
      config:
        token: ${param.api_token}
    retry_on_response:
    - backoff_from:
        type: header
        config:
          name: x-ratelimit-reset
          unit: epoch_s
      status:
      - 429
      values: []
transforms:
- type: json_encode
  config:
    fields:
    - address
    - lines
    - tags
streams:
- name: customers
  description: List customers
  source:
    config:
      path: /customers
      records_path: $.data[*]
      pagination:
        type: Cursor
        next_token_path: $.next_cursor
        param_name: cursor
      replication_bind:
        template: ${bookmark}
        name: updated_since
        format: iso8601
        into: query
        value_type: string
      replication_key: updated_at
      replication_method:
        type: Incremental
      schema:
        type: object
        properties:
          address:
            type:
            - object
            - 'null'
          id:
            type: integer
          name:
            type: string
          updated_at:
            type: string
            format: date-time
  primary_keys:
  - id
  write:
  - upsert
  - append
- name: orders
  description: List a customer's orders
  parent: customers
  source:
    config:
      path: /customers/${customers.id}/orders
      pagination:
        type: PageNumber
        page_size: 50
        page_size_param: per_page
        param_name: page
        start_page: 1
      schema:
        type: object
        properties:
          id:
            type: integer
          lines:
            type: array
          total:
            type: number
  primary_keys:
  - id
  write:
  - overwrite
  - upsert
- name: events
  description: List events
  source:
    config:
      path: /events
      records_path: $.items[*]
      pagination:
        type: Offset
        limit: 200
        limit_param: limit
        offset_param: offset
        stop_when_short: false
        total_path: $.total
      schema:
        type: object
        properties:
          created_at:
            type: string
            format: date-time
          id:
            type: string
          type:
            type: string
  primary_keys:
  - id
  write: append
- name: invoices
  description: List invoices
  source:
    config:
      path: /invoices
      records_path: $.results[*]
      pagination:
        type: NextLinkInBody
        next_link_path: $.links.next
      replication_bind:
        template: ${bookmark}
        name: modified_after
        format: iso8601
        into: query
        value_type: string
      replication_key: modified_at
      replication_method:
        type: Incremental
      schema:
        type: object
        properties:
          amount:
            type: number
          id:
            type: string
          modified_at:
            type: string
            format: date-time
  primary_keys:
  - id
  write:
  - upsert
  - append
- name: notes
  description: List notes
  source:
    config:
      path: /notes
      records_path: $.data[*]
      schema:
        type: object
        properties:
          body:
            type: string
          id:
            type: string
  primary_keys:
  - id
  write:
  - overwrite
  - upsert
- name: products
  description: List products
  source:
    config:
      path: /products
      pagination:
        type: LinkHeader
      schema:
        type: object
        properties:
          name:
            type: string
          sku:
            type: string
          tags:
            type: array
        required:
        - sku
  primary_keys:
  - sku
  write:
  - overwrite
  - upsert
