# Prometheus alert rules for faucet-stream (issue #200).
#
# Load via prometheus.yml:
#   rule_files:
#     - /etc/prometheus/faucet-alerts.yml
#
# Every metric name here is checked against the codebase by the
# `observability_artifacts` test in `cli/tests/` — if a metric is renamed,
# CI fails until this file is updated.

groups:
  - name: faucet-pipeline
    rules:
      - alert: FaucetPipelineErrorRateSpike
        expr: |
          sum by (pipeline) (rate(faucet_pipeline_runs_total{status="err"}[15m]))
            / clamp_min(sum by (pipeline) (rate(faucet_pipeline_runs_total[15m])), 1e-10)
            > 0.5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} failing more than half its runs"
          description: >
            Over the last 15 minutes more than 50% of runs of pipeline
            {{ $labels.pipeline }} ended in status="err". Check the run logs
            (`faucet_pipeline_runs_total` carries an error `kind` label) and
            the connector error counters.

      - alert: FaucetNoBookmarkProgress
        expr: |
          (time() - max by (pipeline, row) (faucet_pipeline_last_bookmark_unix_seconds)) > 3600
            and on (pipeline, row) max by (pipeline, row) (faucet_pipeline_in_flight) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} bookmark stale for over 1h"
          description: >
            Pipeline {{ $labels.pipeline }} (row {{ $labels.row }}) is running,
            but its newest bookmarked position is over an hour old — the
            incremental sync is not making durable progress. Only pipelines
            with a timestamp bookmark report it; a pipeline between scheduled
            runs is not checked.

      - alert: FaucetNoBookmarkProgressCritical
        expr: |
          (time() - max by (pipeline, row) (faucet_pipeline_last_bookmark_unix_seconds)) > 21600
            and on (pipeline, row) max by (pipeline, row) (faucet_pipeline_in_flight) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} bookmark stale for over 6h"
          description: >
            No durable progress for six hours while the pipeline runs.
            Downstream data is stale; investigate the source connection and
            the state store.

      - alert: FaucetSlaViolations
        expr: increase(faucet_pipeline_sla_violations_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "SLA violation on pipeline {{ $labels.pipeline }} ({{ $labels.kind }})"
          description: >
            The `sla:` monitor recorded a {{ $labels.kind }} violation
            (staleness / min_rows / volume anomaly / lag) in the last hour.

      - alert: FaucetSourceLagHigh
        expr: max by (pipeline, row, connector) (faucet_source_lag_bytes) > 1073741824 or max by (pipeline, row, connector) (faucet_source_lag_seconds) > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} is far behind its source ({{ $labels.connector }})"
          description: >
            The source reports over 1 GiB of unread change log or an oldest
            unread change over an hour old for row {{ $labels.row }}. A CDC
            slot this far behind also pins WAL/binlog on the source database.
            Check `faucet status --probe` and the sink's throughput.

      - alert: FaucetSourceThrottled
        expr: sum by (pipeline, row, connector) (rate(faucet_source_throttle_wait_seconds_sum[15m])) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} spends over a quarter of its time rate-limited ({{ $labels.connector }})"
          description: >
            Row {{ $labels.row }} has been sleeping on 429 / Retry-After
            responses for more than 25% of the last 15 minutes. Lower
            request concurrency, stagger schedules that share the API quota,
            or raise the quota. `faucet usage` shows the per-run throttled
            count and wait.

      - alert: FaucetBatchesRoutedWhole
        expr: increase(faucet_batch_outcomes_total{outcome=~"dlq_all|failed"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Sink writes failing whole on pipeline {{ $labels.pipeline }} ({{ $labels.sink }}, {{ $labels.outcome }})"
          description: >
            Whole sink writes failed in the last hour — routed to the DLQ by
            `on_batch_error: dlq_all`, or failed the run. Inspect the DLQ with
            `faucet dlq inspect` and the run's errors.

      - alert: FaucetProfileDrift
        expr: increase(faucet_profile_drift_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Column profile drift on pipeline {{ $labels.pipeline }} ({{ $labels.column }}.{{ $labels.metric }})"
          description: >
            The `profiling:` monitor found the column's {{ $labels.metric }}
            statistically different from its learned baseline in the last
            hour. Inspect with `faucet profiling show`; re-baseline a planned
            change with `faucet profiling reset`.

      - alert: FaucetCircuitBreakerOpen
        expr: faucet_resilience_circuit_state == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker open on pipeline {{ $labels.pipeline }}"
          description: >
            The resilience circuit breaker has been open for 5 minutes —
            consecutive fully-failed pages exceeded the configured threshold
            and writes are suspended.

  - name: faucet-governance
    rules:
      - alert: FaucetRowsUnaccounted
        expr: increase(faucet_rows_unaccounted_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Sink {{ $labels.connector }} lost rows without saying why on pipeline {{ $labels.pipeline }}"
          description: >
            A sink accepted fewer rows than it was offered and reported no
            coalesced, skipped or failed rows to explain the gap (row
            {{ $labels.row }}). The page failed before its bookmark advanced,
            but the sink is miscounting or silently dropping rows; check its
            connector version and the run's error.

      - alert: FaucetPolicyRuntimeViolations
        expr: increase(faucet_policy_violations_total{phase="runtime"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Data-flow policy rule {{ $labels.rule }} caught data at runtime on pipeline {{ $labels.pipeline }}"
          description: >
            The runtime policy backstop found labelled data the static check
            did not predict ({{ $labels.action }}). The rows were refused or
            quarantined; add a contract or sample so `faucet policy` sees the
            column before the run.

      - alert: FaucetVerifyDifferences
        expr: increase(faucet_verify_differences_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Destination differs from the source on pipeline {{ $labels.pipeline }} ({{ $labels.kind }})"
          description: >
            `faucet verify` found keys whose destination rows are missing,
            extra, changed or duplicated (row {{ $labels.row }}). Inspect with
            `faucet verify --json`; repair with `faucet verify --repair`.

  - name: faucet-cost
    rules:
      - alert: FaucetBudgetExceeded
        expr: increase(faucet_budget_exceeded_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} hit its {{ $labels.budget }} budget"
          description: >
            A run of row {{ $labels.row }} was stopped by its `budget:`
            ceiling. The page that would have crossed it was not written and
            the bookmark did not advance; raise the ceiling or narrow the run.

  - name: faucet-logs
    rules:
      - alert: FaucetLogsUndelivered
        expr: faucet_logs_oldest_undelivered_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Run logs not reaching the log service ({{ $labels.instance }})"
          description: >
            The oldest buffered run-log line has waited more than 15 minutes
            for the OTLP collector. Lines stay in the local buffer until
            delivered (bounded by the buffer max age / bytes); check the
            collector and `faucet_logs_export_errors_total`.

      - alert: FaucetLogsDropped
        expr: increase(faucet_logs_dropped_lines_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Run-log lines dropped before delivery ({{ $labels.reason }})"
          description: >
            The local log buffer dropped lines it could not deliver
            ({{ $labels.reason }}). Affected runs report `log_export.status:
            partially_dropped`.

  - name: faucet-schedule
    rules:
      - alert: FaucetStuckScheduler
        expr: time() - faucet_schedule_heartbeat_unix_seconds > 90
        labels:
          severity: critical
        annotations:
          summary: "Scheduler for {{ $labels.pipeline }} missed its heartbeat"
          description: >
            `faucet schedule` updates its heartbeat at least every 30s; 90s of
            silence means the scheduler process is stuck or dead.

      - alert: FaucetScheduleRunLateness
        expr: |
          histogram_quantile(0.95,
            sum by (pipeline, le) (rate(faucet_schedule_run_lateness_seconds_bucket[15m])))
            > 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled runs of {{ $labels.pipeline }} starting over 60s late (p95)"
          description: >
            Ticks are firing significantly later than their cron schedule —
            look for overlapping runs (`faucet_schedule_overlaps_total`) or
            resource starvation.

      - alert: FaucetConsecutiveScheduleFailures
        expr: faucet_schedule_consecutive_failures >= 3
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.pipeline }} has failed 3+ consecutive scheduled runs"
          description: >
            The scheduler exits after `max_consecutive_failures`; intervene
            before the resilience limit is reached.

  - name: faucet-serve
    rules:
      - alert: FaucetServeHistoryDegraded
        expr: faucet_serve_history_degraded == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "faucet serve run-history backend degraded"
          description: >
            The persistent history backend is unreachable and the server has
            fallen back to in-memory records — run history and idempotency
            guarantees are not durable. /readyz is reporting 503.

      - alert: FaucetServeHistoryUnreachable
        expr: faucet_serve_history_unreachable == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "faucet serve cannot reach its run-history database"
          description: >
            The last lease renewal did not reach the history database. In
            cluster mode the server does not fall back to memory: submissions
            fail, this instance cancels its own runs before their leases
            expire, and /readyz is reporting 503 until the database answers.

      - alert: FaucetServePoolStarved
        expr: min by (pool) (faucet_serve_runs_pending) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "runs in execution pool {{ $labels.pool }} have been pending for 15m"
          description: >
            Cluster runs in this pool have stayed unclaimed for 15 minutes:
            no live replica serves the pool (its last replica drained or
            crashed), or every replica serving it is at its concurrency
            limit. Runs of a pool are never claimed by another pool's
            replicas. Start or scale a replica with `--pool {{ $labels.pool }}`,
            or set `--pool-wait-timeout-secs` to fail such runs instead.

      - alert: FaucetServePoolRunsFailed
        expr: increase(faucet_serve_runs_total{reason="pool_unavailable"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "runs failed because no replica served their execution pool"
          description: >
            `--pool-wait-timeout-secs` failed pending runs whose pool no live
            cluster member served for the whole timeout. Their error starts
            with `pool_unavailable`; resubmit them once a replica of the pool
            is running.

      - alert: FaucetServeScheduleTicksMissed
        expr: increase(faucet_serve_trigger_missed_ticks_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "schedule trigger {{ $labels.trigger }} skipped ticks"
          description: >
            Scheduled ticks passed without a run, usually because no faucet
            serve instance was running. With catch_up (the default) only the
            latest missed tick ran; check whether the skipped windows need a
            backfill.

      - alert: FaucetServeConnectionsNeedReauth
        expr: max(faucet_serve_connections{status="needs_reauth"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tenant connections need re-authorization"
          description: >
            {{ $value }} tenant connection(s) were revoked by their provider.
            Runs that reference them are refused until the tenant reconnects
            through the connect flow.

      - alert: FaucetServeTemplateSyncFailing
        expr: increase(faucet_serve_template_sync_runs_total{outcome="error"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Template sync from origin {{ $labels.origin }} is failing"
          description: >
            Pulls from this origin failed in the last hour, so the registry
            no longer matches it. Check the origin's credentials and
            reachability; `faucet template sync --dry-run` shows the error.

      - alert: FaucetNotificationsFailing
        expr: increase(faucet_notifications_sent_total{outcome="error"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Notifications to {{ $labels.channel }} are failing ({{ $labels.event }})"
          description: >
            Deliveries to this channel failed in the last hour, so on-call is
            not hearing about {{ $labels.event }} events. Check the channel's
            webhook URL or token.

  - name: faucet-telemetry
    rules:
      - alert: FaucetOtelExportFailures
        expr: increase(faucet_otel_export_failures_total[15m]) > 0
        labels:
          severity: info
        annotations:
          summary: "OTLP telemetry exports failing ({{ $labels.signal }})"
          description: >
            Traces/metrics are not reaching the OTLP collector. Pipelines are
            unaffected (export failures never propagate).

      - alert: FaucetLineageEventsDropped
        expr: increase(faucet_lineage_dropped_total[15m]) > 0
        labels:
          severity: info
        annotations:
          summary: "OpenLineage events dropped ({{ $labels.reason }})"
          description: >
            Lineage emission is failing (transport error or queue overflow).
            Pipelines are unaffected; the lineage graph has gaps.
