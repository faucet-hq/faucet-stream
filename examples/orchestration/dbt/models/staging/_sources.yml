version: 2

sources:
  - name: raw
    # The schema faucet's Postgres sink writes into (default: public).
    schema: public
    tables:
      - name: charges_raw
        description: >
          Raw payment charges as loaded by faucet — one row per charge, the full
          API payload in the JSONB column `data`.
        columns:
          - name: data
            description: Full source record (JSONB).
