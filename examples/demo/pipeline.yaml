# Self-contained no-infrastructure demo: CSV -> JSON Lines.
# Run from the repo root with `make demo`, or directly:
#   faucet run examples/demo/pipeline.yaml
version: 1
name: demo
pipeline:
  source:
    type: file
    config:
      path: examples/demo/input.csv
  sink:
    type: file
    config:
      path: target/demo/out.jsonl
