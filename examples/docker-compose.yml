# Local infrastructure for running the faucet-stream examples.
#
#   docker compose -f examples/docker-compose.yml up -d
#   faucet run cli/examples/postgres_cdc_to_jsonl.yaml
#   docker compose -f examples/docker-compose.yml down -v   # stop + wipe
#
# Every service binds to localhost on its default port and uses the
# credentials baked into the example configs (user/pass: faucet/faucet where
# applicable). This stack is for local development only — never production.
#
# See examples/README.md for which example needs which service.

version: "3.8"

name: faucet-examples

services:
  # PostgreSQL configured for logical replication so the postgres-cdc source
  # works out of the box. The init script seeds a `users` table + publication.
  postgres:
    image: postgres:17
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    environment:
      POSTGRES_USER: faucet
      POSTGRES_PASSWORD: faucet
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faucet -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MySQL configured for binlog-based CDC so the mysql-cdc source works out of
  # the box. The init script creates the `repl` user with replication grants.
  mysql:
    image: mysql:8
    command:
      - "--server-id=1"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--binlog-row-metadata=FULL"
    environment:
      MYSQL_ROOT_PASSWORD: faucet
      MYSQL_DATABASE: appdb
      MYSQL_USER: faucet
      MYSQL_PASSWORD: faucet
    ports:
      - "3306:3306"
    volumes:
      - ./infra/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pfaucet"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redpanda speaks the Kafka API — lighter than Kafka + ZooKeeper for local use.
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --overprovisioned
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # RabbitMQ with the management UI (http://localhost:15672, guest/guest) for
  # the rabbitmq source/sink examples.
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MongoDB as a single-node replica set so the mongodb-cdc source (Change
  # Streams require a replica set) works out of the box. The healthcheck
  # self-initiates the set on first run. Query-mode mongodb examples connect to
  # the primary without the `?replicaSet=` param and work unchanged.
  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      # Idempotent: initiates the replica set on the first check, then reports
      # healthy once a primary is writable.
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "--eval"
        - "try { db.hello().isWritablePrimary } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } finally { quit(db.hello().isWritablePrimary ? 0 : 1) }"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO is S3-compatible — point the S3 source/sink at http://localhost:9000
  # with an endpoint override and the credentials below.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: faucet
      MINIO_ROOT_PASSWORD: faucetfaucet
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Microsoft SQL Server (Developer edition) for the mssql source/sink examples.
  # ~1.5 GB image — start it explicitly (`docker compose up -d mssql mssql-init`)
  # if you only want this one.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng@Pass"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      # The server image doesn't bundle sqlcmd; a bash /dev/tcp probe confirms
      # the TDS port is accepting connections.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # One-shot: waits for SQL Server, then creates the `sales` / `analytics` / `raw`
  # databases and the sample tables the mssql examples use.
  mssql-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./infra/mssql-init.sql:/init.sql:ro
    entrypoint:
      - bash
      - -c
      - >
        for i in $$(seq 1 30); do
          /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P "Str0ng@Pass" -b -Q "SELECT 1" && break;
          echo "waiting for sql server ($$i)..."; sleep 2;
        done;
        /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P "Str0ng@Pass" -b -i /init.sql
    restart: "no"

  # ── Observability (issue #200): Prometheus + Grafana with the shipped ────
  # dashboards/alerts provisioned automatically. Start with:
  #   docker compose -f examples/docker-compose.yml up -d prometheus grafana
  # Prometheus scrapes a faucet process on the HOST (enable the exporter with
  # `observability: { prometheus: { listen_addr: 0.0.0.0:9464 } }`).
  prometheus:
    image: prom/prometheus:v3.4.1
    ports:
      - "9095:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/faucet-alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.0.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
