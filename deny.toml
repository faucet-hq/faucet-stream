# cargo-deny configuration — supply-chain checks run in CI.
#   cargo deny check
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Security advisories from the RustSec database. Yanked crates are denied by
# default. "unmaintained" covers every crate in the tree (#929), so a newly
# abandoned dependency fails CI; transitive ones we cannot move are ignored
# below with a dated reason.
#
# The check is a HARD gate in CI (#789 SUPPLY-03): a new advisory fails the
# build until it is fixed (bump to a fixed version) or triaged here with a
# dated reason. A scheduled workflow (`advisories.yml`) re-runs it daily and
# opens an issue, so an advisory published between merges is not missed.
# Re-triage every entry when its dependency moves; drop it once fixed.
unmaintained = "all"
ignore = [
    # 2026-10-27 — unmaintained, transitive only, no maintained release of the
    # parents yet (#929 section 3). Drop each when its parent moves.
    { id = "RUSTSEC-2024-0436", reason = "paste via parquet 58, oracle, metainfo/volo (iceberg HMS) (2026-10-27)" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 via mysql-common-derive and validator_derive (2026-10-27)" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml; replaced in the YAML move (#929, #935) (2026-10-27)" },
    # 2026-10-16 — no fixed release (Marvin timing side channel). Our own JWT
    # signing moved to aws-lc-rs (#818); `rsa` is left only upstream: opendal's
    # reqsign (Google service-account signing for Iceberg warehouses), russh
    # client auth (rsa 0.10 rc), and sqlx-mysql's public-key password
    # encryption (not a private-key operation). An attacker needs precise
    # timing of many signatures on the signing host.
    { id = "RUSTSEC-2023-0071", reason = "no fix; upstream signers only (reqsign, russh) (2026-10-16)" },
    # 2026-10-24 — crypto-bigint timing branches (RUSTSEC-2026-0387). The 0.7
    # line is on the patched 0.7.6; only 0.5.5 remains, via aws-sigv4 (SigV4a
    # request signing) -> ecdsa 0.16 -> elliptic-curve 0.13, with no fixed 0.5.x.
    # An attacker needs precise timing of many signatures on the signing host.
    # Scoped to 0.5.5 by scripts/advisory-scope.py; drop when aws-sigv4 moves to
    # elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "only crypto-bigint 0.5.5 via aws-sigv4 remains; no 0.5.x fix (2026-10-24)" },
    # 2026-10-07 — quick-xml: faucet's own parsers and calamine are on >= 0.41
    # (RUSTSEC-2026-0194/0195 fixed). Two older copies remain transitively and
    # cannot move until their parents do: 0.39 from object_store 0.13 (pinned by
    # parquet 58) and opendal 0.57 (pinned by iceberg 0.10), which parse only
    # the configured storage endpoint's list responses and never use NsReader.
    # cargo-deny cannot scope an advisory ignore to one version, so
    # scripts/advisory-scope.py (CI) fails on any other affected quick-xml copy;
    # drop these two ids once object_store/opendal move past 0.41.
    { id = "RUSTSEC-2026-0194", reason = "only transitive quick-xml 0.39 (object_store/opendal) and 0.31 (azure dev-dep) remain (2026-10-07)" },
    { id = "RUSTSEC-2026-0195", reason = "only transitive quick-xml 0.39 / 0.31 remain; NsReader unused (2026-10-07)" },
    # 2026-10-26 — zstd-rs advisories. zstd-sys is on the patched 2.1.2
    # (RUSTSEC-2026-0410) and async-compression (our async .zst reader/writer)
    # on zstd 0.14.3 / zstd-safe 8.2.0. zstd 0.13.3 / zstd-safe 7.3.0 remain
    # because parquet, arrow-ipc, apache-avro, iceberg, orc-rust, mysql_common
    # and tonic require zstd 0.13 in their newest releases, and faucet-core's
    # public `SyncCompressWriter::Zstd` wraps a 0.13 encoder (moving it is a
    # breaking change). None of them calls `with_context` (0391) or `Seekable`
    # (0398). 0403 is reachable: a streaming `zstd::Decoder` reading a
    # legacy-format frame that fails to decode. Scoped by
    # scripts/advisory-scope.py; drop when the zstd 0.13 users move to 0.14.
    { id = "RUSTSEC-2026-0391", reason = "only zstd 0.13.3 via upstream crates remains; with_context unused (2026-10-26)" },
    { id = "RUSTSEC-2026-0398", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; Seekable unused (2026-10-26)" },
    { id = "RUSTSEC-2026-0403", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains (upstream pins + faucet-core public type); legacy-frame decode errors only (2026-10-26)" },
    # 2026-10-28 — the next zstd-safe batch (0395–0406): dictionaries, Seekable,
    # try_clone, train_from_buffer, multithreaded parameters and raw buffer
    # positions. Only zstd-safe 7.3.0 via zstd 0.13 remains (same upstream pins as
    # above); faucet and its dependents use only zstd's streaming Encoder/Decoder,
    # none of these APIs. Scoped by scripts/advisory-scope.py.
    { id = "RUSTSEC-2026-0395", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; affected APIs unused (2026-10-28)" },
    { id = "RUSTSEC-2026-0396", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; affected APIs unused (2026-10-28)" },
    { id = "RUSTSEC-2026-0397", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; affected APIs unused (2026-10-28)" },
    { id = "RUSTSEC-2026-0399", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; affected APIs unused (2026-10-28)" },
    { id = "RUSTSEC-2026-0400", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; affected APIs unused (2026-10-28)" },
    { id = "RUSTSEC-2026-0401", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; affected APIs unused (2026-10-28)" },
    { id = "RUSTSEC-2026-0402", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; affected APIs unused (2026-10-28)" },
    { id = "RUSTSEC-2026-0404", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; affected APIs unused (2026-10-28)" },
    { id = "RUSTSEC-2026-0405", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; affected APIs unused (2026-10-28)" },
    { id = "RUSTSEC-2026-0406", reason = "only zstd-safe 7.3.0 via zstd 0.13 remains; affected APIs unused (2026-10-28)" },
]

[licenses]
version = 2
# Permissive licenses we accept across the dependency tree. Keep this list tight;
# add a license only after confirming the dependency that needs it.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Per-crate license clarifications go here if a crate's license can't be detected.
exceptions = []

[bans]
# Duplicate dependency versions and wildcard version requirements are warnings,
# not errors — a large connector tree legitimately pulls multiple versions.
multiple-versions = "warn"
wildcards = "warn"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
