# cargo-deny configuration — supply-chain checks run in CI.
#   cargo deny check
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Security advisories from the RustSec database. Yanked crates are denied by
# default. "unmaintained" covers only workspace crates (transitive helpers are
# noisy and rarely actionable).
#
# The check is a HARD gate in CI (#789 SUPPLY-03): a new advisory fails the
# build until it is fixed (bump to a fixed version) or triaged here with a
# dated reason. A scheduled workflow (`advisories.yml`) re-runs it daily and
# opens an issue, so an advisory published between merges is not missed.
# Re-triage every entry when its dependency moves; drop it once fixed.
unmaintained = "workspace"
ignore = [
    # 2026-10-07 — no fixed release (Marvin timing side channel). Reached by
    # local key-pair JWT signing (snowflake key-pair auth, jsonwebtoken via
    # gcloud-auth) and russh client auth; an attacker needs precise timing of
    # many signatures on the signing host.
    { id = "RUSTSEC-2023-0071", reason = "no fix; signing-host timing only (2026-10-07)" },
    # 2026-10-07 — rustls 0.21 / rustls-webpki 0.101 are compiled into the AWS
    # SDK's legacy hyper-0.14 connector; the SDK runs on its hyper-1 / rustls
    # 0.23 client, so this stack is never used for a connection.
    { id = "RUSTSEC-2026-0098", reason = "AWS SDK legacy connector, unused at run time (2026-10-07)" },
    { id = "RUSTSEC-2026-0099", reason = "AWS SDK legacy connector, unused at run time (2026-10-07)" },
    { id = "RUSTSEC-2026-0104", reason = "AWS SDK legacy connector, unused at run time (2026-10-07)" },
    # 2026-10-07 — h2 0.3 has no fixed release; same legacy AWS connector as
    # above (the live client uses h2 0.4.20).
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3 only in the unused AWS legacy connector; 0.4 is fixed (2026-10-07)" },
    # 2026-10-07 — azure_core 0.21 / http-types / quick-xml 0.31 come only from
    # azure_storage_blobs, a dev-dependency of the azure-blob sink tests.
    { id = "RUSTSEC-2026-0275", reason = "dev-dependency only (azure-blob tests) (2026-10-07)" },
    { id = "RUSTSEC-2026-0174", reason = "dev-dependency only (azure-blob tests) (2026-10-07)" },
    # 2026-10-07 — tokio-postgres / postgres-protocol are dev-dependencies of
    # the postgres-cdc tests and the CLI tests only.
    { id = "RUSTSEC-2026-0178", reason = "dev-dependency only (postgres-cdc / cli tests) (2026-10-07)" },
    { id = "RUSTSEC-2026-0179", reason = "dev-dependency only (postgres-cdc / cli tests) (2026-10-07)" },
    { id = "RUSTSEC-2026-0180", reason = "dev-dependency only (postgres-cdc / cli tests) (2026-10-07)" },
    # 2026-10-07 — quick-xml: the fix (0.41) changes how entity references are
    # reported and needs a parser rewrite in core/xml/rest; until then every
    # call site turns the quadratic duplicate-attribute check off
    # (`with_checks(false)`). 0.39 comes from object_store, which parses the
    # configured storage endpoint's list responses. `NsReader` (0195) is used
    # nowhere.
    { id = "RUSTSEC-2026-0194", reason = "duplicate checks disabled at every call site; object_store pins 0.39 (2026-10-07)" },
    { id = "RUSTSEC-2026-0195", reason = "NsReader is not used (2026-10-07)" },
]

[licenses]
version = 2
# Permissive licenses we accept across the dependency tree. Keep this list tight;
# add a license only after confirming the dependency that needs it.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Per-crate license clarifications go here if a crate's license can't be detected.
exceptions = []

[bans]
# Duplicate dependency versions and wildcard version requirements are warnings,
# not errors — a large connector tree legitimately pulls multiple versions.
multiple-versions = "warn"
wildcards = "warn"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
